<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - WAT ERP</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .reset-box h1 {
            text-align: center;
            color: #0866ff;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 25px;
        }

        .reset-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .reset-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 14px;
        }

        .reset-box input:focus {
            outline: none;
            border-color: #0866ff;
            box-shadow: 0 0 0 3px rgba(8,102,255,.10);
        }

        .reset-box button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0866ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-box button:hover {
            background: #0055dd;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0866ff;
            text-decoration: none;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="reset-container">

    <div class="reset-box">

        <h1>WAT ERP</h1>

        <p class="subtitle">
            Buat Password Baru
        </p>


        <form id="updatePasswordForm">

            <label for="newPassword">
                Password Baru
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Masukkan password baru"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Konfirmasi Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Ulangi password baru"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="updateButton"
            >
                SIMPAN PASSWORD
            </button>

        </form>


        <p id="message"></p>


        <a
            href="login.html"
            class="login-link"
        >
            ← Kembali ke Login
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   CEK RECOVERY SESSION
========================= */

let recoveryReady = false;


supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(event === "PASSWORD_RECOVERY") {

            recoveryReady = true;

            console.log(
                "Recovery session berhasil."
            );

        }

    }
);


/*
   Beri waktu Supabase membaca
   token dari URL
*/

setTimeout(async () => {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if(session){

        recoveryReady = true;

    }

}, 1000);


/* =========================
   UPDATE PASSWORD
========================= */

document
.getElementById("updatePasswordForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const password =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const button =
        document.getElementById("updateButton");

    const message =
        document.getElementById("message");


    message.textContent = "";


    /* CHECK PASSWORD */

    if(password.length < 6){

        message.style.color = "red";

        message.textContent =
            "Password minimal 6 karakter.";

        return;
    }


    if(password !== confirmPassword){

        message.style.color = "red";

        message.textContent =
            "Konfirmasi password tidak sama.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "MENYIMPAN...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if(error){

        message.style.color = "red";

        message.textContent =
            "Gagal mengubah password: " +
            error.message;

        button.disabled = false;

        button.textContent =
            "SIMPAN PASSWORD";

        return;
    }


    message.style.color = "green";

    message.textContent =
        "Password berhasil diubah. Silakan login kembali.";


    button.textContent =
        "BERHASIL";


    /*
       Logout setelah password berhasil
    */

    setTimeout(async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
            "login.html";

    }, 1800);

});

</script>

</body>

</html>
