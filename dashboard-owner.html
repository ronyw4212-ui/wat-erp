<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Material - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#102a43;
}

header{
    background:linear-gradient(90deg,#1257b8,#0878f9);
    color:#fff;
    padding:17px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:20px;
    font-weight:bold;
}

.brand small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.role{
    background:rgba(255,255,255,.16);
    padding:8px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#fff;
    color:#1267e8;
}

.container{
    max-width:1050px;
    margin:28px auto;
    padding:0 16px 50px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    margin:0 0 5px;
    font-size:27px;
}

h2{
    margin:0 0 18px;
    font-size:20px;
}

p{
    margin:0;
    color:#627d98;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(16,42,67,.08);
    border-left:4px solid #1267e8;
}

.card:nth-child(2){
    border-color:#16a34a;
}

.card:nth-child(3){
    border-color:#f59e0b;
}

.card small{
    color:#627d98;
}

.card strong{
    display:block;
    margin-top:8px;
    font-size:24px;
}

.box{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(16,42,67,.08);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-family:inherit;
    background:#fff;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.actions{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.primary{
    background:#1267e8;
    color:#fff;
}

.secondary{
    background:#e8eef7;
    color:#102a43;
}

.success{
    background:#16a34a;
    color:#fff;
}

.danger{
    background:#dc2626;
    color:#fff;
}

.filter{
    display:grid;
    grid-template-columns:1fr 180px auto;
    gap:10px;
    margin-bottom:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#edf3fa;
    padding:12px;
    text-align:left;
    font-size:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.active{
    background:#dcfce7;
    color:#15803d;
}

.inactive{
    background:#fee2e2;
    color:#b91c1c;
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
}

.message.ok{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    text-align:center;
    padding:25px;
    color:#627d98;
}

@media(max-width:700px){

    .cards,
    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .filter{
        grid-template-columns:1fr;
    }

    .top{
        align-items:flex-start;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        WAT ERP
        <small>Master Material</small>
    </div>

    <div class="header-right">
        <span class="role" id="userName">OWNER</span>

        <button class="logout" onclick="logout()">
            LOGOUT
        </button>
    </div>

</header>


<div class="container">

    <div class="top">

        <div>
            <h1>Master Material</h1>
            <p>Kelola material, stok dan harga modal.</p>
        </div>

        <button
            class="secondary"
            onclick="location.href='dashboard-owner.html'">
            ← Dashboard
        </button>

    </div>


    <div id="message" class="message"></div>


    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">
            <small>Material Aktif</small>
            <strong id="totalMaterial">0</strong>
        </div>

        <div class="card">
            <small>Total Stok</small>
            <strong id="totalStock">0</strong>
        </div>

        <div class="card">
            <small>Nilai Persediaan</small>
            <strong id="stockValue">Rp 0</strong>
        </div>

    </div>


    <!-- FORM -->

    <div class="box">

        <h2>Tambah Material</h2>

        <form id="materialForm">

            <div class="grid">

                <div>
                    <label>Kode Material *</label>
                    <input
                        id="materialCode"
                        placeholder="MAT-001"
                        required>
                </div>


                <div>
                    <label>Nama Material *</label>
                    <input
                        id="materialName"
                        placeholder="Freon R32"
                        required>
                </div>


                <div>
                    <label>Satuan *</label>

                    <select id="materialUnit" required>

                        <option value="">
                            -- Pilih Satuan --
                        </option>

                        <option value="pcs">pcs</option>
                        <option value="unit">unit</option>
                        <option value="set">set</option>
                        <option value="buah">buah</option>
                        <option value="kg">kg</option>
                        <option value="liter">liter</option>
                        <option value="meter">meter</option>
                        <option value="roll">roll</option>
                        <option value="box">box</option>
                        <option value="pack">pack</option>

                    </select>
                </div>


                <div>
                    <label>Stok Awal</label>

                    <input
                        id="initialStock"
                        type="number"
                        min="0"
                        step="0.01"
                        value="0">
                </div>


                <div>
                    <label>Harga Modal / Satuan</label>

                    <input
                        id="averageCost"
                        type="number"
                        min="0"
                        step="0.01"
                        value="0">
                </div>


                <div>
                    <label>Status</label>

                    <select id="materialStatus">

                        <option value="ACTIVE">
                            Aktif
                        </option>

                        <option value="INACTIVE">
                            Nonaktif
                        </option>

                    </select>
                </div>


                <div class="full">

                    <label>Catatan</label>

                    <textarea
                        id="materialNotes"
                        placeholder="Catatan material..."></textarea>

                </div>

            </div>


            <div class="actions">

                <button
                    type="reset"
                    class="secondary">
                    Reset
                </button>

                <button
                    type="submit"
                    class="primary"
                    id="saveButton">
                    Simpan Material
                </button>

            </div>

        </form>

    </div>


    <!-- LIST -->

    <div class="box">

        <h2>Daftar Material</h2>


        <div class="filter">

            <input
                id="search"
                placeholder="Cari kode atau nama...">


            <select id="statusFilter">

                <option value="ALL">
                    Semua Status
                </option>

                <option value="ACTIVE">
                    Aktif
                </option>

                <option value="INACTIVE">
                    Nonaktif
                </option>

            </select>


            <button
                class="secondary"
                onclick="loadMaterials()">
                Refresh
            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>Kode</th>
                        <th>Material</th>
                        <th>Satuan</th>
                        <th>Stok</th>
                        <th>Harga Modal</th>
                        <th>Nilai Stok</th>
                        <th>Status</th>
                        <th>Aksi</th>

                    </tr>

                </thead>

                <tbody id="materialTable">

                    <tr>
                        <td
                            colspan="8"
                            class="empty">
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
   =====================================================

   BRO:
   COPY URL DAN ANON KEY DARI PENGELUARAN.HTML
   YANG SUDAH BERHASIL.

   CONTOH FORMAT SAJA:
   https://xxxxx.supabase.co
   eyJhbGciOi...
===================================================== */

const SUPABASE_URL =
    "PASTE_URL_SUPABASE_DARI_PENGELUARAN_HTML";

const SUPABASE_ANON_KEY =
    "PASTE_ANON_KEY_DARI_PENGELUARAN_HTML";


/* =====================================================
   CONNECT
===================================================== */

const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let currentUser = null;
let materials = [];


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    start
);


async function start(){

    try{

        const {
            data,
            error
        } =
        await client.auth.getUser();


        if(error){
            throw error;
        }


        if(!data.user){

            location.href =
                "login.html";

            return;
        }


        currentUser =
            data.user;


        document.getElementById(
            "userName"
        ).textContent =
            currentUser.email ||
            "OWNER";


        await loadMaterials();

    }
    catch(error){

        console.error(
            "INIT ERROR:",
            error
        );

        showMessage(
            "Gagal menghubungkan ke database: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterials(){

    const table =
        document.getElementById(
            "materialTable"
        );


    table.innerHTML = `
        <tr>
            <td colspan="8" class="empty">
                Memuat data...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
        await client
            .from("materials")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        materials =
            data || [];


        renderMaterials();
        updateSummary();

    }
    catch(error){

        console.error(
            "LOAD MATERIAL ERROR:",
            error
        );


        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty">
                    Gagal memuat data material.
                    <br><br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMaterials(){

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById("statusFilter")
            .value;


    const filtered =
        materials.filter(item=>{

            const matchSearch =
                !search ||

                String(
                    item.material_code || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    item.name || ""
                )
                .toLowerCase()
                .includes(search);


            const matchStatus =
                status === "ALL" ||
                item.status === status;


            return (
                matchSearch &&
                matchStatus
            );

        });


    const table =
        document.getElementById(
            "materialTable"
        );


    if(!filtered.length){

        table.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty">
                    Belum ada material.
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        filtered.map(item=>{

            const stock =
                Number(
                    item.current_stock || 0
                );


            const cost =
                Number(
                    item.average_cost || 0
                );


            const value =
                stock * cost;


            const active =
                item.status === "ACTIVE";


            return `

            <tr>

                <td>
                    <b>
                        ${escapeHtml(
                            item.material_code
                        )}
                    </b>
                </td>


                <td>
                    ${escapeHtml(
                        item.name
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.unit
                    )}
                </td>


                <td>
                    ${formatNumber(stock)}
                </td>


                <td>
                    ${formatRupiah(cost)}
                </td>


                <td>
                    ${formatRupiah(value)}
                </td>


                <td>

                    <span class="badge ${
                        active
                        ? "active"
                        : "inactive"
                    }">

                        ${
                            active
                            ? "AKTIF"
                            : "NONAKTIF"
                        }

                    </span>

                </td>


                <td>

                    <button
                        class="secondary"
                        onclick="editMaterial('${item.id}')">
                        Edit
                    </button>

                    <button
                        class="${
                            active
                            ? "danger"
                            : "success"
                        }"
                        onclick="toggleStatus(
                            '${item.id}',
                            '${item.status}'
                        )">

                        ${
                            active
                            ? "Nonaktif"
                            : "Aktif"
                        }

                    </button>

                </td>

            </tr>

            `;

        }).join("");

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const active =
        materials.filter(
            item =>
                item.status === "ACTIVE"
        );


    const totalStock =
        active.reduce(
            (total,item)=>
                total +
                Number(
                    item.current_stock || 0
                ),
            0
        );


    const stockValue =
        active.reduce(
            (total,item)=>
                total +

                (
                    Number(
                        item.current_stock || 0
                    )

                    *

                    Number(
                        item.average_cost || 0
                    )
                ),

            0
        );


    document.getElementById(
        "totalMaterial"
    ).textContent =
        active.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        formatNumber(totalStock);


    document.getElementById(
        "stockValue"
    ).textContent =
        formatRupiah(stockValue);

}


/* =====================================================
   SAVE
===================================================== */

document
    .getElementById("materialForm")
    .addEventListener(
        "submit",
        saveMaterial
    );


async function saveMaterial(event){

    event.preventDefault();


    const code =
        document
            .getElementById("materialCode")
            .value
            .trim()
            .toUpperCase();


    const name =
        document
            .getElementById("materialName")
            .value
            .trim();


    const unit =
        document
            .getElementById("materialUnit")
            .value;


    const stock =
        Number(
            document
                .getElementById("initialStock")
                .value || 0
        );


    const cost =
        Number(
            document
                .getElementById("averageCost")
                .value || 0
        );


    const status =
        document
            .getElementById("materialStatus")
            .value;


    const notes =
        document
            .getElementById("materialNotes")
            .value
            .trim();


    if(!code || !name || !unit){

        showMessage(
            "Kode, nama dan satuan wajib diisi.",
            "error"
        );

        return;

    }


    if(stock < 0 || cost < 0){

        showMessage(
            "Stok dan harga tidak boleh negatif.",
            "error"
        );

        return;

    }


    const duplicate =
        materials.some(
            item =>
                String(
                    item.material_code || ""
                ).toUpperCase() === code
        );


    if(duplicate){

        showMessage(
            "Kode material sudah digunakan.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled = true;
    button.textContent =
        "Menyimpan...";


    try{

        const {
            error
        } =
        await client
            .from("materials")
            .insert({

                material_code:code,

                name:name,

                unit:unit,

                current_stock:stock,

                average_cost:cost,

                status:status,

                notes:
                    notes || null,

                created_by:
                    currentUser.id

            });


        if(error){

            throw error;

        }


        showMessage(
            "Material berhasil disimpan.",
            "ok"
        );


        document
            .getElementById(
                "materialForm"
            )
            .reset();


        document
            .getElementById(
                "initialStock"
            )
            .value = 0;


        document
            .getElementById(
                "averageCost"
            )
            .value = 0;


        await loadMaterials();

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showMessage(
            "Gagal menyimpan: " +
            error.message,
            "error"
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "Simpan Material";

    }

}


/* =====================================================
   EDIT
===================================================== */

async function editMaterial(id){

    const item =
        materials.find(
            x => x.id === id
        );


    if(!item){
        return;
    }


    const name =
        prompt(
            "Nama material:",
            item.name
        );


    if(name === null){
        return;
    }


    const unit =
        prompt(
            "Satuan:",
            item.unit
        );


    if(unit === null){
        return;
    }


    const cost =
        prompt(
            "Harga modal / satuan:",
            item.average_cost || 0
        );


    if(cost === null){
        return;
    }


    try{

        const {
            error
        } =
        await client
            .from("materials")
            .update({

                name:name.trim(),

                unit:unit.trim(),

                average_cost:
                    Number(cost),

                updated_at:
                    new Date()
                    .toISOString()

            })
            .eq(
                "id",
                id
            );


        if(error){
            throw error;
        }


        showMessage(
            "Material berhasil diperbarui.",
            "ok"
        );


        await loadMaterials();

    }
    catch(error){

        showMessage(
            "Gagal update: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

async function toggleStatus(
    id,
    currentStatus
){

    const nextStatus =
        currentStatus === "ACTIVE"
        ? "INACTIVE"
        : "ACTIVE";


    const action =
        nextStatus === "ACTIVE"
        ? "mengaktifkan"
        : "menonaktifkan";


    if(
        !confirm(
            `Yakin ingin ${action} material ini?`
        )
    ){

        return;

    }


    try{

        const {
            error
        } =
        await client
            .from("materials")
            .update({

                status:
                    nextStatus,

                updated_at:
                    new Date()
                    .toISOString()

            })
            .eq(
                "id",
                id
            );


        if(error){
            throw error;
        }


        showMessage(
            "Status material berhasil diperbarui.",
            "ok"
        );


        await loadMaterials();

    }
    catch(error){

        showMessage(
            "Gagal mengubah status: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderMaterials
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        renderMaterials
    );


/* =====================================================
   FORMAT
===================================================== */

function formatRupiah(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value || 0)
    );

}


function formatNumber(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            maximumFractionDigits:2
        }
    ).format(
        Number(value || 0)
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " + type;


    box.style.display =
        "block";


    setTimeout(
        ()=>{
            box.style.display =
                "none";
        },
        5000
    );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await client.auth.signOut();

    location.href =
        "login.html";

}

</script>

</body>
</html>
