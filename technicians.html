<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teknisi - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

.header{
    height:72px;
    background:#1473f9;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:11px;
    margin-top:4px;
}

.header-right{
    display:flex;
    gap:12px;
    align-items:center;
}

.badge-owner{
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.logout{
    border:none;
    background:white;
    color:#1268df;
    padding:10px 18px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1050px;
    margin:28px auto;
    padding:0 20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

h1{
    font-size:27px;
}

.desc{
    color:#718096;
    margin-top:5px;
    font-size:14px;
}

.btn-add{
    background:#126df5;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(18,109,245,.25);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.card{
    background:white;
    border-radius:10px;
    padding:18px 20px;
    box-shadow:0 3px 12px rgba(20,40,80,.07);
}

.card-title{
    font-size:12px;
    color:#718096;
    margin-bottom:8px;
}

.card-number{
    font-size:25px;
    font-weight:bold;
}

.card.total{
    border-left:4px solid #126df5;
}

.card.active{
    border-left:4px solid #16a34a;
}

.card.inactive{
    border-left:4px solid #ef4444;
}

.search-box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(20,40,80,.07);
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:12px 14px;
    border:1px solid #d7dfeb;
    border-radius:7px;
    outline:none;
}

.table-box{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(20,40,80,.07);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f8fafc;
    text-align:left;
    padding:14px;
    font-size:11px;
    color:#475569;
}

td{
    padding:14px;
    border-top:1px solid #edf1f5;
    font-size:13px;
}

.code{
    font-weight:bold;
    color:#126df5;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.status.active{
    background:#dcfce7;
    color:#15803d;
}

.status.inactive{
    background:#fee2e2;
    color:#dc2626;
}

.device{
    font-size:11px;
    color:#64748b;
}

.action{
    border:none;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    margin-right:4px;
}

.edit{
    background:#e8f1ff;
    color:#126df5;
}

.toggle{
    background:#ecfdf5;
    color:#059669;
}

.empty{
    text-align:center;
    padding:45px;
    color:#718096;
}

/* MODAL */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal{
    background:white;
    width:620px;
    max-width:92%;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    padding:20px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:18px;
}

.close{
    border:none;
    background:none;
    font-size:23px;
    color:#64748b;
    cursor:pointer;
}

.modal-body{
    padding:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:12px;
    font-weight:bold;
    color:#475569;
    margin-bottom:7px;
}

input,select,textarea{
    padding:11px 12px;
    border:1px solid #d7dfeb;
    border-radius:7px;
    outline:none;
    font-size:13px;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.modal-footer{
    padding:16px 20px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.btn-cancel{
    border:none;
    background:#e8edf3;
    color:#334155;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.btn-save{
    border:none;
    background:#126df5;
    color:white;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .table-box{
        overflow-x:auto;
    }

    table{
        min-width:800px;
    }

    .top{
        align-items:flex-start;
        gap:15px;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="header">
    <div>
        <div class="logo">WAT ERP</div>
        <div class="subtitle">Technician Control System</div>
    </div>

    <div class="header-right">
        <div class="badge-owner">OWNER</div>
        <button class="logout" onclick="logout()">LOGOUT</button>
    </div>
</header>

<main class="container">

    <div class="top">
        <div>
            <h1>Teknisi</h1>
            <div class="desc">Kelola data teknisi dan perangkat WAT ERP.</div>
        </div>

        <button class="btn-add" onclick="openModal()">
            + Tambah Teknisi
        </button>
    </div>

    <div class="stats">

        <div class="card total">
            <div class="card-title">Total Teknisi</div>
            <div class="card-number" id="totalTeknisi">0</div>
        </div>

        <div class="card active">
            <div class="card-title">Teknisi Aktif</div>
            <div class="card-number" id="activeTeknisi">0</div>
        </div>

        <div class="card inactive">
            <div class="card-title">Teknisi Nonaktif</div>
            <div class="card-number" id="inactiveTeknisi">0</div>
        </div>

    </div>

    <div class="search-box">
        <input
            class="search"
            id="search"
            type="text"
            placeholder="Cari nama teknisi, kode, WhatsApp..."
            oninput="renderTable()"
        >
    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>TEKNISI</th>
                    <th>KONTAK</th>
                    <th>DEVICE</th>
                    <th>STATUS</th>
                    <th>AKSI</th>
                </tr>
            </thead>

            <tbody id="technicianTable">
            </tbody>

        </table>

    </div>

</main>


<!-- MODAL -->

<div class="modal-bg" id="modal">

    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">Tambah Teknisi</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">

            <div class="form-grid">

                <div class="form-group">
                    <label>Kode Teknisi</label>
                    <input id="technician_code" readonly>
                </div>

                <div class="form-group">
                    <label>Nama Teknisi *</label>
                    <input id="full_name" placeholder="Nama lengkap teknisi">
                </div>

                <div class="form-group">
                    <label>No. HP / WhatsApp</label>
                    <input id="phone" placeholder="08xxxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input id="email" placeholder="teknisi@email.com">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="ACTIVE">Aktif</option>
                        <option value="INACTIVE">Nonaktif</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Device ID</label>
                    <input id="device_id" placeholder="Akan diisi saat HP terdaftar">
                </div>

                <div class="form-group">
                    <label>Nama Device</label>
                    <input id="device_name" placeholder="Contoh: HP Roni">
                </div>

                <div class="form-group full">
                    <label>Catatan</label>
                    <textarea id="notes" placeholder="Catatan teknisi..."></textarea>
                </div>

            </div>

        </div>

        <div class="modal-footer">

            <button class="btn-cancel" onclick="closeModal()">
                Batal
            </button>

            <button class="btn-save" onclick="saveTechnician()">
                Simpan Teknisi
            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL = "https://gmcudgwhkckmcegoexpb.supabase.co";
const SUPABASE_KEY = "sb_publishable_gxjebT9A7W_fCm2oabQAtQ_8fuMU8GV";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let technicians = [];
let editingId = null;


/* LOAD DATA */

async function loadTechnicians(){

    const {data,error} = await db
        .from("technicians")
        .select("*")
        .order("technician_code",{ascending:true});

    if(error){

        console.error(error);

        alert("Gagal mengambil data teknisi: " + error.message);

        return;
    }

    technicians = data || [];

    updateStats();
    renderTable();
}


/* STATISTIK */

function updateStats(){

    const total = technicians.length;

    const active = technicians.filter(
        x => x.status === "ACTIVE"
    ).length;

    const inactive = technicians.filter(
        x => x.status === "INACTIVE"
    ).length;

    document.getElementById("totalTeknisi").textContent = total;
    document.getElementById("activeTeknisi").textContent = active;
    document.getElementById("inactiveTeknisi").textContent = inactive;
}


/* TABLE */

function renderTable(){

    const tbody =
        document.getElementById("technicianTable");

    const keyword =
        document.getElementById("search").value
        .toLowerCase()
        .trim();

    const filtered = technicians.filter(t => {

        return (
            (t.full_name || "").toLowerCase().includes(keyword) ||
            (t.technician_code || "").toLowerCase().includes(keyword) ||
            (t.phone || "").toLowerCase().includes(keyword)
        );

    });

    if(filtered.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Belum ada teknisi.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML = filtered.map(t => {

        const active = t.status === "ACTIVE";

        return `
            <tr>

                <td>
                    <div class="code">${escapeHtml(t.technician_code || "-")}</div>
                    <div style="margin-top:4px;font-weight:bold;">
                        ${escapeHtml(t.full_name || "-")}
                    </div>
                </td>

                <td>
                    ${escapeHtml(t.phone || "-")}
                    <br>
                    <span style="font-size:11px;color:#64748b;">
                        ${escapeHtml(t.email || "")}
                    </span>
                </td>

                <td>
                    <div class="device">
                        ${escapeHtml(t.device_name || "Belum terdaftar")}
                    </div>

                    <div class="device">
                        ${escapeHtml(t.device_id || "")}
                    </div>
                </td>

                <td>
                    <span class="status ${active ? "active" : "inactive"}">
                        ${active ? "AKTIF" : "NONAKTIF"}
                    </span>
                </td>

                <td>

                    <button
                        class="action edit"
                        onclick="editTechnician('${t.id}')">
                        Edit
                    </button>

                    <button
                        class="action toggle"
                        onclick="toggleStatus('${t.id}')">
                        ${active ? "Nonaktifkan" : "Aktifkan"}
                    </button>

                </td>

            </tr>
        `;

    }).join("");
}


/* TAMBAH */

function openModal(){

    editingId = null;

    document.getElementById("modalTitle").textContent =
        "Tambah Teknisi";

    document.getElementById("technician_code").value =
        generateCode();

    document.getElementById("full_name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("status").value = "ACTIVE";
    document.getElementById("device_id").value = "";
    document.getElementById("device_name").value = "";
    document.getElementById("notes").value = "";

    document.getElementById("modal").style.display = "flex";
}


/* KODE OTOMATIS */

function generateCode(){

    let max = 0;

    technicians.forEach(t => {

        const match =
            (t.technician_code || "").match(/(\d+)$/);

        if(match){

            const number =
                parseInt(match[1]);

            if(number > max){
                max = number;
            }

        }

    });

    return "TECH-" +
        String(max + 1).padStart(3,"0");
}


/* EDIT */

function editTechnician(id){

    const t =
        technicians.find(x => x.id === id);

    if(!t) return;

    editingId = id;

    document.getElementById("modalTitle").textContent =
        "Edit Teknisi";

    document.getElementById("technician_code").value =
        t.technician_code || "";

    document.getElementById("full_name").value =
        t.full_name || "";

    document.getElementById("phone").value =
        t.phone || "";

    document.getElementById("email").value =
        t.email || "";

    document.getElementById("status").value =
        t.status || "ACTIVE";

    document.getElementById("device_id").value =
        t.device_id || "";

    document.getElementById("device_name").value =
        t.device_name || "";

    document.getElementById("notes").value =
        t.notes || "";

    document.getElementById("modal").style.display = "flex";
}


/* SIMPAN */

async function saveTechnician(){

    const full_name =
        document.getElementById("full_name").value.trim();

    if(!full_name){

        alert("Nama teknisi wajib diisi.");

        return;
    }

    const payload = {

        technician_code:
            document.getElementById("technician_code").value,

        full_name,

        phone:
            document.getElementById("phone").value.trim() || null,

        email:
            document.getElementById("email").value.trim() || null,

        status:
            document.getElementById("status").value,

        device_id:
            document.getElementById("device_id").value.trim() || null,

        device_name:
            document.getElementById("device_name").value.trim() || null,

        notes:
            document.getElementById("notes").value.trim() || null

    };


    let result;

    if(editingId){

        result = await db
            .from("technicians")
            .update(payload)
            .eq("id",editingId);

    }else{

        result = await db
            .from("technicians")
            .insert(payload);

    }


    if(result.error){

        console.error(result.error);

        alert("Gagal menyimpan teknisi: " +
            result.error.message);

        return;
    }

    closeModal();

    await loadTechnicians();

    alert("Data teknisi berhasil disimpan.");

}


/* STATUS */

async function toggleStatus(id){

    const t =
        technicians.find(x => x.id === id);

    if(!t) return;

    const newStatus =
        t.status === "ACTIVE"
        ? "INACTIVE"
        : "ACTIVE";

    const {error} = await db
        .from("technicians")
        .update({
            status:newStatus
        })
        .eq("id",id);

    if(error){

        alert("Gagal mengubah status: " +
            error.message);

        return;
    }

    await loadTechnicians();
}


/* CLOSE */

function closeModal(){

    document.getElementById("modal").style.display = "none";
}


/* ESCAPE HTML */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* LOGOUT */

function logout(){

    window.location.href = "index.html";

}


/* START */

loadTechnicians();

</script>

</body>
</html>
