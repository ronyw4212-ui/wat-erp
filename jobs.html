<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Teknisi - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  height:72px;
  background:linear-gradient(135deg,#0866ff,#1976f3);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.brand h2{
  font-size:22px;
}

.brand span{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.role{
  background:rgba(255,255,255,.18);
  padding:9px 15px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.logout{
  border:0;
  background:white;
  color:#0866ff;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1250px;
  margin:30px auto;
  padding:0 20px 50px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.page-title h1{
  font-size:28px;
  margin-bottom:5px;
}

.page-title p{
  color:#718096;
  font-size:14px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#0866ff;
  color:white;
}

.btn-secondary{
  background:#edf2f7;
  color:#334155;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:22px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  border-left:4px solid #0866ff;
}

.card:nth-child(2){
  border-left-color:#16a34a;
}

.card:nth-child(3){
  border-left-color:#f59e0b;
}

.card:nth-child(4){
  border-left-color:#7c3aed;
}

.card span{
  color:#718096;
  font-size:13px;
}

.card strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

.toolbar{
  background:white;
  padding:16px;
  border-radius:12px;
  display:flex;
  gap:12px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.search{
  flex:1;
  padding:12px 14px;
  border:1px solid #d8dee9;
  border-radius:8px;
  outline:none;
}

.toolbar select{
  padding:12px;
  border:1px solid #d8dee9;
  border-radius:8px;
  background:white;
}

.table-card{
  background:white;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
  padding:14px;
  text-align:left;
  border-bottom:1px solid #e5e7eb;
}

td{
  padding:15px;
  border-bottom:1px solid #edf0f4;
  vertical-align:top;
  font-size:13px;
}

tr:hover td{
  background:#fafcff;
}

.customer-name{
  font-weight:bold;
  color:#172033;
}

.tech-name{
  font-weight:bold;
}

.phone{
  display:inline-block;
  margin-top:6px;
  color:#16a34a;
  font-weight:bold;
  text-decoration:none;
}

.phone:hover{
  text-decoration:underline;
}

.address{
  color:#475569;
  line-height:1.5;
}

.address a{
  color:#0866ff;
  text-decoration:none;
}

.job-desc{
  line-height:1.5;
}

.date{
  font-weight:bold;
}

.time{
  color:#0866ff;
  font-weight:bold;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.s-new{
  background:#e0f2fe;
  color:#0369a1;
}

.s-assigned{
  background:#ede9fe;
  color:#6d28d9;
}

.s-way{
  background:#fef3c7;
  color:#92400e;
}

.s-checkin{
  background:#dbeafe;
  color:#1d4ed8;
}

.s-progress{
  background:#ffedd5;
  color:#c2410c;
}

.s-completed{
  background:#dcfce7;
  color:#15803d;
}

.s-cancelled{
  background:#fee2e2;
  color:#b91c1c;
}

.action{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action button{
  border:0;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.btn-view{
  background:#e8f1ff;
  color:#0757c9;
}

.btn-edit{
  background:#f1f5f9;
  color:#334155;
}

.btn-wa{
  background:#dcfce7;
  color:#15803d;
}

.btn-delete{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  text-align:center;
  padding:45px;
  color:#718096;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:720px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.modal-header{
  padding:20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h2{
  font-size:19px;
}

.close{
  border:0;
  background:transparent;
  font-size:25px;
  cursor:pointer;
  color:#64748b;
}

.form{
  padding:22px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:12px;
  font-weight:bold;
  color:#334155;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #d8dee9;
  border-radius:8px;
  outline:none;
  font-family:inherit;
  font-size:13px;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#0866ff;
  box-shadow:0 0 0 3px rgba(8,102,255,.1);
}

.modal-footer{
  padding:18px 22px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.error{
  color:#dc2626;
  font-size:12px;
  margin-top:10px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:22px;
}

.detail-item{
  background:#f8fafc;
  padding:14px;
  border-radius:9px;
}

.detail-item.full{
  grid-column:1/-1;
}

.detail-item small{
  display:block;
  color:#64748b;
  font-size:11px;
  margin-bottom:5px;
}

.detail-item strong{
  font-size:14px;
  line-height:1.5;
}

@media(max-width:800px){
  .summary{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

  .detail-item.full{
    grid-column:auto;
  }
}

@media(max-width:600px){
  .header{
    padding:0 15px;
  }

  .brand h2{
    font-size:18px;
  }

  .role{
    display:none;
  }

  .container{
    margin-top:20px;
    padding:0 12px 40px;
  }

  .page-title{
    align-items:flex-start;
    gap:15px;
  }

  .page-title h1{
    font-size:22px;
  }

  .summary{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:14px;
  }

  .card strong{
    font-size:22px;
  }

  .toolbar{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <h2>WAT ERP</h2>
    <span>Technician Control System</span>
  </div>

  <div class="header-right">
    <div class="role" id="roleText">OWNER</div>
    <button class="logout" onclick="logout()">LOGOUT</button>
  </div>
</header>

<main class="container">

  <div class="page-title">
    <div>
      <h1>Jadwal Teknisi</h1>
      <p>Kelola jadwal pekerjaan teknisi dan customer.</p>
    </div>

    <button
      class="btn btn-primary"
      id="addButton"
      onclick="openAddModal()">
      + Tambah Jadwal
    </button>
  </div>

  <section class="summary">

    <div class="card">
      <span>Total Jadwal</span>
      <strong id="totalJobs">0</strong>
    </div>

    <div class="card">
      <span>Hari Ini</span>
      <strong id="todayJobs">0</strong>
    </div>

    <div class="card">
      <span>Dalam Proses</span>
      <strong id="progressJobs">0</strong>
    </div>

    <div class="card">
      <span>Selesai</span>
      <strong id="completedJobs">0</strong>
    </div>

  </section>

  <section class="toolbar">

    <input
      id="searchInput"
      class="search"
      placeholder="Cari customer, teknisi, alamat, pekerjaan..."
      oninput="renderJobs()">

    <select id="statusFilter" onchange="renderJobs()">
      <option value="">Semua Status</option>
      <option value="NEW">Terjadwal</option>
      <option value="ASSIGNED">Ditugaskan</option>
      <option value="ON_THE_WAY">OTW</option>
      <option value="CHECKED_IN">Check In</option>
      <option value="IN_PROGRESS">Dalam Proses</option>
      <option value="COMPLETED">Selesai</option>
      <option value="CANCELLED">Dibatalkan</option>
    </select>

  </section>

  <section class="table-card">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Jadwal</th>
            <th>Teknisi</th>
            <th>Customer</th>
            <th>Alamat</th>
            <th>Pekerjaan</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="jobTable">
          <tr>
            <td colspan="7" class="empty">
              Memuat jadwal...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- =====================================================
     MODAL TAMBAH / EDIT
===================================================== -->

<div class="modal" id="jobModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">Tambah Jadwal</h2>

      <button class="close" onclick="closeModal()">×</button>

    </div>

    <div class="form">

      <input type="hidden" id="jobId">

      <div class="form-grid">

        <div class="form-group">
          <label>Teknisi *</label>

          <select id="technicianId" required>
            <option value="">Pilih teknisi</option>
          </select>
        </div>


        <div class="form-group">
          <label>Tanggal *</label>

          <input
            type="date"
            id="jobDate"
            required>
        </div>


        <div class="form-group">
          <label>Jam *</label>

          <input
            type="time"
            id="jobTime"
            required>
        </div>


        <div class="form-group">
          <label>Nama Customer *</label>

          <input
            type="text"
            id="customerName"
            placeholder="Contoh: Klinik Dokter Dini"
            required>
        </div>


        <div class="form-group">
          <label>No. WhatsApp Customer *</label>

          <input
            type="tel"
            id="customerPhone"
            placeholder="081234567890"
            required>
        </div>


        <div class="form-group full">
          <label>Alamat Customer *</label>

          <textarea
            id="customerAddress"
            placeholder="Alamat lengkap customer..."
            required></textarea>
        </div>


        <div class="form-group full">
          <label>Keterangan / Pekerjaan *</label>

          <textarea
            id="workDescription"
            placeholder="Contoh: Service AC 2 PK, cuci 3 unit, cek freon..."
            required></textarea>
        </div>


        <div
          class="form-group"
          id="statusGroup"
          style="display:none">

          <label>Status</label>

          <select id="jobStatus">
            <option value="NEW">Terjadwal</option>
            <option value="ASSIGNED">Ditugaskan</option>
            <option value="ON_THE_WAY">OTW</option>
            <option value="CHECKED_IN">Check In</option>
            <option value="IN_PROGRESS">Dalam Proses</option>
            <option value="COMPLETED">Selesai</option>
            <option value="CANCELLED">Dibatalkan</option>
          </select>

        </div>


      </div>

      <div id="formError" class="error"></div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal()">
        Batal
      </button>

      <button
        class="btn btn-primary"
        onclick="saveJob()">
        Simpan Jadwal
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     MODAL DETAIL
===================================================== -->

<div class="modal" id="detailModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Detail Jadwal</h2>

      <button class="close" onclick="closeDetail()">×</button>

    </div>

    <div id="detailContent"></div>

    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeDetail()">
        Tutup
      </button>

    </div>

  </div>

</div>


<script>

const { createClient } = window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let jobs = [];
let technicians = [];
let currentUser = null;
let currentProfile = null;


/* =====================================================
   HELPER
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizePhone(phone){

  let p = String(phone || "")
    .replace(/\D/g,"");

  if(p.startsWith("0")){
    p = "62" + p.substring(1);
  }

  if(p.startsWith("8")){
    p = "62" + p;
  }

  return p;
}


function whatsappUrl(phone){

  const p = normalizePhone(phone);

  return p
    ? `https://wa.me/${p}`
    : "#";

}


function whatsappMessage(job){

  return encodeURIComponent(
`Halo Bapak/Ibu ${job.customer_name || ""},

Saya teknisi dari WAT / Wijaya AC.

Saya akan datang untuk pekerjaan:
${job.work_description || "-"}

Jadwal:
${formatDate(job.scheduled_at)} pukul ${formatTime(job.scheduled_at)}

Terima kasih.`
  );

}


function whatsappFullUrl(job){

  const phone = normalizePhone(job.customer_phone);

  if(!phone) return "#";

  return `https://wa.me/${phone}?text=${whatsappMessage(job)}`;

}


function formatDate(value){

  if(!value) return "-";

  const d = new Date(value);

  return d.toLocaleDateString(
    "id-ID",
    {
      weekday:"long",
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function formatTime(value){

  if(!value) return "-";

  const d = new Date(value);

  return d.toLocaleTimeString(
    "id-ID",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function statusText(status){

  const map = {
    NEW:"TERJADWAL",
    ASSIGNED:"DITUGASKAN",
    ON_THE_WAY:"OTW",
    CHECKED_IN:"CHECK IN",
    IN_PROGRESS:"DALAM PROSES",
    COMPLETED:"SELESAI",
    CANCELLED:"DIBATALKAN"
  };

  return map[status] || status || "-";

}


function statusClass(status){

  const map = {
    NEW:"s-new",
    ASSIGNED:"s-assigned",
    ON_THE_WAY:"s-way",
    CHECKED_IN:"s-checkin",
    IN_PROGRESS:"s-progress",
    COMPLETED:"s-completed",
    CANCELLED:"s-cancelled"
  };

  return map[status] || "s-new";

}


function technicianName(id){

  const t =
    technicians.find(
      x => x.id === id
    );

  return t
    ? t.full_name
    : "Teknisi";

}


function localDateTime(date,time){

  if(!date || !time) return null;

  return `${date}T${time}:00`;

}


/* =====================================================
   LOGIN
===================================================== */

async function checkUser(){

  const {
    data:{user}
  } = await supabaseClient
    .auth
    .getUser();

  if(!user){

    location.href="login.html";
    return false;

  }

  currentUser = user;

  const {
    data:profile,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,full_name,email,role,status")
    .eq("id",user.id)
    .single();

  if(error || !profile){

    alert("Profil pengguna tidak ditemukan.");

    await supabaseClient.auth.signOut();

    location.href="login.html";

    return false;
  }

  if(profile.status !== "ACTIVE"){

    alert("Akun tidak aktif.");

    await supabaseClient.auth.signOut();

    location.href="login.html";

    return false;
  }

  currentProfile = profile;

  document.getElementById("roleText")
    .textContent = profile.role;

  return true;

}


/* =====================================================
   LOAD TECHNICIANS
===================================================== */

async function loadTechnicians(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,full_name,email")
    .eq("role","TEKNISI")
    .eq("status","ACTIVE")
    .order("full_name");

  if(error){

    console.error(error);

    alert(
      "Gagal mengambil data teknisi: "
      + error.message
    );

    return;

  }

  technicians = data || [];

  const select =
    document.getElementById("technicianId");

  select.innerHTML =
    '<option value="">Pilih teknisi</option>';

  technicians.forEach(t => {

    const option =
      document.createElement("option");

    option.value = t.id;

    option.textContent =
      t.full_name || t.email;

    select.appendChild(option);

  });

}


/* =====================================================
   LOAD JOBS
===================================================== */

async function loadJobs(){

  let query =
    supabaseClient
      .from("jobs")
      .select("*")
      .order("scheduled_at",{ascending:true});

  /*
    OWNER:
    melihat semua jadwal.

    TEKNISI:
    hanya melihat jadwal miliknya.
  */

  if(currentProfile.role === "TEKNISI"){

    query =
      query.eq(
        "assigned_to",
        currentUser.id
      );

  }

  const {
    data,
    error
  } = await query;

  if(error){

    console.error(error);

    document.getElementById("jobTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Gagal memuat jadwal.<br>
          ${esc(error.message)}
        </td>
      </tr>
    `;

    return;

  }

  jobs = data || [];

  updateSummary();

  renderJobs();

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  document.getElementById("totalJobs")
    .textContent = jobs.length;

  const today =
    new Date().toISOString().slice(0,10);

  document.getElementById("todayJobs")
    .textContent =
      jobs.filter(j =>
        j.scheduled_at &&
        j.scheduled_at.slice(0,10) === today
      ).length;

  document.getElementById("progressJobs")
    .textContent =
      jobs.filter(j =>
        [
          "ON_THE_WAY",
          "CHECKED_IN",
          "IN_PROGRESS"
        ].includes(j.status)
      ).length;

  document.getElementById("completedJobs")
    .textContent =
      jobs.filter(j =>
        j.status === "COMPLETED"
      ).length;

}


/* =====================================================
   RENDER
===================================================== */

function renderJobs(){

  const q =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const status =
    document.getElementById("statusFilter")
      .value;

  let rows =
    jobs.filter(job => {

      const text = [
        job.customer_name,
        job.customer_phone,
        job.customer_address,
        job.work_description,
        technicianName(job.assigned_to)
      ]
      .join(" ")
      .toLowerCase();

      const searchMatch =
        !q || text.includes(q);

      const statusMatch =
        !status || job.status === status;

      return searchMatch && statusMatch;

    });


  const table =
    document.getElementById("jobTable");


  if(!rows.length){

    table.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Belum ada jadwal.
        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    rows.map(job => {

      const wa =
        whatsappFullUrl(job);

            <div class="tech-name">

          </td>


          <td>

            <div class="customer-name">
              ${esc(job.customer_name)}
            </div>

              ?

                target="_blank">

              </a>
              `

              ""
            }

          </td>


          <td>

            <div class="address">
              ${esc(job.customer_address || "-")}
            </div>

            ${
              job.customer_address
              ?
              `
              <a
                href="${maps}"
                target="_blank">
                📍 Buka Maps
              </a>
              `
              :
              ""
            }

          </td>


          <td>
            <div class="job-desc">
              ${esc(job.work_description || "-")}
            </div>
          </td>


          <td>

            <span
              class="badge ${statusClass(job.status)}">

              ${statusText(job.status)}

            </span>

          </td>


          <td>

            <div class="action">

              <button
                class="action-btn btn-view"
                onclick="showDetail('${job.id}')">

}

/* =====================================================
   EDIT
===================================================== */

function editJob(id){

  const job =
    jobs.find(x => x.id === id);

  if(!job) return;

  document.getElementById("modalTitle")
    .textContent = "Edit Jadwal";

  document.getElementById("jobId")
    .value = job.id;

  document.getElementById("technicianId")
    .value = job.assigned_to || "";

  const d =
    new Date(job.scheduled_at);

  document.getElementById("jobDate")
    .value =
      d.toISOString().slice(0,10);

  document.getElementById("jobTime")
    .value =
      d.toTimeString().slice(0,5);

  document.getElementById("customerName")
    .value =
      job.customer_name || "";

  document.getElementById("customerPhone")
    .value =
      job.customer_phone || "";

  document.getElementById("customerAddress")
    .value =
      job.customer_address || "";

  document.getElementById("workDescription")
    .value =
      job.work_description || "";

  document.getElementById("jobStatus")
    .value =
      job.status || "NEW";

  document.getElementById("statusGroup")
    .style.display = "flex";

  document.getElementById("formError")
    .textContent = "";

  document.getElementById("jobModal")
    .classList.add("show");

}


/* =====================================================
   SAVE
===================================================== */

async function saveJob(){

  if(currentProfile.role !== "OWNER"){

    alert("Hanya OWNER yang dapat membuat jadwal.");

    return;

  }


  const id =
    document.getElementById("jobId").value;

  const technicianId =
    document.getElementById("technicianId").value;

  const date =
    document.getElementById("jobDate").value;

  const time =
    document.getElementById("jobTime").value;

  const customerName =
    document.getElementById("customerName").value.trim();

  const customerPhone =
    document.getElementById("customerPhone").value.trim();

  const customerAddress =
    document.getElementById("customerAddress").value.trim();

  const workDescription =
    document.getElementById("workDescription").value.trim();

  const status =
    document.getElementById("jobStatus").value;


  const errorBox =
    document.getElementById("formError");

  errorBox.textContent = "";


  if(
    !technicianId ||
    !date ||
    !time ||
    !customerName ||
    !customerPhone ||
    !customerAddress ||
    !workDescription
  ){

    errorBox.textContent =
      "Mohon lengkapi semua data wajib.";

    return;

  }


  const scheduledAt =
    localDateTime(date,time);


  const payload = {

    assigned_to: technicianId,

    scheduled_at: scheduledAt,

    customer_name: customerName,

    customer_phone: customerPhone,

    customer_address: customerAddress,

    work_description: workDescription,

    title: workDescription,

    description: workDescription,

    job_type: "SERVICE",

    priority: "NORMAL",

    status: id
      ? status
      : "NEW",

    estimated_cost: 0,

    service_price: 0,

    actual_cost: 0

  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("jobs")
        .update(payload)
        .eq("id",id);

  }else{

    /*
      Job code dibuat otomatis
    */

    payload.job_code =
      "JOB-" +
      Date.now();

    result =
      await supabaseClient
        .from("jobs")
        .insert(payload);

  }


  if(result.error){

    console.error(result.error);

    errorBox.textContent =
      "Gagal menyimpan: "
      + result.error.message;

    return;

  }


  closeModal();

  await loadJobs();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteJob(id){

  if(currentProfile.role !== "OWNER") return;

  const job =
    jobs.find(x => x.id === id);

  if(!job) return;


  const yes =
    confirm(
      `Hapus jadwal ${job.customer_name}?`
    );

  if(!yes) return;


  const {
    error
  } = await supabaseClient
    .from("jobs")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Gagal menghapus: "
      + error.message
    );

    return;

  }


  await loadJobs();

}

/* =====================================================
   TECHNICIAN UPDATE STATUS
===================================================== */

async function updateStatus(id){

  const job =
    jobs.find(x => x.id === id);

  if(!job) return;


  const newStatus =
    prompt(
      `Status sekarang: ${statusText(job.status)}

Masukkan:
NEW
ASSIGNED
ON_THE_WAY
CHECKED_IN
IN_PROGRESS
COMPLETED
CANCELLED`,
      job.status || "NEW"
    );


  if(!newStatus) return;


  const allowed = [
    "NEW",
    "ASSIGNED",
    "ON_THE_WAY",
    "CHECKED_IN",
    "IN_PROGRESS",
    "COMPLETED",
    "CANCELLED"
  ];


  if(!allowed.includes(newStatus)){

    alert("Status tidak valid.");

    return;

  }


  const {
    error
  } = await supabaseClient
    .from("jobs")
    .update({
      status:newStatus
    })
    .eq("id",id)
    .eq("assigned_to",currentUser.id);


  if(error){

    alert(
      "Gagal mengubah status: "
      + error.message
    );

    return;

  }


  await loadJobs();

}
