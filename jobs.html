<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Teknisi - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  height:72px;
  background:linear-gradient(135deg,#0866ff,#1976f3);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.brand h2{
  font-size:22px;
}

.brand span{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.role{
  background:rgba(255,255,255,.16);
  padding:9px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.logout{
  border:0;
  background:white;
  color:#0866ff;
  padding:10px 16px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1250px;
  margin:30px auto;
  padding:0 20px 50px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.page-title h1{
  font-size:28px;
}

.page-title p{
  color:#718096;
  font-size:14px;
  margin-top:5px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 17px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{
  background:#0866ff;
  color:white;
  box-shadow:0 4px 10px rgba(8,102,255,.2);
}

.btn-secondary{
  background:#eef2f7;
  color:#344054;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:18px;
}

.summary-card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  border-left:4px solid #0866ff;
}

.summary-card.today{
  border-left-color:#16a34a;
}

.summary-card.done{
  border-left-color:#f59e0b;
}

.summary-card span{
  color:#718096;
  font-size:13px;
}

.summary-card strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}

.toolbar{
  background:white;
  padding:16px;
  border-radius:12px;
  display:flex;
  gap:12px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.search,
.toolbar select{
  padding:12px 14px;
  border:1px solid #d8e0eb;
  border-radius:8px;
  outline:none;
  font-size:13px;
  background:white;
}

.search{
  flex:1;
}

.search:focus,
.toolbar select:focus{
  border-color:#0866ff;
}

.card{
  background:white;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  background:#f8fafc;
  text-align:left;
  padding:14px;
  font-size:12px;
  color:#475569;
  text-transform:uppercase;
  border-bottom:1px solid #e5e7eb;
}

td{
  padding:14px;
  border-bottom:1px solid #edf0f4;
  font-size:13px;
  vertical-align:top;
}

.date{
  font-weight:bold;
}

.time{
  color:#0866ff;
  font-weight:bold;
  margin-top:4px;
}

.customer{
  font-weight:bold;
}

.phone{
  display:inline-block;
  margin-top:5px;
  color:#16a34a;
  text-decoration:none;
  font-weight:bold;
}

.phone:hover{
  text-decoration:underline;
}

.address{
  color:#667085;
  line-height:1.4;
  max-width:280px;
}

.work{
  line-height:1.45;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:14px;
  font-size:10px;
  font-weight:bold;
}

.badge-new{
  background:#eaf2ff;
  color:#0866ff;
}

.badge-done{
  background:#eaf8ef;
  color:#15803d;
}

.badge-cancel{
  background:#fee2e2;
  color:#b91c1c;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:6px;
  padding:7px 10px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.view{
  background:#eef2ff;
  color:#4757a8;
}

.edit{
  background:#fff7e6;
  color:#9a6700;
}

.delete{
  background:#feecec;
  color:#b42318;
}

.empty{
  text-align:center;
  color:#98a2b3;
  padding:45px;
}

.loading{
  text-align:center;
  padding:35px;
  color:#667085;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  z-index:20;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
  overflow:hidden;
}

.modal-header{
  padding:20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h2{
  font-size:19px;
}

.close{
  border:0;
  background:transparent;
  font-size:24px;
  color:#667085;
  cursor:pointer;
}

.form{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.group.full{
  grid-column:1/-1;
}

.group label{
  font-size:12px;
  font-weight:bold;
  color:#344054;
}

.group input,
.group textarea,
.group select{
  width:100%;
  padding:12px;
  border:1px solid #d8e0eb;
  border-radius:8px;
  font-size:13px;
  outline:none;
  background:white;
}

.group textarea{
  min-height:90px;
  resize:vertical;
}

.group input:focus,
.group textarea:focus,
.group select:focus{
  border-color:#0866ff;
  box-shadow:0 0 0 3px rgba(8,102,255,.08);
}

.error{
  color:#dc2626;
  font-size:12px;
  margin-top:10px;
}

.modal-footer{
  padding:16px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.detail-item{
  background:#f8fafc;
  padding:12px;
  border-radius:8px;
}

.detail-item small{
  display:block;
  color:#667085;
  font-size:11px;
  margin-bottom:5px;
}

.detail-item strong{
  font-size:13px;
  line-height:1.4;
}

.detail-item.full{
  grid-column:1/-1;
}

@media(max-width:850px){

  .summary{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .page-title{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }
}

@media(max-width:600px){

  .header{
    padding:0 15px;
  }

  .container{
    padding:0 12px 40px;
  }

  .role{
    display:none;
  }

  .brand h2{
    font-size:18px;
  }

  .page-title h1{
    font-size:23px;
  }

  .modal{
    padding:10px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    <h2>WAT ERP</h2>
    <span>Technician Control System</span>
  </div>

  <div class="header-right">
    <span class="role">OWNER</span>
    <button class="logout" onclick="logout()">LOGOUT</button>
  </div>

</header>

<main class="container">

  <div class="page-title">

    <div>
      <h1>Jadwal Teknisi</h1>
      <p>Kelola jadwal pekerjaan teknisi dan customer.</p>
    </div>

    <button class="btn btn-primary" onclick="openAdd()">
      + Tambah Jadwal
    </button>

  </div>

  <section class="summary">

    <div class="summary-card">
      <span>Total Jadwal</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="summary-card today">
      <span>Jadwal Hari Ini</span>
      <strong id="todayCount">0</strong>
    </div>

    <div class="summary-card done">
      <span>Selesai</span>
      <strong id="doneCount">0</strong>
    </div>

  </section>

  <section class="toolbar">

    <input
      id="searchInput"
      class="search"
      placeholder="Cari customer, teknisi, alamat, pekerjaan..."
      oninput="render()"
    >

    <select id="statusFilter" onchange="render()">
      <option value="">Semua Status</option>
      <option value="NEW">Baru</option>
      <option value="ON_THE_WAY">Menuju Lokasi</option>
      <option value="IN_PROGRESS">Dikerjakan</option>
      <option value="COMPLETED">Selesai</option>
      <option value="CANCELLED">Dibatalkan</option>
    </select>

  </section>

  <section class="card table-wrap">

    <table>

      <thead>
        <tr>
          <th>Jadwal</th>
          <th>Teknisi</th>
          <th>Customer</th>
          <th>Alamat</th>
          <th>Pekerjaan</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>

      <tbody id="jobTable">
        <tr>
          <td colspan="7" class="loading">
            Memuat jadwal...
          </td>
        </tr>
      </tbody>

    </table>

  </section>

</main>


<!-- MODAL TAMBAH / EDIT -->

<div class="modal" id="jobModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        Tambah Jadwal
      </h2>

      <button class="close" onclick="closeModal()">
        ×
      </button>

    </div>

    <form class="form" id="jobForm">

      <input type="hidden" id="jobId">

      <div class="grid">

        <div class="group">

          <label>Teknisi *</label>

          <select id="technicianId" required>
            <option value="">
              Memuat teknisi...
            </option>
          </select>

        </div>


        <div class="group">

          <label>Tanggal *</label>

          <input
            type="date"
            id="scheduledDate"
            required
          >

        </div>


        <div class="group">

          <label>Jam *</label>

          <input
            type="time"
            id="scheduledTime"
            required
          >

        </div>


        <div class="group">

          <label>Nama Customer *</label>

          <input
            type="text"
            id="customerName"
            placeholder="Contoh: Dokter Dini Medical Center"
            required
          >

        </div>


        <div class="group full">

          <label>No. WhatsApp Customer *</label>

          <input
            type="tel"
            id="customerPhone"
            placeholder="081234567890"
            required
          >

        </div>


        <div class="group full">

          <label>Alamat Customer *</label>

          <textarea
            id="customerAddress"
            placeholder="Alamat lengkap customer"
            required
          ></textarea>

        </div>


        <div class="group full">

          <label>Keterangan / Pekerjaan *</label>

          <textarea
            id="jobDescription"
            placeholder="Contoh: Service AC 2 unit"
            required
          ></textarea>

        </div>


        <div class="group">

          <label>Status</label>

          <select id="jobStatus">

            <option value="NEW">
              Baru
            </option>

            <option value="ON_THE_WAY">
              Menuju Lokasi
            </option>

            <option value="IN_PROGRESS">
              Dikerjakan
            </option>

            <option value="COMPLETED">
              Selesai
            </option>

            <option value="CANCELLED">
              Dibatalkan
            </option>

          </select>

        </div>

      </div>

      <div id="formMessage"></div>

    </form>

    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal()"
      >
        Batal
      </button>

      <button
        class="btn btn-primary"
        onclick="saveJob()"
      >
        Simpan Jadwal
      </button>

    </div>

  </div>

</div>


<!-- MODAL DETAIL -->

<div class="modal" id="detailModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Detail Jadwal</h2>

      <button class="close" onclick="closeDetail()">
        ×
      </button>

    </div>

    <div class="form">

      <div
        id="detailContent"
        class="detail-grid"
      ></div>

    </div>

    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeDetail()"
      >
        Tutup
      </button>

    </div>

  </div>

</div>


<script>

const {
  createClient
} = window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let jobs = [];
let technicians = [];
let currentUser = null;


const statusText = {

  NEW:"BARU",

  ON_THE_WAY:"MENUJU LOKASI",

  IN_PROGRESS:"DIKERJAKAN",

  COMPLETED:"SELESAI",

  CANCELLED:"DIBATALKAN"

};


const statusClass = {

  NEW:"badge-new",

  ON_THE_WAY:"badge-new",

  IN_PROGRESS:"badge-new",

  COMPLETED:"badge-done",

  CANCELLED:"badge-cancel"

};


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


function normalizePhone(phone){

  let p =
    String(phone || "")
    .replace(/\D/g,"");

  if(p.startsWith("0")){

    p = "62" + p.substring(1);

  }
  else if(p.startsWith("8")){

    p = "62" + p;

  }

  return p;

}


function whatsappLink(phone){

  const p =
    normalizePhone(phone);

  if(!p) return "";

  return "https://wa.me/" + p;

}


function today(){

  const d = new Date();

  const local =
    new Date(
      d.getTime()
      - d.getTimezoneOffset()*60000
    );

  return local
    .toISOString()
    .substring(0,10);

}


function formatDate(date){

  if(!date) return "-";

  return new Date(
    date + "T00:00:00"
  ).toLocaleDateString(
    "id-ID",
    {
      weekday:"long",
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


async function checkOwner(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();


  if(!user){

    location.href =
      "login.html";

    return false;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "full_name,email,role,status"
    )
    .eq("id",user.id)
    .single();


  if(
    error ||
    !data ||
    data.role !== "OWNER" ||
    data.status !== "ACTIVE"
  ){

    await supabaseClient
      .auth
      .signOut();

    location.href =
      "login.html";

    return false;

  }


  currentUser = user;

  return true;

}


async function loadTechnicians(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,full_name,email"
    )
    .eq("role","TEKNISI")
    .eq("status","ACTIVE")
    .order("full_name");


  if(error)
    throw error;


  technicians =
    data || [];


  const select =
    document.getElementById(
      "technicianId"
    );


  select.innerHTML =
    '<option value="">Pilih teknisi</option>' +

    technicians.map(function(t){

      return `
        <option value="${t.id}">
          ${esc(
            t.full_name ||
            t.email
          )}
        </option>
      `;

    }).join("");

}


async function loadJobs(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("jobs")
    .select("*")
    .order(
      "scheduled_at",
      {
        ascending:true
      }
    );


  if(error)
    throw error;


  jobs =
    data || [];


  render();

}


function technicianName(id){

  const t =
    technicians.find(
      x => x.id === id
    );


  if(!t)
    return "Belum ditugaskan";


  return (
    t.full_name ||
    t.email
  );

}


function customerInfo(job){

  return {

    name:
      job.customer_name ||
      "Customer",

    phone:
      job.customer_phone ||
      "",

    address:
      job.customer_address ||
      ""

  };

}


function render(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    jobs.filter(function(job){

      const c =
        customerInfo(job);


      const text = [

        c.name,
        c.phone,
        c.address,
        job.description,
        technicianName(
          job.assigned_to
        )

      ]
      .join(" ")
      .toLowerCase();


      return (

        (!query ||
        text.includes(query))

        &&

        (!status ||
        job.status === status)

      );

    });


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
      jobs.length;


  document
    .getElementById(
      "todayCount"
    )
    .textContent =
      jobs.filter(function(job){

        return String(
          job.scheduled_at || ""
        ).substring(0,10)
        === today();

      }).length;


  document
    .getElementById(
      "doneCount"
    )
    .textContent =
      jobs.filter(
        x =>
          x.status ===
          "COMPLETED"
      ).length;


  const table =
    document.getElementById(
      "jobTable"
    );


  if(!filtered.length){

    table.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          Belum ada jadwal.
        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    filtered.map(function(job){

      const c =
        customerInfo(job);

      const wa =
        whatsappLink(
          c.phone
        );


      return `

      <tr>

        <td>

          <div class="date">
            ${esc(
              formatDate(
                String(
                  job.scheduled_at || ""
                ).substring(0,10)
              )
            )}
          </div>

          <div class="time">
            ${esc(
              String(
                job.scheduled_at || ""
              ).substring(11,16)
            )}
          </div>

        </td>


        <td>

          ${esc(
            technicianName(
              job.assigned_to
            )
          )}

        </td>


        <td>

          <div class="customer">
            ${esc(c.name)}
          </div>

          ${
            wa
            ?

            `<a
              class="phone"
              href="${wa}"
              target="_blank"
            >
              WhatsApp ${esc(
                c.phone
              )}
            </a>`

            :

            `<span class="phone">
              ${esc(
                c.phone || "-"
              )}
            </span>`
          }

        </td>


        <td class="address">

          ${esc(
            c.address || "-"
          )}

        </td>


        <td class="work">

          ${esc(
            job.description ||
            "-"
          )}

        </td>


        <td>

          <span
            class="badge ${
              statusClass[
                job.status
              ] || "badge-new"
            }"
          >

            ${esc(
              statusText[
                job.status
              ] ||
              job.status ||
              "BARU"
            )}

          </span>

        </td>


        <td>

          <div class="actions">

            <button
              class="action view"
              onclick="showDetail('${job.id}')"
            >
              Detail
            </button>

            <button
              class="action edit"
              onclick="openEdit('${job.id}')"
            >
              Edit
            </button>

            <button
              class="action delete"
              onclick="deleteJob('${job.id}')"
            >
              Hapus
            </button>

          </div>

        </td>

      </tr>

      `;

    }).join("");

}


function openAdd(){

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Tambah Jadwal";


  document.getElementById(
    "jobId"
  ).value = "";


  document.getElementById(
    "scheduledDate"
  ).value =
    today();


  document.getElementById(
    "scheduledTime"
  ).value =
    "08:00";


  document.getElementById(
    "technicianId"
  ).value = "";


  document.getElementById(
    "customerName"
  ).value = "";


  document.getElementById(
    "customerPhone"
  ).value = "";


  document.getElementById(
    "customerAddress"
  ).value = "";


  document.getElementById(
    "jobDescription"
  ).value = "";


  document.getElementById(
    "jobStatus"
  ).value =
    "NEW";


  document.getElementById(
    "formMessage"
  ).innerHTML = "";


  document
    .getElementById(
      "jobModal"
    )
    .classList
    .add("show");

}


function openEdit(id){

  const job =
    jobs.find(
      x => x.id === id
    );


  if(!job)
    return;


  const c =

async function findOrCreateCustomer(
  name,
  phone,
  address
){

  const cleanPhone =
    phone.trim();


  /*
    Coba cari customer berdasarkan
    nomor WhatsApp terlebih dahulu.
  */

  if(cleanPhone){

    const {
      data
    } =
    await supabaseClient
      .from("customers")
      .select(
        "id,name,whatsapp,phone"
      )
      .or(
        `whatsapp.eq.${cleanPhone},phone.eq.${cleanPhone}`
      )
      .limit(1);


    if(
      data &&
      data.length
    ){

      return data[0].id;

    }

  }


  /*
    Kalau belum ada,
    buat customer otomatis.
  */

  const customerCode =
    "CUS-" +
    Date.now()
      .toString()
      .slice(-8);


  const payload = {

    customer_code:
      customerCode,

    name:
      name.trim(),

    whatsapp:
      cleanPhone,

    phone:
      cleanPhone,

    address:
      address.trim(),

    status:
      "ACTIVE",

    /*
      INI PENTING:
      enum database lu menggunakan
      "resedential"
    */

    customer_type:
      "resedential",

    notes:
      "Dibuat dari Jadwal Teknisi",

    created_by:
      currentUser
      ? currentUser.id
      : null

  };


  const {
    data,
    error
  } =
  await supabaseClient
    .from("customers")
    .insert(payload)
    .select("id")
    .single();


  if(error){

    throw new Error(
      "Gagal membuat customer: "
      + error.message
    );

  }


  return data.id;

}


async function saveJob(){

  const message =
    document.getElementById(
      "formMessage"
    );


  message.innerHTML = "";


  const id =
    document.getElementById(
      "jobId"
    ).value;


  const technician =
    document.getElementById(
      "technicianId"
    ).value;


  const date =
    document.getElementById(
      "scheduledDate"
    ).value;


  const time =
    document.getElementById(
      "scheduledTime"
    ).value;


  const customerName =
    document.getElementById(
      "customerName"
    ).value
    .trim();


  const customerPhone =
    document.getElementById(
      "customerPhone"
    ).value
    .trim();


  const customerAddress =
    document.getElementById(
      "customerAddress"
    ).value
    .trim();


  const description =
    document.getElementById(
      "jobDescription"
    ).value
    .trim();


  const status =
    document.getElementById(
      "jobStatus"
    ).value;


  if(
    !technician ||
    !date ||
    !time ||
    !customerName ||
    !customerPhone ||
    !customerAddress ||
    !description
  ){

    message.innerHTML =
      '<div class="error">Semua kolom wajib diisi.</div>';

    return;

  }


  try{

    /*
      Buat / cari customer
    */

    const customerId =
      await findOrCreateCustomer(
        customerName,
        customerPhone,
        customerAddress
      );


    /*
      Jadwal
    */

    const scheduledAt =
      `${date}T${time}:00`;


    const payload = {

      customer_id:
        customerId,

      assigned_to:
        technician,

      scheduled_at:
        scheduledAt,

      status:
        status,

      job_type:
        "SERVICE",

      priority:
        "NORMAL",

      title:
        description,

      description:
        description,

      estimated_cost:
        0,

      service_price:
        0,

      actual_cost:
        0,

      updated_at:
        new Date()
          .toISOString()

    };


    let result;


    if(id){

      result =
        await supabaseClient
          .from("jobs")
          .update(payload)
          .eq("id",id);

    }
    else{

      payload.job_code =
        "JOB-" +
        Date.now()
          .toString()
          .slice(-8);


      payload.created_by =
        currentUser
        ? currentUser.id
        : null;


      result =
        await supabaseClient
          .from("jobs")
          .insert(payload);

    }


    if(result.error){

      throw result.error;

    }


    closeModal();

    await loadJobs();


  }
  catch(error){

    console.error(error);


    message.innerHTML =
      `
      <div class="error">
        Gagal menyimpan:
        ${esc(
          error.message ||
          "Terjadi kesalahan"
        )}
      </div>
      `;

  }

}


async function deleteJob(id){

  if(
    !confirm(
      "Hapus jadwal ini?"
    )
  )
    return;


  const {
    error
  } =
  await supabaseClient
    .from("jobs")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Gagal menghapus: "
      + error.message
    );

    return;

  }


  await loadJobs();

}
