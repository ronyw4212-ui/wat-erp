<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Teknisi - WAT ERP</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #12458f;
            color: white;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h2 {
            margin: 0;
            font-size: 22px;
        }

        .brand small {
            opacity: .75;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .role {
            background: rgba(255,255,255,.15);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .logout {
            border: 0;
            background: white;
            color: #12458f;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1150px;
            margin: 28px auto;
            padding: 0 18px;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-head h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-head p {
            margin: 5px 0 0;
            color: #718096;
        }

        .btn-primary {
            background: #1261db;
            border: 0;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #0d4fb8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 18px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #1261db;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .stat span {
            display: block;
            color: #718096;
            font-size: 13px;
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-size: 25px;
        }

        .filter-box {
            background: white;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .filter-box input,
        .filter-box select {
            padding: 11px;
            border: 1px solid #d7deea;
            border-radius: 7px;
            outline: none;
        }

        .filter-box input {
            flex: 1;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background: #f8fafc;
            color: #667085;
            font-size: 12px;
            padding: 14px;
            white-space: nowrap;
        }

        td {
            padding: 14px;
            border-top: 1px solid #edf0f5;
            font-size: 14px;
            vertical-align: top;
        }

        .job-code {
            font-weight: bold;
            color: #1261db;
        }

        .customer-name {
            font-weight: bold;
        }

        .muted {
            color: #718096;
            font-size: 12px;
            margin-top: 4px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-new {
            background: #eef2ff;
            color: #3730a3;
        }

        .status-assigned {
            background: #e0f2fe;
            color: #0369a1;
        }

        .status-way {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-check {
            background: #fef3c7;
            color: #92400e;
        }

        .status-progress {
            background: #ede9fe;
            color: #6d28d9;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btn {
            border: 0;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 4px;
            font-size: 12px;
        }

        .detail-btn {
            background: #e0edff;
            color: #1254a4;
        }

        .edit-btn {
            background: #fff3cd;
            color: #856404;
        }

        .delete-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            max-height: 92vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 5;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .close {
            border: 0;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
            color: #667085;
        }

        .form {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d6dce8;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1261db;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #edf0f5;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            position: sticky;
            bottom: 0;
            background: white;
        }

        .btn-secondary {
            background: #edf1f6;
            color: #344054;
            border: 0;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 7px;
            font-size: 13px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #718096;
        }

        @media(max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .page-head {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .filter-box {
                flex-direction: column;
            }

            header {
                padding: 14px 16px;
            }

            .container {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        <h2>WAT ERP</h2>
        <small>Technician Control System</small>
    </div>

    <div class="header-right">
        <span class="role" id="userRole">USER</span>
        <button class="logout" id="logoutBtn">LOGOUT</button>
    </div>

</header>


<main class="container">

    <div class="page-head">

        <div>
            <h1>Jadwal Teknisi</h1>
            <p>Kelola jadwal pekerjaan teknisi dan customer</p>
        </div>

        <button class="btn-primary" id="addJobBtn">
            + Tambah Jadwal
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <span>Total Jadwal</span>
            <strong id="totalJobs">0</strong>
        </div>

        <div class="stat">
            <span>Jadwal Hari Ini</span>
            <strong id="todayJobs">0</strong>
        </div>

        <div class="stat">
            <span>Belum Selesai</span>
            <strong id="unfinishedJobs">0</strong>
        </div>

    </div>


    <div class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari customer, teknisi, alamat, pekerjaan..."
        >

        <select id="statusFilter">

            <option value="">Semua Status</option>
            <option value="NEW">Baru</option>
            <option value="ASSIGNED">Diterima Teknisi</option>
            <option value="ON_THE_WAY">Menuju Lokasi</option>
            <option value="CHECKED_IN">Check In</option>
            <option value="IN_PROGRESS">Sedang Dikerjakan</option>
            <option value="COMPLETED">Selesai</option>
            <option value="CANCELLED">Dibatalkan</option>

        </select>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>JADWAL</th>
                    <th>CUSTOMER</th>
                    <th>TEKNISI</th>
                    <th>PEKERJAAN</th>
                    <th>STATUS</th>
                    <th>AKSI</th>
                </tr>

            </thead>

            <tbody id="jobsTable">

                <tr>
                    <td colspan="6" class="loading">
                        Memuat jadwal...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- MODAL TAMBAH -->

        <div class="modal-footer">

            <button

                Batal

            <button
                type="submit"
                form="jobForm"
                class="btn-primary"
                id="saveBtn"

                Simpan Jadwal
            </button>

        </div>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>


<script>

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let allJobs = [];


/* ==========================================
   INIT
========================================== */

document.addEventListener("DOMContentLoaded", async () => {

    try {

        if (
            typeof SUPABASE_URL === "undefined" ||
            typeof SUPABASE_PUBLISHABLE_KEY === "undefined"
        ) {

            alert("Supabase belum terhubung. Cek config.js.");

            return;
        }


        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        const {
            data: {
                session
            }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href = "login.html";

            return;
        }


        currentUser = session.user;


        await loadProfile();

        await loadTechnicians();

        await loadJobs();

        setDefaultDateTime();

    } catch (error) {

        console.error(error);

        alert("Gagal membuka sistem: " + error.message);

    }

});


/* ==========================================
   PROFILE
========================================== */

async function loadProfile() {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();


    if (error) {

        console.error(error);

        return;
    }


    currentProfile = data;


    document.getElementById("userRole").textContent =
        data.role || "USER";

}


/* ==========================================
   LOGOUT
========================================== */

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";

    });


/* ==========================================
   TECHNICIAN
========================================== */

async function loadTechnicians() {

    const select =
        document.getElementById("technician_id");


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id, full_name, email, role, status")
        .eq("role", "TEKNISI")
        .eq("status", "ACTIVE")
        .order("full_name");


    if (error) {

        console.error(error);

        select.innerHTML =
            `<option value="">Gagal memuat teknisi</option>`;

        return;
    }


    select.innerHTML =
        `<option value="">Pilih teknisi</option>`;


    data.forEach(tech => {

        const option =
            document.createElement("option");

        option.value = tech.id;

        option.textContent =
            tech.full_name || tech.email;


        select.appendChild(option);

    });

}


/* ==========================================
   DEFAULT DATE
========================================== */

function setDefaultDateTime() {

    const now = new Date();


    const date =
        now.toISOString().split("T")[0];


    const time =
        now.toTimeString().slice(0,5);


    document.getElementById("job_date").value =
        date;


    document.getElementById("job_time").value =
        time;

}


/* ==========================================
   LOAD JOBS
========================================== */

async function loadJobs() {

    const tbody =
        document.getElementById("jobsTable");


    tbody.innerHTML = `
        <tr>
            <td colspan="6" class="loading">
                Memuat jadwal...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("jobs")
        .select(`
            *,
            technician:profiles!jobs_technician_id_fkey(
                id,
                full_name,
                email
            )
        `)
        .order("scheduled_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="loading">
                    Gagal memuat jadwal
                </td>
            </tr>
        `;

        return;
    }


    allJobs = data || [];

    renderJobs(allJobs);

    updateStats(allJobs);

}


/* ==========================================
   RENDER
========================================== */

function renderJobs(jobs) {

    const tbody =
        document.getElementById("jobsTable");


    if (!jobs.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="loading">
                    Belum ada jadwal
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    jobs.forEach(job => {

        const tr =
            document.createElement("tr");


        const date =
            job.scheduled_at
                ? new Date(job.scheduled_at)
                : null;


        const technician =
            job.technician?.full_name ||
            "Belum ada";


        tr.innerHTML = `

            <td>

                <div class="job-code">
                    ${escapeHtml(job.job_code || "-")}
                </div>

                <div class="muted">
                    ${date ? formatDate(date) : "-"}
                </div>

                <div class="muted">
                    ${date ? formatTime(date) : "-"}
                </div>

            </td>


            <td>

                <div class="customer-name">
                    ${escapeHtml(
                        job.customer_name || "-"
                    )}
                </div>

                <div class="muted">
                    ${escapeHtml(
                        job.customer_phone || "-"
                    )}
                </div>

                <div class="muted">
                    ${escapeHtml(
                        job.customer_address || "-"
                    )}
                </div>

            </td>


            <td>
                ${escapeHtml(technician)}
            </td>


            <td>

                <strong>
                    ${escapeHtml(job.title || "-")}
                </strong>

                <div class="muted">
                    ${escapeHtml(
                        job.work_description ||
                        job.description ||
                        "-"
                    )}
                </div>

            </td>


            <td>
                ${statusBadge(job.status)}
            </td>


            <td>

                <button
                    class="action-btn detail-btn"
                    onclick="showDetail('${job.id}')"
                >
                    Detail
                </button>

                ${
                    canManage()
                    ?
                    `
                    <button
                        class="action-btn delete-btn"
                        onclick="deleteJob('${job.id}')"
                    >
                        Hapus
                    </button>
                    `
                    :
                    ""
                }

            </td>

        `;


        tbody.appendChild(tr);

    });

}


/* ==========================================
   STATS
========================================== */

function updateStats(jobs) {

    document.getElementById("totalJobs")
        .textContent = jobs.length;


    const today =
        new Date().toISOString().split("T")[0];


    const todayCount =
        jobs.filter(job => {

            if (!job.scheduled_at)
                return false;

            return job.scheduled_at
                .startsWith(today);

        }).length;


    document.getElementById("todayJobs")
        .textContent = todayCount;


    const unfinished =
        jobs.filter(job =>
            ![
                "COMPLETED",
                "CANCELLED"
            ].includes(job.status)
        ).length;


    document.getElementById("unfinishedJobs")
        .textContent = unfinished;

}


/* ==========================================
   STATUS BADGE
========================================== */

function statusBadge(status) {

    const map = {

        NEW: [
            "Baru",
            "status-new"
        ],

        ASSIGNED: [
            "Diterima Teknisi",
            "status-assigned"
        ],

        ON_THE_WAY: [
            "Menuju Lokasi",
            "status-way"
        ],

        CHECKED_IN: [
            "Check In",
            "status-check"
        ],

        IN_PROGRESS: [
            "Sedang Dikerjakan",
            "status-progress"
        ],

        COMPLETED: [
            "Selesai",
            "status-completed"
        ],

        CANCELLED: [
            "Dibatalkan",
            "status-cancelled"
        ]

    };


    const item =
        map[status] ||
        [status || "-", "status-new"];


    return `
        <span class="status ${item[1]}">
            ${item[0]}
        </span>
    `;

}


/* ==========================================
   OPEN MODAL
========================================== */

document
    .getElementById("addJobBtn")
    .addEventListener("click", () => {

        clearForm();

        document
            .getElementById("jobModal")
            .classList.add("show");

    });


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal() {

    document
        .getElementById("jobModal")
        .classList.remove("show");

}


document
    .getElementById("closeModal")
    .addEventListener("click", closeModal);


document
    .getElementById("cancelBtn")
    .addEventListener("click", closeModal);


/* ==========================================
   CLEAR FORM
========================================== */

function clearForm() {

    document
        .getElementById("jobForm")
        .reset();


    document.getElementById("priority")
        .value = "Normal";


    document.getElementById("estimated_cost")
        .value = 0;


    document.getElementById("actual_cost")
        .value = 0;


    document.getElementById("service_price")
        .value = 0;


    clearMessage();

    setDefaultDateTime();

}


/* ==========================================
   SAVE JOB
========================================== */

document
    .getElementById("jobForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();


        if (!currentUser) {

            showMessage(
                "Session login tidak ditemukan.",
                "error"
            );

            return;
        }


        const saveBtn =
            document.getElementById("saveBtn");


        saveBtn.disabled = true;

        saveBtn.textContent =
            "Menyimpan...";


        clearMessage();


        try {

            /* -----------------------------
               AMBIL FORM
            ----------------------------- */

            const technicianId =
                document.getElementById(
                    "technician_id"
                ).value;


            const date =
                document.getElementById(
                    "job_date"
                ).value;


            const time =
                document.getElementById(
                    "job_time"
                ).value;


            const customerName =
                document.getElementById(
                    "customer_name"
                ).value.trim();


            const whatsapp =
                normalizePhone(
                    document.getElementById(
                        "customer_whatsapp"
                    ).value
                );


            const address =
                document.getElementById(
                    "customer_address"
                ).value.trim();


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const jobType =
                document.getElementById(
                    "job_type"
                ).value.trim();


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            const priority =
                document.getElementById(
                    "priority"
                ).value;


            const estimatedCost =
                Number(
                    document.getElementById(
                        "estimated_cost"
                    ).value || 0
                );


            const actualCost =
                Number(
                    document.getElementById(
                        "actual_cost"
                    ).value || 0
                );


            const servicePrice =
                Number(
                    document.getElementById(
                        "service_price"
                    ).value || 0
                );


            const technicianNotes =
                document.getElementById(
                    "technician_notes"
                ).value.trim();


            if (!technicianId)
                throw new Error(
                    "Pilih teknisi terlebih dahulu."
                );


            if (!date || !time)
                throw new Error(
                    "Tanggal dan jam wajib diisi."
                );


            /* -----------------------------
               CARI CUSTOMER LAMA
            ----------------------------- */

            let customer = null;


            const {
                data: existingCustomers,
                error: customerSearchError
            } = await supabaseClient
                .from("customers")
                .select("*")
                .or(
                    `whatsapp.eq.${whatsapp},phone.eq.${whatsapp}`
                )
                .limit(1);


            if (customerSearchError)
                throw customerSearchError;


            if (
                existingCustomers &&
                existingCustomers.length > 0
            ) {

                customer =
                    existingCustomers[0];

            }


            /* -----------------------------
               CUSTOMER BARU
            ----------------------------- */

            if (!customer) {

                const customerCode =
                    generateCustomerCode();


                const {
                    data: newCustomer,
                    error: customerInsertError
                } = await supabaseClient
                    .from("customers")
                    .insert({

                        customer_code:
                            customerCode,

                        name:
                            customerName,

                        whatsapp:
                            whatsapp,

                        phone:
                            whatsapp,

                        address:
                            address,

                        customer_type:
                            "RESIDENTIAL",

                        status:
                            "ACTIVE",

                        created_by:
                            currentUser.id,

                        notes:
                            ""

                    })
                    .select()
                    .single();


                if (customerInsertError)
                    throw customerInsertError;


                customer =
                    newCustomer;

            } else {

                /* -----------------------------
                   UPDATE DATA CUSTOMER
                   JIKA ADA PERUBAHAN
                ----------------------------- */

                const {
                    error: updateCustomerError
                } = await supabaseClient
                    .from("customers")
                    .update({

                        name:
                            customerName,

                        whatsapp:
                            whatsapp,

                        phone:
                            whatsapp,

                        address:
                            address,

                        updated_at:
                            new Date().toISOString()

                    })
                    .eq("id", customer.id);


                if (updateCustomerError) {

                    console.warn(
                        "Customer update gagal:",
                        updateCustomerError
                    );

                }

            }


            /* -----------------------------
               CREATE JOB CODE
            ----------------------------- */

            const jobCode =
                await generateJobCode();


            /* -----------------------------
               SCHEDULE
            ----------------------------- */

            const scheduledAt =
                new Date(
                    `${date}T${time}:00`
                ).toISOString();


            /* -----------------------------
               INSERT JOB
            ----------------------------- */

            const {
                data: newJob,
                error: jobError
            } = await supabaseClient
                .from("jobs")
                .insert({

                    job_code:
                        jobCode,

                    customer_id:
                        customer.id,

                    technician_id:
                        technicianId,

                    assigned_to:
                        technicianId,

                    created_by:
                        currentUser.id,

                    title:
                        title,

                    description:
                        description,

                    scheduled_at:
                        scheduledAt,

                    status:
                        "NEW",

                    technician_notes:
                        technicianNotes,

                    job_type:
                        jobType || null,

                    priority:
                        priority,

                    estimated_cost:
                        estimatedCost,

                    actual_cost:
                        actualCost,

                    service_price:
                        servicePrice,

                    customer_name:
                        customerName,

                    customer_phone:
                        whatsapp,

                    customer_address:
                        address,

                    work_description:
                        description

                })
                .select()
                .single();


            if (jobError)
                throw jobError;


            showMessage(
                "Jadwal berhasil dibuat.",
                "success"
            );


            await loadJobs();


            setTimeout(() => {

                closeModal();

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Gagal menyimpan: " +
                (error.message || error),
                "error"
            );

        } finally {

            saveBtn.disabled = false;

            saveBtn.textContent =
                "Simpan Jadwal";

        }

    });


/* ==========================================
   CUSTOMER CODE
========================================== */

function generateCustomerCode() {

    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const random =
        Math.floor(
            1000 +
            Math.random() * 9000
        );


    return `CUS-${year}${month}-${random}`;

}


/* ==========================================
   JOB CODE
========================================== */

async function generateJobCode() {

    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    const prefix =
        `JOB-${year}${month}${day}`;


    const {
        count
    } = await supabaseClient
        .from("jobs")
        .select(
            "id",
            {
                count: "exact",
                head: true
            }
        )
        .like(
            "job_code",
            `${prefix}-%`
        );


    const number =
        String(
            (count || 0) + 1
        ).padStart(4, "0");


    return `${prefix}-${number}`;

}


/* ==========================================
   PHONE
========================================== */

function normalizePhone(phone) {

    let value =
        String(phone || "")
        .replace(/\D/g, "");


    if (
        value.startsWith("0")
    ) {

        value =
            "62" +
            value.substring(1);

    }


    if (
        !value.startsWith("62")
    ) {

        value =
            "62" +
            value;

    }


    return value;

}


/* ==========================================
   DETAIL
========================================== */

window.showDetail = function(id) {

    const job =
        allJobs.find(
            item => item.id === id
        );


    if (!job)
        return;


    const technician =
        job.technician?.full_name ||
        "-";


    alert(

        `DETAIL PEKERJAAN\n\n` +

        `Job: ${job.job_code || "-"}\n` +

        `Customer: ${job.customer_name || "-"}\n` +

        `WhatsApp: ${job.customer_phone || "-"}\n` +

        `Alamat: ${job.customer_address || "-"}\n\n` +

        `Teknisi: ${technician}\n` +

        `Pekerjaan: ${job.title || "-"}\n` +

        `Keterangan: ${
            job.work_description ||
            job.description ||
            "-"
        }\n\n` +

        `Status: ${job.status || "-"}\n` +

        `Harga Service: Rp ${
            formatNumber(
                job.service_price || 0
            )
        }`

    );

};


/* ==========================================
   DELETE
========================================== */

window.deleteJob = async function(id) {

    if (!canManage())
        return;


    const yes =
        confirm(
            "Yakin ingin menghapus jadwal ini?"
        );


    if (!yes)
        return;


    const {
        error
    } = await supabaseClient
        .from("jobs")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }


    await loadJobs();

};


/* ==========================================
   ROLE
========================================== */

function canManage() {

    return (
        currentProfile &&
        (
            currentProfile.role === "OWNER" ||
            currentProfile.role === "CS"
        )
    );

}


/* ==========================================
   SEARCH
========================================== */

document
    .getElementById("searchInput")
    .addEventListener("input", filterJobs);


document
    .getElementById("statusFilter")
    .addEventListener("change", filterJobs);


function filterJobs() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        allJobs.filter(job => {

            const technician =
                job.technician?.full_name ||
                "";


            const text =
                [

                    job.job_code,

                    job.customer_name,

                    job.customer_phone,

                    job.customer_address,

                    job.title,

                    job.description,

                    technician

                ]
                .join(" ")
                .toLowerCase();


            const matchSearch =
                !search ||
                text.includes(search);


            const matchStatus =
                !status ||
                job.status === status;


            return (
                matchSearch &&
                matchStatus
            );

        });


    renderJobs(filtered);

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {

    const box =
        document.getElementById(
            "formMessage"
        );


    box.textContent =
        text;


    box.className =
        "message " +
        type;

}


function clearMessage() {

    const box =
        document.getElementById(
            "formMessage"
        );


    box.textContent = "";

    box.className =
        "message";

}


/* ==========================================
   FORMAT
========================================== */

function formatDate(date) {

    return date.toLocaleDateString(
        "id-ID",
        {
            weekday: "short",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


function formatTime(date) {

    return date.toLocaleTimeString(
        "id-ID",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function formatNumber(number) {

    return Number(
        number || 0
    ).toLocaleString("id-ID");

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
