<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Teknisi - WAT ERP</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        .topbar {
            height: 62px;
            background: #075fe8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .brand small {
            display: block;
            font-size: 10px;
            font-weight: 500;
            opacity: .8;
            margin-top: 2px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-badge {
            background: rgba(255,255,255,.15);
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .logout-btn {
            border: 0;
            background: white;
            color: #075fe8;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .page {
            max-width: 1080px;
            margin: 28px auto;
            padding: 0 18px 50px;
        }

        .page-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-head h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-head p {
            margin: 6px 0 0;
            color: #718096;
            font-size: 14px;
        }

        .primary-btn {
            background: #075fe8;
            color: white;
            border: 0;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #004dcc;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: white;
            border-left: 4px solid #075fe8;
            border-radius: 10px;
            padding: 17px 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .stat-card span {
            display: block;
            color: #718096;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .stat-card strong {
            font-size: 25px;
        }

        .toolbar {
            background: white;
            padding: 14px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 10px;
            margin-bottom: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        .toolbar input,
        .toolbar select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d9e1ec;
            border-radius: 7px;
            outline: none;
        }

        .table-wrap {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px 13px;
            background: #f8fafc;
            color: #526174;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #e8edf3;
        }

        td {
            padding: 14px 13px;
            border-bottom: 1px solid #edf1f5;
            font-size: 13px;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .job-date {
            color: #075fe8;
            font-weight: 700;
        }

        .job-code {
            color: #8491a5;
            font-size: 11px;
            margin-top: 4px;
        }

        .customer-name {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .wa-link {
            color: #0a9f52;
            font-weight: 700;
            text-decoration: none;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-baru {
            background: #e8f1ff;
            color: #1261c9;
        }

        .status-diterima {
            background: #fff3d9;
            color: #a96c00;
        }

        .status-menuju {
            background: #eee9ff;
            color: #6544c7;
        }

        .status-checkin {
            background: #e4f8f2;
            color: #087c5b;
        }

        .status-proses {
            background: #e2f1ff;
            color: #0069c9;
        }

        .status-selesai {
            background: #e2f8e9;
            color: #14833b;
        }

        .status-batal {
            background: #ffe8e8;
            color: #c53030;
        }

        .action-btn {
            border: 0;
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 11px;
            cursor: pointer;
            margin: 2px;
        }

        .btn-detail {
            background: #e8f1ff;
            color: #075fe8;
        }

        .btn-edit {
            background: #fff4d8;
            color: #9a6700;
        }

        .btn-delete {
            background: #ffe8e8;
            color: #c53030;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #8a96a8;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .60);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(650px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e8edf3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 2;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            border: 0;
            background: transparent;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #526174;
        }

        input,
        select,
        textarea {
            border: 1px solid #d7e0eb;
            border-radius: 7px;
            padding: 10px 11px;
            font-size: 13px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #075fe8;
            box-shadow: 0 0 0 2px rgba(7,95,232,.08);
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #e8edf3;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: white;
        }

        .secondary-btn {
            border: 0;
            background: #edf2f7;
            color: #334155;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .danger-message {
            background: #fff0f0;
            color: #c53030;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-box {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 12px;
        }

        .detail-box.full {
            grid-column: 1 / -1;
        }

        .detail-box small {
            display: block;
            color: #7b8797;
            font-size: 10px;
            margin-bottom: 5px;
        }

        .detail-box strong {
            font-size: 13px;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .table-wrap {
                overflow-x: auto;
            }

            table {
                min-width: 850px;
            }
        }

        @media(max-width: 600px) {
            .topbar {
                padding: 0 14px;
            }

            .page {
                margin-top: 20px;
            }

            .page-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-grid,
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full,
            .detail-box.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        WAT ERP
        <small>Technician Control System</small>
    </div>

    <div class="top-right">
        <span class="role-badge" id="roleBadge">USER</span>
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
    </div>
</header>


<main class="page">

    <div class="page-head">
        <div>
            <h1>Jadwal Teknisi</h1>
            <p>Kelola dan pantau pekerjaan teknisi dan customer</p>
        </div>

        <button class="primary-btn" id="addJobBtn">
            + Tambah Jadwal
        </button>
    </div>


    <section class="stats">

        <div class="stat-card">
            <span>Total Jadwal</span>
            <strong id="totalJobs">0</strong>
        </div>

        <div class="stat-card">
            <span>Jadwal Hari Ini</span>
            <strong id="todayJobs">0</strong>
        </div>

        <div class="stat-card">
            <span>Belum Selesai</span>
            <strong id="pendingJobs">0</strong>
        </div>

    </section>


    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari customer, teknisi, alamat, pekerjaan..."
        >

        <select id="statusFilter">
            <option value="">Semua Status</option>
            <option value="NEW">Baru</option>
            <option value="ACCEPTED">Diterima</option>
            <option value="EN_ROUTE">Menuju Lokasi</option>
            <option value="CHECKED_IN">Check In</option>
            <option value="IN_PROGRESS">Proses</option>
            <option value="COMPLETED">Selesai</option>
            <option value="CANCELLED">Batal</option>
        </select>

    </section>


    <section class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Jadwal</th>
                    <th>Customer</th>
                    <th>Teknisi</th>
                    <th>Pekerjaan</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="jobsBody">

                <tr>
                    <td colspan="6">
                        <div class="empty">
                            Memuat jadwal...
                        </div>
                    </td>
                </tr>

            </tbody>

        </table>

    </section>

</main>


<!-- ================= MODAL TAMBAH / EDIT ================= -->

<div class="modal-overlay" id="jobModal">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Tambah Jadwal
            </h2>

            <button class="close-btn" id="closeModal">
                ×
            </button>

        </div>


        <form id="jobForm">

            <div class="modal-body">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Teknisi *</label>

                        <select id="technicianId" required>

                            <option value="">
                                Memuat teknisi...
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Tanggal *</label>

                        <input
                            type="date"
                            id="jobDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Jam *</label>

                        <input
                            type="time"
                            id="jobTime"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>No. WhatsApp Customer *</label>

                        <input
                            type="text"
                            id="customerPhone"
                            placeholder="08xxxxxxxxxx"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Nama Customer *</label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Nama customer"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>Alamat Customer *</label>

                        <textarea
                            id="customerAddress"
                            placeholder="Alamat lengkap customer"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>Judul Pekerjaan *</label>

                        <input
                            type="text"
                            id="jobTitle"
                            placeholder="Contoh: Cuci AC"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Jenis Pekerjaan</label>

                        <input
                            type="text"
                            id="jobType"
                            placeholder="Contoh: Cuci AC"
                        >

                    </div>


                    <div class="form-group full">

                        <label>Keterangan / Pekerjaan *</label>

                        <textarea
                            id="jobDescription"
                            placeholder="Contoh: Cuci AC 2 unit"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>Prioritas</label>

                        <select id="priority">

                            <option value="NORMAL">
                                Normal
                            </option>

                            <option value="LOW">
                                Rendah
                            </option>

                            <option value="HIGH">
                                Tinggi
                            </option>

                            <option value="URGENT">
                                Urgent
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Status</label>

                        <select id="jobStatus">

                            <option value="NEW">
                                Baru
                            </option>

                            <option value="ACCEPTED">
                                Diterima
                            </option>

                            <option value="EN_ROUTE">
                                Menuju Lokasi
                            </option>

                            <option value="CHECKED_IN">
                                Check In
                            </option>

                            <option value="IN_PROGRESS">
                                Proses
                            </option>

                            <option value="COMPLETED">
                                Selesai
                            </option>

                            <option value="CANCELLED">
                                Batal
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Estimasi Biaya</label>

                        <input
                            type="number"
                            id="estimatedCost"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="form-group">

                        <label>Actual Cost</label>

                        <input
                            type="number"
                            id="actualCost"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="form-group">

                        <label>Harga Service</label>

                        <input
                            type="number"
                            id="servicePrice"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="form-group full">

                        <label>Catatan Teknisi</label>

                        <textarea
                            id="technicianNotes"
                            placeholder="Catatan teknisi..."
                        ></textarea>

                    </div>

                </div>


                <div
                    class="danger-message"
                    id="formError"
                ></div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelModal"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                    id="saveJobBtn"
                >
                    Simpan Jadwal
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ================= MODAL DETAIL ================= -->

<div class="modal-overlay" id="detailModal">

    <div class="modal">

        <div class="modal-header">

            <h2>Detail Pekerjaan</h2>

            <button class="close-btn" id="closeDetail">
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="detail-grid" id="detailContent"></div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CONFIG -->
<script src="assets/js/config.js"></script>


<script>

let db = null;
let currentUser = null;
let currentProfile = null;
let jobs = [];
let technicians = [];
let editingJobId = null;


/* ================================
   INITIALIZE
================================ */

document.addEventListener("DOMContentLoaded", async () => {

    try {

        if (
            typeof SUPABASE_URL === "undefined" ||
            typeof SUPABASE_PUBLISHABLE_KEY === "undefined"
        ) {

            alert("Supabase belum terhubung. Cek config.js.");

            return;
        }


        db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        await checkSession();

        setupEvents();

        await loadTechnicians();

        await loadJobs();

    } catch (error) {

        console.error(error);

        alert(
            "Terjadi kesalahan saat memuat sistem."
        );

    }

});


/* ================================
   SESSION
================================ */

async function checkSession() {

    const {
        data,
        error
    } = await db.auth.getSession();


    if (error) {

        console.error(error);

        return;
    }


    if (!data.session) {

        window.location.href = "login.html";

        return;
    }


    currentUser = data.session.user;


    await loadProfile();

}


/* ================================
   PROFILE
================================ */

async function loadProfile() {

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (error) {

        console.error(
            "Profile error:",
            error
        );

        document.getElementById(
            "roleBadge"
        ).textContent = "USER";

        return;
    }


    currentProfile = data;


    if (data) {

        document.getElementById(
            "roleBadge"
        ).textContent =
            String(
                data.role || "USER"
            ).toUpperCase();

    }

}


/* ================================
   LOAD TECHNICIANS
================================ */

async function loadTechnicians() {

    const select =
        document.getElementById(
            "technicianId"
        );


    select.innerHTML =
        `<option value="">
            Memuat teknisi...
        </option>`;


    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("id, full_name, email, role, status")
        .eq("role", "TEKNISI")
        .eq("status", "ACTIVE")
        .order("full_name");


    if (error) {

        console.error(
            "Technician error:",
            error
        );

        select.innerHTML =
            `<option value="">
                Gagal memuat teknisi
            </option>`;

        return;
    }


    technicians = data || [];


    select.innerHTML =
        `<option value="">
            Pilih teknisi
        </option>`;


    technicians.forEach(
        technician => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                technician.id;

            option.textContent =
                technician.full_name ||
                technician.email;

            select.appendChild(
                option
            );

        }
    );

}


/* ================================
   LOAD JOBS
================================ */

async function loadJobs() {

    const tbody =
        document.getElementById(
            "jobsBody"
        );


    tbody.innerHTML =
        `<tr>
            <td colspan="6">
                <div class="empty">
                    Memuat jadwal...
                </div>
            </td>
        </tr>`;


    const {
        data,
        error
    } = await db
        .from("jobs")
        .select(`
            *
        `)
        .order(
            "scheduled_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Jobs error:",
            error
        );

        tbody.innerHTML =
            `<tr>
                <td colspan="6">
                    <div class="empty">
                        Gagal memuat jadwal.
                    </div>
                </td>
            </tr>`;

        return;
    }


    jobs = data || [];


    renderJobs();

}


/* ================================
   RENDER JOBS
================================ */

function renderJobs() {

    const tbody =
        document.getElementById(
            "jobsBody"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =
        jobs.filter(job => {

            const text = [
                job.customer_name,
                job.customer_phone,
                job.customer_address,
                job.title,
                job.description,
                job.work_description,
                getTechnicianName(
                    job.technician_id
                )
            ]
            .join(" ")
            .toLowerCase();


            const matchSearch =
                !search ||
                text.includes(search);


            const matchStatus =
                !status ||
                job.status === status;


            return (
                matchSearch &&
                matchStatus
            );

        });


    updateStats();


    if (!filtered.length) {

        tbody.innerHTML =
            `<tr>
                <td colspan="6">
                    <div class="empty">
                        Belum ada jadwal.
                    </div>
                </td>
            </tr>`;

        return;
    }


    tbody.innerHTML = "";


    filtered.forEach(job => {

        const tr =
            document.createElement(
                "tr"
            );


        const date =
            formatDateTime(
                job.scheduled_at
            );


        const technician =
            getTechnicianName(
                job.technician_id
            );


        tr.innerHTML = `

            <td>

                <div class="job-date">
                    ${escapeHtml(date.date)}
                </div>

                <div>
                    ${escapeHtml(date.time)}
                </div>

                <div class="job-code">
                    ${escapeHtml(job.job_code || "-")}
                </div>

            </td>


            <td>

                <div class="customer-name">
                    ${escapeHtml(
                        job.customer_name || "-"
                    )}
                </div>

                <div>
                    ${escapeHtml(
                        job.customer_address || "-"
                    )}
                </div>

                ${
                    job.customer_phone
                    ?
                    `<a
                        class="wa-link"
                        href="${getWhatsAppUrl(
                            job.customer_phone
                        )}"
                        target="_blank"
                    >
                        WhatsApp
                    </a>`
                    :
                    ""
                }

            </td>

function updateStats() {

    document.getElementById(
        "totalJobs"
    ).textContent =
        jobs.length;


    const today =
        new Date();


    const todayString =
        today
            .toISOString()
            .slice(0, 10);


    const todayCount =
        jobs.filter(job => {

            if (!job.scheduled_at) {
                return false;
            }

            return new Date(
                job.scheduled_at
            )
            .toISOString()
            .slice(0, 10)
            === todayString;

        }).length;


    const pending =
        jobs.filter(job =>
            ![
                "COMPLETED",
                "CANCELLED"
            ].includes(
                job.status
            )
        ).length;


    document.getElementById(
        "todayJobs"
    ).textContent =
        todayCount;


    document.getElementById(
        "pendingJobs"
    ).textContent =
        pending;

}

/* ================================
   SAVE JOB
================================ */

async function saveJob(event) {

    event.preventDefault();


    clearError();


    if (!db || !currentUser) {

        showError(
            "Session Supabase belum aktif."
        );

        return;
    }


    const technicianId =
        document.getElementById(
            "technicianId"
        ).value;


    const date =
        document.getElementById(
            "jobDate"
        ).value;


    const time =
        document.getElementById(
            "jobTime"
        ).value;


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const customerAddress =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const title =
        document.getElementById(
            "jobTitle"
        ).value.trim();


    const description =
        document.getElementById(
            "jobDescription"
        ).value.trim();


    if (
        !technicianId ||
        !date ||
        !time ||
        !customerName ||
        !customerPhone ||
        !customerAddress ||
        !title ||
        !description
    ) {

        showError(
            "Mohon lengkapi semua kolom wajib."
        );

        return;
    }


    const saveButton =
        document.getElementById(
            "saveJobBtn"
        );


    saveButton.disabled = true;

    saveButton.textContent =
        "Menyimpan...";


    try {

        /*
         * 1. Cari customer berdasarkan
         *    nomor WhatsApp.
         */

        let customerId = null;


        const {
            data: existingCustomer,
            error: customerSearchError
        } = await db
            .from("customers")
            .select("id")
            .eq(
                "phone",
                customerPhone
            )
            .maybeSingle();


        if (
            customerSearchError &&
            customerSearchError.code !== "PGRST116"
        ) {

            throw customerSearchError;

        }


        if (existingCustomer) {

            customerId =
                existingCustomer.id;

        }


        /*
         * 2. Kalau customer belum ada,
         *    buat customer baru.
         */

        if (!customerId) {

            const {
                data: newCustomer,
                error: customerInsertError
            } = await db
                .from("customers")
                .insert({

                    name:
                        customerName,

                    phone:
                        customerPhone,

                    address:
                        customerAddress

                })
                .select("id")
                .single();


            if (customerInsertError) {

                throw new Error(
                    "Gagal membuat customer: " +
                    customerInsertError.message
                );

            }


            customerId =
                newCustomer.id;

        }


        /*
         * 3. Waktu pekerjaan.
         */

        const scheduledAt =
            new Date(
                `${date}T${time}:00`
            ).toISOString();


        /*
         * 4. Data job.
         */

        const baseData = {

            customer_id:
                customerId,

            technician_id:
                technicianId,

            assigned_to:
                technicianId,

            title:
                title,

            description:
                description,

            work_description:
                description,

            scheduled_at:
                scheduledAt,

            status:
                document.getElementById(
                    "jobStatus"
                ).value,

            job_type:
                document.getElementById(
                    "jobType"
                ).value.trim() || null,

            priority:
                document.getElementById(
                    "priority"
                ).value,

            estimated_cost:
                Number(
                    document.getElementById(
                        "estimatedCost"
                    ).value
                ) || 0,

            actual_cost:
                Number(
                    document.getElementById(
                        "actualCost"
                    ).value
                ) || 0,

            service_price:
                Number(
                    document.getElementById(
                        "servicePrice"
                    ).value
                ) || 0,

            technician_notes:
                document.getElementById(
                    "technicianNotes"
                ).value.trim() || null,

            customer_name:
                customerName,

            customer_phone:
                customerPhone,

            customer_address:
                customerAddress

        };


        /*
         * 5. UPDATE
         */

        if (editingJobId) {

            const {
                error
            } = await db
                .from("jobs")
                .update(
                    baseData
                )
                .eq(
                    "id",
                    editingJobId
                );


            if (error) {
                throw error;
            }

        }


        /*
         * 6. INSERT
         */

        else {

            const jobCode =
                generateJobCode();


            const insertData = {

                ...baseData,

                job_code:
                    jobCode,

                created_by:
                    currentUser.id

            };


            const {
                error
            } = await db
                .from("jobs")
                .insert(
                    insertData
                );


            if (error) {
                throw error;
            }

        }


        closeJobModal();


        await loadJobs();


        alert(
            editingJobId
            ? "Jadwal berhasil diperbarui."
            : "Jadwal berhasil dibuat."
        );


    } catch (error) {

        console.error(
            "SAVE ERROR:",
            error
        );


        showError(
            error.message ||
            "Gagal menyimpan jadwal."
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Simpan Jadwal";

    }

}


/* ================================
   DELETE
================================ */

async function deleteJob(id) {

    const job =
        jobs.find(
            item => item.id === id
        );


    if (!job) {
        return;
    }


    const yes =
        confirm(
            `Hapus jadwal ${job.job_code || ""}?`
        );


    if (!yes) {
        return;
    }


    const {
        error
    } = await db
        .from("jobs")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;
    }


    await loadJobs();

}

/* ================================
   HELPERS
================================ */

function getTechnicianName(id) {

    if (!id) {
        return "-";
    }


    const technician =
        technicians.find(
            item => item.id === id
        );


    if (!technician) {
        return "-";
    }


    return (
        technician.full_name ||
        technician.email ||
        "-"
    );

}


function generateJobCode() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    const random =
        Math.random()
            .toString(36)
            .substring(2, 7)
            .toUpperCase();


    return (
        `JOB-${year}${month}${day}-${random}`
    );

}


function formatDateTime(value) {

    if (!value) {

        return {
            date: "-",
            time: "-"
        };

    }


    const d =
        new Date(value);


    return {

        date:
            d.toLocaleDateString(
                "id-ID",
                {
                    weekday: "short",
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            ),

        time:
            d.toLocaleTimeString(
                "id-ID",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )

    };

}


function localDateValue(date) {

    const y =
        date.getFullYear();


    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const d =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${y}-${m}-${d}`;

}


function localTimeValue(date) {

    const h =
        String(
            date.getHours()
        ).padStart(2, "0");


    const m =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    return `${h}:${m}`;

}


function setDefaultDateTime() {

    const now =
        new Date();


    document.getElementById(
        "jobDate"
    ).value =
        localDateValue(now);


    document.getElementById(
        "jobTime"
    ).value =
        localTimeValue(now);

}


function statusBadge(status) {

    const map = {

        NEW: [
            "Baru",
            "status-baru"
        ],

        ACCEPTED: [
            "Diterima",
            "status-diterima"
        ],

        EN_ROUTE: [
            "Menuju Lokasi",
            "status-menuju"
        ],

        CHECKED_IN: [
            "Check In",
            "status-checkin"
        ],

        IN_PROGRESS: [
            "Proses",
            "status-proses"
        ],

        COMPLETED: [
            "Selesai",
            "status-selesai"
        ],

        CANCELLED: [
            "Batal",
            "status-batal"
        ]

    };


    const item =
        map[status] ||
        [
            status || "-",
            "status-baru"
        ];


    return `
        <span class="status ${item[1]}">
            ${escapeHtml(item[0])}
        </span>
    `;

}


function formatRupiah(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value) || 0
    );

}


function getWhatsAppUrl(phone) {

    let number =
        String(phone)
            .replace(/\D/g, "");


    if (
        number.startsWith("0")
    ) {

        number =
            "62" +
            number.substring(1);

    }


    if (
        !number.startsWith("62")
    ) {

        number =
            "62" +
            number;

    }


    return (
        "https://wa.me/" +
        number
    );

}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
