<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jadwal Teknisi - WAT ERP</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:#f4f7fb;
            font-family:Arial,Helvetica,sans-serif;
            color:#172033;
        }

        .page{
            max-width:1100px;
            margin:0 auto;
            padding:28px 20px 50px;
        }

        .page-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            margin-bottom:22px;
        }

        .page-head h1{
            margin:0;
            font-size:28px;
        }

        .page-head p{
            margin:6px 0 0;
            color:#718096;
            font-size:14px;
        }

        .btn{
            border:0;
            border-radius:8px;
            padding:11px 16px;
            cursor:pointer;
            font-weight:600;
        }

        .btn-primary{
            background:#0866ff;
            color:#fff;
        }

        .btn-primary:hover{
            background:#0055dd;
        }

        .btn-secondary{
            background:#edf2f7;
            color:#334155;
        }

        .btn-danger{
            background:#fee2e2;
            color:#b91c1c;
        }

        .btn-warning{
            background:#fef3c7;
            color:#92400e;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:16px;
            margin-bottom:20px;
        }

        .stat{
            background:#fff;
            border-radius:12px;
            padding:20px;
            box-shadow:0 4px 18px rgba(0,0,0,.06);
            border-left:4px solid #0866ff;
        }

        .stat-label{
            color:#718096;
            font-size:13px;
        }

        .stat-value{
            margin-top:8px;
            font-size:27px;
            font-weight:bold;
        }

        .filter-box{
            background:#fff;
            padding:14px;
            border-radius:12px;
            margin-bottom:20px;
            display:grid;
            grid-template-columns:1fr 180px;
            gap:10px;
            box-shadow:0 4px 18px rgba(0,0,0,.05);
        }

        input,
        select,
        textarea{
            width:100%;
            border:1px solid #d8e0eb;
            border-radius:8px;
            padding:11px 12px;
            font-size:14px;
            outline:none;
            background:#fff;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color:#0866ff;
            box-shadow:0 0 0 3px rgba(8,102,255,.08);
        }

        .table-box{
            background:#fff;
            border-radius:12px;
            overflow:auto;
            box-shadow:0 4px 18px rgba(0,0,0,.05);
        }

        table{
            width:100%;
            border-collapse:collapse;
            min-width:850px;
        }

        th{
            background:#f8fafc;
            text-align:left;
            padding:14px;
            font-size:12px;
            color:#475569;
            text-transform:uppercase;
        }

        td{
            padding:14px;
            border-top:1px solid #edf2f7;
            font-size:13px;
            vertical-align:top;
        }

        .customer-name{
            font-weight:bold;
        }

        .phone{
            color:#64748b;
            margin-top:4px;
        }

        .whatsapp{
            display:inline-block;
            margin-top:5px;
            color:#16a34a;
            text-decoration:none;
            font-weight:600;
        }

        .badge{
            display:inline-block;
            padding:5px 9px;
            border-radius:20px;
            font-size:11px;
            font-weight:bold;
        }

        .badge-new{
            background:#dbeafe;
            color:#1d4ed8;
        }

        .badge-progress{
            background:#fef3c7;
            color:#92400e;
        }

        .badge-done{
            background:#dcfce7;
            color:#166534;
        }

        .badge-cancel{
            background:#fee2e2;
            color:#991b1b;
        }

        .actions{
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }

        .actions button{
            border:0;
            border-radius:6px;
            padding:7px 9px;
            font-size:11px;
            cursor:pointer;
        }

        .modal-overlay{
            position:fixed;
            inset:0;
            background:rgba(15,23,42,.55);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:1000;
        }

        .modal-overlay.show{
            display:flex;
        }

        .modal{
            width:100%;
            max-width:650px;
            max-height:92vh;
            overflow-y:auto;
            background:#fff;
            border-radius:14px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        }

        .modal-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px;
            border-bottom:1px solid #edf2f7;
        }

        .modal-head h2{
            margin:0;
            font-size:19px;
        }

        .close{
            border:0;
            background:none;
            font-size:25px;
            cursor:pointer;
            color:#64748b;
        }

        .modal-body{
            padding:20px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .form-group{
            margin-bottom:15px;
        }

        .form-group.full{
            grid-column:1 / -1;
        }

        label{
            display:block;
            margin-bottom:7px;
            font-size:12px;
            font-weight:bold;
            color:#475569;
        }

        textarea{
            min-height:90px;
            resize:vertical;
        }

        .modal-footer{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            padding:16px 20px;
            border-top:1px solid #edf2f7;
        }

        .message{
            margin-top:10px;
            padding:10px 12px;
            border-radius:7px;
            font-size:13px;
            display:none;
        }

        .message.show{
            display:block;
        }

        .message.error{
            background:#fee2e2;
            color:#991b1b;
        }

        .message.success{
            background:#dcfce7;
            color:#166534;
        }

        .empty{
            padding:35px;
            text-align:center;
            color:#94a3b8;
        }

        .loading{
            padding:35px;
            text-align:center;
            color:#64748b;
        }

        @media(max-width:700px){

            .page{
                padding:20px 12px 40px;
            }

            .page-head{
                align-items:flex-start;
            }

            .page-head h1{
                font-size:23px;
            }

            .stats{
                grid-template-columns:1fr;
            }

            .filter-box{
                grid-template-columns:1fr;
            }

            .form-grid{
                grid-template-columns:1fr;
            }

            .form-group.full{
                grid-column:auto;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="topbar">

    <div>

        <strong>
            WAT ERP
        </strong>

        <small>
            Technician Control System
        </small>

    </div>

    <div
        id="userInfo"
        style="display:flex;align-items:center;gap:12px;"
    >

        <span id="userName">
            -
        </span>

        <button
            class="btn btn-secondary"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>

</header>



<!-- =========================================
     PAGE
========================================= -->

<main class="page">


    <div class="page-head">

        <div>

            <h1>
                Jadwal Teknisi
            </h1>

            <p>
                Kelola jadwal pekerjaan teknisi dan customer
            </p>

        </div>


        <button
            class="btn btn-primary"
            onclick="openAddModal()"
        >
            + Tambah Jadwal
        </button>

    </div>



    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Total Jadwal
            </div>

            <div
                class="stat-value"
                id="totalJobs"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Jadwal Hari Ini
            </div>

            <div
                class="stat-value"
                id="todayJobs"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Belum Selesai
            </div>

            <div
                class="stat-value"
                id="pendingJobs"
            >
                0
            </div>

        </div>

    </div>



    <!-- =====================================
         FILTER
    ====================================== -->

    <div class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari customer, teknisi, alamat, pekerjaan..."
            oninput="renderJobs()"
        >

        <select
            id="statusFilter"
            onchange="renderJobs()"
        >

            <option value="">
                Semua Status
            </option>

            <option value="NEW">
                Baru
            </option>

            <option value="ON_THE_WAY">
                Menuju Lokasi
            </option>

            <option value="CHECKED_IN">
                Check In
            </option>

            <option value="IN_PROGRESS">
                Mulai Pekerjaan
            </option>

            <option value="COMPLETED">
                Selesai
            </option>

            <option value="CANCELLED">
                Dibatalkan
            </option>

        </select>

    </div>



    <!-- =====================================
         TABLE
    ====================================== -->

    <div class="table-box">

        <div
            id="loading"
            class="loading"
        >
            Memuat jadwal...
        </div>


        <table id="jobsTable">

            <thead>

                <tr>

                    <th>
                        Jadwal
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Teknisi
                    </th>

                    <th>
                        Pekerjaan
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Aksi
                    </th>

                </tr>

            </thead>

            <tbody id="jobsBody">
            </tbody>

        </table>

    </div>


</main>



<!-- =========================================
     MODAL TAMBAH / EDIT
========================================= -->

<div
    class="modal-overlay"
    id="jobModal"
>

    <div class="modal">

        <div class="modal-head">

            <h2 id="modalTitle">
                Tambah Jadwal
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="jobForm">

            <div class="modal-body">

                <div class="form-grid">


                    <!-- TEKNISI -->

                    <div class="form-group">

                        <label>
                            Teknisi *
                        </label>

                        <select
                            id="technicianId"
                            required
                        >

                            <option value="">
                                Pilih Teknisi
                            </option>

                        </select>

                    </div>



                    <!-- TANGGAL -->

                    <div class="form-group">

                        <label>
                            Tanggal *
                        </label>

                        <input
                            type="date"
                            id="jobDate"
                            required
                        >

                    </div>



                    <!-- JAM -->

                    <div class="form-group">

                        <label>
                            Jam *
                        </label>

                        <input
                            type="time"
                            id="jobTime"
                            required
                        >

                    </div>



                    <!-- CUSTOMER -->

                    <div class="form-group">

                        <label>
                            Nama Customer *
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Nama customer"
                            required
                        >

                    </div>



                    <!-- WHATSAPP -->

                    <div class="form-group full">

                        <label>
                            No. WhatsApp Customer *
                        </label>

                        <input
                            type="text"
                            id="customerPhone"
                            placeholder="08xxxxxxxxxx"
                            required
                        >

                    </div>



                    <!-- ALAMAT -->

                    <div class="form-group full">

                        <label>
                            Alamat Customer *
                        </label>

                        <textarea
                            id="customerAddress"
                            placeholder="Alamat lengkap customer"
                            required
                        ></textarea>

                    </div>



                    <!-- JUDUL -->

                    <div class="form-group full">

                        <label>
                            Judul Pekerjaan *
                        </label>

                        <input
                            type="text"
                            id="jobTitle"
                            placeholder="Contoh: Cuci AC 2 unit"
                            required
                        >

                    </div>



                    <!-- KETERANGAN -->

                    <div class="form-group full">

                        <label>
                            Keterangan / Pekerjaan *
                        </label>

                        <textarea
                            id="jobDescription"
                            placeholder="Detail pekerjaan..."
                            required
                        ></textarea>

                    </div>



                    <!-- JENIS -->

                    <div class="form-group">

                        <label>
                            Jenis Pekerjaan
                        </label>

                        <input
                            type="text"
                            id="jobType"
                            placeholder="Contoh: cuci AC"
                        >

                    </div>



                    <!-- PRIORITAS -->

                    <div class="form-group">

                        <label>
                            Prioritas
                        </label>

                        <select id="priority">

                            <option value="NORMAL">
                                Normal
                            </option>

                            <option value="LOW">
                                Rendah
                            </option>

                            <option value="HIGH">
                                Tinggi
                            </option>

                            <option value="URGENT">
                                Urgent
                            </option>

                        </select>

                    </div>



                    <!-- STATUS -->

                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="jobStatus">

                            <option value="NEW">
                                Baru
                            </option>

                            <option value="ON_THE_WAY">
                                Menuju Lokasi
                            </option>

                            <option value="CHECKED_IN">
                                Check In
                            </option>

                            <option value="IN_PROGRESS">
                                Mulai Pekerjaan
                            </option>

                            <option value="COMPLETED">
                                Selesai
                            </option>

                            <option value="CANCELLED">
                                Dibatalkan
                            </option>

                        </select>

                    </div>



                    <!-- ESTIMASI -->

                    <div class="form-group">

                        <label>
                            Estimasi Biaya
                        </label>

                        <input
                            type="number"
                            id="estimatedCost"
                            min="0"
                            value="0"
                        >

                    </div>



                    <!-- SERVICE PRICE -->

                    <div class="form-group">

                        <label>
                            Harga Service
                        </label>

                        <input
                            type="number"
                            id="servicePrice"
                            min="0"
                            value="0"
                        >

                    </div>



                    <!-- ACTUAL COST -->

                    <div class="form-group">

                        <label>
                            Actual Cost
                        </label>

                        <input
                            type="number"
                            id="actualCost"
                            min="0"
                            value="0"
                        >

                    </div>



                    <!-- CATATAN -->

                    <div class="form-group full">

                        <label>
                            Catatan Teknisi
                        </label>

                        <textarea
                            id="technicianNotes"
                            placeholder="Catatan teknisi..."
                        ></textarea>

                    </div>


                </div>


                <div
                    id="formMessage"
                    class="message"
                ></div>


            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeModal()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveButton"
                >
                    Simpan Jadwal
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>


<script>


/* =========================================
   SUPABASE CLIENT
========================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



let currentUser = null;

let currentProfile = null;

let jobs = [];

let technicians = [];

let editingJobId = null;



/* =========================================
   INIT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(
            error ||
            !data.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        /* ================================
           PROFILE
        ================================= */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,full_name,email,role,status"
            )
            .eq(
                "id",
                currentUser.id
            )
            .single();


        if(profileError){

            console.error(
                profileError
            );

            alert(
                "Profile tidak ditemukan."
            );

            return;

        }


        currentProfile =
            profile;


        const role =
            String(
                profile.role || ""
            )
            .toUpperCase();


        /*
           Hanya OWNER dan CS
           yang boleh masuk jobs.html
        */

        if(
            role !== "OWNER" &&
            role !== "CS"
        ){

            window.location.href =
                "technician.html";

            return;

        }


        document
            .getElementById("userName")
            .textContent =
                profile.full_name ||
                profile.email ||
                "-";


        await loadTechnicians();

        await loadJobs();

        setDefaultDate();


    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Gagal memuat halaman."
        );

    }

}



/* =========================================
   LOAD TEKNISI
========================================= */

async function loadTechnicians(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,email,status,role"
        )
        .eq(
            "role",
            "TEKNISI"
        )
        .eq(
            "status",
            "ACTIVE"
        )
        .order(
            "full_name"
        );


    if(error){

        console.error(
            "Technician error:",
            error
        );

        return;

    }


    technicians =
        data || [];


    const select =
        document
        .getElementById("technicianId");


    select.innerHTML =
        `<option value="">
            Pilih Teknisi
        </option>`;


    technicians.forEach(
        technician => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                technician.id;


            option.textContent =
                technician.full_name ||
                technician.email;


            select.appendChild(
                option
            );

        }
    );

}



/* =========================================
   LOAD JOBS
========================================= */

async function loadJobs(){

    document
        .getElementById("loading")
        .style.display =
            "block";


    const {
        data,
        error
    } =
    await supabaseClient
        .from("jobs")
        .select(`
            id,
            job_code,
            customer_id,
            technician_id,
            created_by,
            title,
            description,
            scheduled_at,
            status,
            started_at,
            completed_at,
            checkin_at,
            checkout_at,
            technician_notes,
            created_at,
            updated_at,
            assigned_to,
            job_type,
            priority,
            estimated_cost,
            actual_cost,
            service_price,
            customer_name,
            customer_phone,
            customer_address,
            work_description
        `)
        .order(
            "scheduled_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Jobs error:",
            error
        );


        document
            .getElementById("loading")
            .textContent =
                "Gagal memuat jadwal: " +
                error.message;

        return;

    }


    jobs =
        data || [];


    document
        .getElementById("loading")
        .style.display =
            "none";


    updateStats();

    renderJobs();

}



/* =========================================
   RENDER JOBS
========================================= */

function renderJobs(){

    const body =
        document
        .getElementById("jobsBody");


    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const status =
        document
        .getElementById("statusFilter")
        .value;


    let filtered =
        jobs.filter(
            job => {

                const text = [

                    job.customer_name,

                    job.customer_phone,

                    job.customer_address,

                    job.title,

                    job.description,

                    job.work_description,

                    job.job_type

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                const technician =
                    getTechnicianName(
                        job.technician_id
                    )
                    .toLowerCase();


                const matchSearch =
                    !search ||
                    text.includes(search) ||
                    technician.includes(search);


                const matchStatus =
                    !status ||
                    job.status === status;


                return (
                    matchSearch &&
                    matchStatus
                );

            }
        );


    if(
        filtered.length === 0
    ){

        body.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Belum ada jadwal.
                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        filtered
        .map(
            job => {

                const date =
                    new Date(
                        job.scheduled_at
                    );


                const dateText =
                    date.toLocaleDateString(
                        "id-ID",
                        {
                            weekday:"long",
                            day:"2-digit",
                            month:"short",
                            year:"numeric"
                        }
                    );


                const timeText =
                    date.toLocaleTimeString(
                        "id-ID",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );


                const technician =
                    getTechnicianName(
                        job.technician_id
                    );


                return `

                    <tr>

                        <td>

                            <strong>
                                ${escapeHtml(
                                    dateText
                                )}
                            </strong>

                            <div
                                style="
                                color:#0866ff;
                                margin-top:4px;
                                font-weight:bold;
                                "
                            >
                                ${timeText}
                            </div>

                            <div
                                style="
                                color:#94a3b8;
                                margin-top:4px;
                                font-size:11px;
                                "
                            >
                                ${escapeHtml(
                                    job.job_code || "-"
                                )}
                            </div>

                        </td>


                        <td>

                            <div
                                class="customer-name"
                            >
                                ${escapeHtml(
                                    job.customer_name || "-"
                                )}
                            </div>

                            <div
                                class="phone"
                            >
                                ${escapeHtml(
                                    job.customer_phone || "-"
                                )}
                            </div>

                            ${
                                job.customer_phone
                                ?
                                `
                                <a
                                    class="whatsapp"
                                    target="_blank"
                                    href="${whatsappLink(
                                        job.customer_phone
                                    )}"
                                >
                                    WhatsApp
                                </a>
                                `
                                :
                                ""
                            }

                        </td>


                        <td>

                            ${escapeHtml(
                                technician
                            )}

                        </td>


                        <td>

                            <strong>
                                ${escapeHtml(
                                    job.title ||
                                    job.work_description ||
                                    "-"
                                )}
                            </strong>

                            <div
                                style="
                                color:#64748b;
                                margin-top:5px;
                                "
                            >
                                ${escapeHtml(
                                    job.description ||
                                    "-"
                                )}
                            </div>

                        </td>


                        <td>

                            ${statusBadge(
                                job.status
                            )}

                        </td>


                        <td>

                            <div
                                class="actions"
                            >

                                <button
                                    class="btn-primary"
                                    onclick="viewJob('${job.id}')"
                                >
                                    Detail
                                </button>

                                <button
                                    class="btn-warning"
                                    onclick="editJob('${job.id}')"
                                >
                                    Edit
                                </button>

                                ${
                                    currentProfile &&
                                    String(
                                        currentProfile.role
                                    ).toUpperCase() ===
                                    "OWNER"
                                    ?
                                    `
                                    <button
                                        class="btn-danger"
                                        onclick="deleteJob('${job.id}')"
                                    >
                                        Hapus
                                    </button>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}



/* =========================================
   STATS
========================================= */

function updateStats(){

    document
        .getElementById("totalJobs")
        .textContent =
            jobs.length;


    const today =
        new Date();


    const todayString =
        today.toISOString()
            .split("T")[0];


    const todayCount =
        jobs.filter(
            job =>
                job.scheduled_at &&
                new Date(
                    job.scheduled_at
                )
                .toISOString()
                .split("T")[0]
                ===
                todayString
        )
        .length;


    document
        .getElementById("todayJobs")
        .textContent =
            todayCount;


    const pending =
        jobs.filter(
            job =>
                job.status !==
                "COMPLETED" &&
                job.status !==
                "CANCELLED"
        )
        .length;


    document
        .getElementById("pendingJobs")
        .textContent =
            pending;

}

function closeModal(){

/* =========================================
   DEFAULT DATE
========================================= */

function setDefaultDate(){

    const input =
        document
        .getElementById("jobDate");


    if(
        !input.value
    ){

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth()+1
            )
            .padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            )
            .padStart(
                2,
                "0"
            );


        input.value =
            `${year}-${month}-${day}`;

    }

}



/* =========================================
   SAVE JOB
========================================= */

document
    .getElementById("jobForm")
    .addEventListener(
        "submit",
        saveJob
    );


async function saveJob(e){

    e.preventDefault();


    clearMessage();


    const saveButton =
        document
        .getElementById("saveButton");


    saveButton.disabled =
        true;


    saveButton.textContent =
        "Menyimpan...";


    try{


        /* ===============================
           AMBIL DATA FORM
        ================================ */

        const technicianId =
            document
            .getElementById(
                "technicianId"
            )
            .value;


        const date =
            document
            .getElementById(
                "jobDate"
            )
            .value;


        const time =
            document
            .getElementById(
                "jobTime"
            )
            .value;


        const customerName =
            document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


        const customerPhone =
            document
            .getElementById(
                "customerPhone"
            )
            .value
            .trim();


        const customerAddress =
            document
            .getElementById(
                "customerAddress"
            )
            .value
            .trim();


        const title =
            document
            .getElementById(
                "jobTitle"
            )
            .value
            .trim();


        const description =
            document
            .getElementById(
                "jobDescription"
            )
            .value
            .trim();


        if(
            !technicianId ||
            !date ||
            !time ||
            !customerName ||
            !customerPhone ||
            !customerAddress ||
            !title ||
            !description
        ){

            throw new Error(
                "Mohon lengkapi semua data wajib."
            );

        }


        /*
           Gabungkan tanggal + jam
        */

        const scheduledAt =
            new Date(
                `${date}T${time}:00`
            )
            .toISOString();


        /* ===============================
           DATA JOB
        ================================ */

        const jobData = {

            /*
               PENTING:
               customer_id sengaja NULL.
               Tidak ada insert ke customers.
            */

            customer_id:null,

            technician_id:
                technicianId,

            assigned_to:
                technicianId,

            created_by:
                currentUser.id,

            title:
                title,

            description:
                description,

            scheduled_at:
                scheduledAt,

            status:
                document
                .getElementById(
                    "jobStatus"
                )
                .value,

            job_type:
                document
                .getElementById(
                    "jobType"
                )
                .value
                .trim() ||
                null,

            priority:
                document
                .getElementById(
                    "priority"
                )
                .value,

            estimated_cost:
                numberValue(
                    "estimatedCost"
                ),

            actual_cost:
                numberValue(
                    "actualCost"
                ),

            service_price:
                numberValue(
                    "servicePrice"
                ),

            customer_name:
                customerName,

            customer_phone:
                customerPhone,

            customer_address:
                customerAddress,

            work_description:
                description,

            technician_notes:
                document
                .getElementById(
                    "technicianNotes"
                )
                .value
                .trim() ||
                null

        };


        /* ===============================
           INSERT / UPDATE
        ================================ */

        let result;


        if(editingJobId){

            result =
                await supabaseClient
                    .from("jobs")
                    .update(
                        jobData
                    )
                    .eq(
                        "id",
                        editingJobId
                    );

        }
        else{

            result =
                await supabaseClient
                    .from("jobs")
                    .insert(
                        jobData
                    );

        }


        if(result.error){

            console.error(
                "SAVE JOB ERROR:",
                result.error
            );


            throw new Error(
                result.error.message
            );

        }


        showMessage(
            "Jadwal berhasil disimpan.",
            "success"
        );


        /*
           Tunggu sedikit supaya
           pesan sukses terlihat.
        */

        setTimeout(
            async function(){

                closeModal();

                await loadJobs();

            },
            500
        );


    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Gagal menyimpan jadwal.",
            "error"
        );

    }
    finally{

        saveButton.disabled =
            false;


        saveButton.textContent =
            "Simpan Jadwal";

    }

}

/* =========================================
   DETAIL
========================================= */

function viewJob(id){

    const job =
        jobs.find(
            item =>
                item.id === id
        );


    if(!job){

        return;

    }


    const technician =
        getTechnicianName(
            job.technician_id
        );


    const date =
        new Date(
            job.scheduled_at
        );


    alert(

        "DETAIL JADWAL\n\n" +

        "Job: " +
        (job.job_code || "-") +

        "\nCustomer: " +
        (job.customer_name || "-") +

        "\nWhatsApp: " +
        (job.customer_phone || "-") +

        "\nAlamat: " +
        (job.customer_address || "-") +

        "\nTeknisi: " +
        technician +

        "\nTanggal: " +
        date.toLocaleDateString(
            "id-ID"
        ) +

        "\nJam: " +
        date.toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ) +

        "\nPekerjaan: " +
        (job.title || "-") +

        "\nKeterangan: " +
        (job.description || "-") +

        "\nStatus: " +
        statusText(
            job.status
        )

    );

}



/* =========================================
   DELETE
========================================= */

async function deleteJob(id){

    if(
        !confirm(
            "Yakin ingin menghapus jadwal ini?"
        )
    ){

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("jobs")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Gagal menghapus: " +
            error.message
        );

        return;

    }


    await loadJobs();

}

    window.location.href =

/* =========================================
   TECHNICIAN NAME
========================================= */

function getTechnicianName(id){

    if(!id){

        return "-";

    }


    const technician =
        technicians.find(
            item =>
                item.id === id
        );


    return technician
        ?
        (
            technician.full_name ||
            technician.email ||
            "-"
        )
        :
        "-";

}



/* =========================================
   STATUS
========================================= */

function statusText(status){

    const map = {

        NEW:
            "Baru",

        ON_THE_WAY:
            "Menuju Lokasi",

        CHECKED_IN:
            "Check In",

        IN_PROGRESS:
            "Mulai Pekerjaan",

        COMPLETED:
            "Selesai",

        CANCELLED:
            "Dibatalkan"

    };


    return (
        map[status] ||
        status ||
        "-"
    );

}


function statusBadge(status){

    let className =
        "badge-new";


    if(
        status ===
        "COMPLETED"
    ){

        className =
            "badge-done";

    }
    else if(
        status ===
        "CANCELLED"
    ){

        className =
            "badge-cancel";

    }
    else if(
        status ===
        "IN_PROGRESS" ||
        status ===
        "CHECKED_IN" ||
        status ===
        "ON_THE_WAY"
    ){

        className =
            "badge-progress";

    }


    return `

        <span
            class="badge ${className}"
        >
            ${escapeHtml(
                statusText(status)
            )}
        </span>

    `;

}



/* =========================================
   HELPERS
========================================= */

function numberValue(id){

    const value =
        Number(
            document
            .getElementById(id)
            .value
        );


    return Number.isFinite(value)
        ?
        value
        :
        0;

}


function formatDateInput(date){

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth()+1
        )
        .padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        )
        .padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


function formatTimeInput(date){

    const hours =
        String(
            date.getHours()
        )
        .padStart(
            2,
            "0"
        );


    const minutes =
        String(
            date.getMinutes()
        )
        .padStart(
            2,
            "0"
        );


    return `${hours}:${minutes}`;

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function whatsappLink(phone){

    let number =
        String(phone)
        .replace(
            /\D/g,
            ""
        );


    if(
        number.startsWith("0")
    ){

        number =
            "62" +
            number.substring(1);

    }


    return (
        "https://wa.me/" +
        number
    );

}


function showMessage(
    text,
    type
){

    const message =
        document
        .getElementById(
            "formMessage"
        );


    message.textContent =
        text;


    message.className =
        "message show " +
        type;

}


function clearMessage(){

    const message =
        document
        .getElementById(
            "formMessage"
        );


    message.textContent =
        "";


    message.className =
        "message";

}


</script>
