<style>

<body>

<script>

const { createClient } = window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let jobs = [];
let technicians = [];
let customers = [];
let currentUser = null;


/* ================= UTIL ================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizePhone(phone){

  let p = String(phone || "")
    .replace(/\D/g,"");

  if(p.startsWith("0")){
    p = "62" + p.substring(1);
  }

  if(!p.startsWith("62")){
    p = "62" + p;
  }

  return p;

}


function waUrl(phone){

  return "https://wa.me/" + normalizePhone(phone);

}


function formatDate(date){

  if(!date) return "-";

  const d = new Date(date + "T00:00:00");

  return d.toLocaleDateString(
    "id-ID",
    {
      weekday:"long",
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function formatTime(time){

  if(!time) return "-";

  return String(time).substring(0,5);

}


function statusText(status){

  const map = {

    NEW:"Baru",
    ASSIGNED:"Assigned",
    ON_THE_WAY:"OTW",
    CHECKED_IN:"Check In",
    IN_PROGRESS:"Proses",
    COMPLETED:"Selesai",
    CANCELLED:"Dibatalkan"

  };

  return map[status] || status || "-";

}


function statusClass(status){

  const map = {

    NEW:"s-new",
    ASSIGNED:"s-assigned",
    ON_THE_WAY:"s-way",
    CHECKED_IN:"s-checkin",
    IN_PROGRESS:"s-progress",
    COMPLETED:"s-completed",
    CANCELLED:"s-cancelled"

  };

  return map[status] || "s-new";

}


/* ================= LOGIN ================= */

async function checkOwner(){

  const {
    data:{user}
  } = await supabaseClient.auth.getUser();

  if(!user){

    location.href = "login.html";

    return false;

  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("id,full_name,email,role,status")
      .eq("id",user.id)
      .single();

  if(
    error ||
    !data ||
    data.status !== "ACTIVE"
  ){

    await supabaseClient.auth.signOut();

    location.href = "login.html";

    return false;

  }

  currentUser = data;

  return true;

}


async function logout(){

  await supabaseClient.auth.signOut();

  location.href = "login.html";

}


/* ================= LOAD MASTER ================= */

async function loadTechnicians(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,full_name,email")
    .eq("role","TEKNISI")
    .eq("status","ACTIVE")
    .order("full_name");

  if(error){

    console.error(error);

    document.getElementById("technicianId").innerHTML =
      '<option value="">Gagal memuat teknisi</option>';

    return;

  }

  technicians = data || [];

  const select =
    document.getElementById("technicianId");

  select.innerHTML =
    '<option value="">Pilih teknisi</option>';

  technicians.forEach(t=>{

    const option =
      document.createElement("option");

    option.value = t.id;

    option.textContent =
      t.full_name || t.email || "Teknisi";

    select.appendChild(option);

  });

}


/* ================= CUSTOMER ================= */

/*
  Customer tidak perlu dibuat manual.
  Saat jadwal disimpan:
  1. Cari customer berdasarkan nama + whatsapp.
  2. Kalau belum ada -> buat customer baru.
  3. customer_type otomatis RESIDENTIAL.
*/

async function findOrCreateCustomer(){

  const name =
    document.getElementById("customerName").value.trim();

  const whatsapp =
    document.getElementById("customerWhatsapp").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  if(!name || !whatsapp || !address){
    throw new Error(
      "Nama customer, WhatsApp dan alamat wajib diisi."
    );
  }

  const normalized = normalizePhone(whatsapp);

  /* Cari customer berdasarkan WhatsApp */
  const {
    data: existing,
    error: findError
  } = await supabaseClient
    .from("customers")
    .select("*")
    .eq("whatsapp", normalized)
    .limit(1);

  if(findError){
    throw findError;
  }

  /* Jika customer sudah ada */
  if(existing && existing.length){

    const customer = existing[0];

    const {
      data: updated,
      error: updateError
    } = await supabaseClient
      .from("customers")
      .update({
        name: name,
        whatsapp: normalized,
        phone: normalized,
        address: address
      })
      .eq("id", customer.id)
      .select()
      .single();

    if(updateError){
      throw updateError;
    }

    return updated;
  }

  /* Customer baru */
  const customerCode =
    "CUS-" + Date.now().toString().slice(-8);

  const customerPayload = {

    customer_code: customerCode,

    name: name,

    whatsapp: normalized,

    phone: normalized,

    email: null,

    address: address,

    city: null,

    customer_type: "RESIDENTIAL",

    status: "ACTIVE",

    created_by: currentUser
      ? currentUser.id
      : null

  };

  const {
    data: newCustomer,
    error: createError
  } = await supabaseClient
    .from("customers")
    .insert(customerPayload)
    .select()
    .single();

  if(createError){
    throw createError;
  }

  return newCustomer;
}

/* ================= LOAD JOBS ================= */

async function loadJobs(){

  const {
    data,
    error
  } = await supabaseClient
    .from("jobs")
    .select("*")
    .order("scheduled_at",{ascending:true});

  if(error){

    console.error(error);

    document.getElementById("jobTable").innerHTML =
      `<tr>
        <td colspan="6" class="empty">
          Gagal memuat jadwal.<br>
          ${esc(error.message)}
        </td>
      </tr>`;

    return;

  }

  jobs = data || [];

  renderSummary();

  renderJobs();

}


/* ================= NAMA TEKNISI ================= */

function technicianName(id){

  const t =
    technicians.find(
      x => x.id === id
    );

  return t
    ? (t.full_name || t.email)
    : "Belum ditugaskan";

}


/* ================= CUSTOMER DATA ================= */

function customerData(id){

  return customers.find(
    x => x.id === id
  ) || null;

}


/* ================= LOAD CUSTOMERS ================= */

async function loadCustomers(){

  const {
    data,
    error
  } = await supabaseClient
    .from("customers")
    .select(
      "id,customer_code,name,whatsapp,phone,address,city"
    );

  if(error){

    console.error(error);

    customers = [];

    return;

  }

  customers = data || [];

}


/* ================= SUMMARY ================= */

function renderSummary(){

  const total =
    jobs.length;

  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const todayCount =
    jobs.filter(j=>{

      if(!j.scheduled_at)
        return false;

      return String(j.scheduled_at)
        .slice(0,10) === today;

    }).length;


  const pending =
    jobs.filter(j =>
      ![
        "COMPLETED",
        "CANCELLED"
      ].includes(j.status)
    ).length;


  document.getElementById("totalJob")
    .textContent = total;

  document.getElementById("todayJob")
    .textContent = todayCount;

  document.getElementById("pendingJob")
    .textContent = pending;

}


/* ================= RENDER ================= */

function renderJobs(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const status =
    document
      .getElementById("statusFilter")
      .value;


  let rows =
    jobs.filter(j=>{

      const customer =
        customerData(j.customer_id);

      const customerName =
        customer?.name || "";

      const customerAddress =
        customer?.address || "";

      const customerPhone =
        customer?.whatsapp ||
        customer?.phone ||
        "";


      const technician =
        technicianName(
          j.assigned_to ||
          j.technician_id
        );


      const text = [

        customerName,
        customerAddress,
        customerPhone,
        technician,
        j.description,
        j.title,
        j.job_code

      ].join(" ").toLowerCase();


      const matchSearch =
        !search ||
        text.includes(search);


      const matchStatus =
        !status ||
        j.status === status;


      return matchSearch && matchStatus;

    });


  const table =
    document.getElementById("jobTable");


  if(!rows.length){

    table.innerHTML =
      `<tr>
        <td colspan="6" class="empty">
          Belum ada jadwal.
        </td>
      </tr>`;

    return;

  }


  table.innerHTML =
    rows.map(j=>{

      const customer =
        customerData(j.customer_id);


      const name =
        customer?.name ||
        "Customer";


      const phone =
        customer?.whatsapp ||
        customer?.phone ||
        "";


      const address =
        customer?.address ||
        "-";


      const technician =
        technicianName(
          j.assigned_to ||
          j.technician_id
        );


      const scheduled =
        j.scheduled_at
          ? new Date(j.scheduled_at)
          : null;


      let date = "-";
      let time = "-";


      if(scheduled){

        date =
          scheduled.toLocaleDateString(
            "id-ID",
            {
              weekday:"long",
              day:"2-digit",
              month:"short",
              year:"numeric"
            }
          );

        time =
          scheduled.toLocaleTimeString(
            "id-ID",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          );

      }


      const wa =
        phone
          ? `<a
              class="wa-link"
              href="${waUrl(phone)}"
              target="_blank"
              rel="noopener"
            >
              WhatsApp
            </a>`
          : "";


      return `
        <tr>

          <td>
            <div class="job-date">
              ${esc(date)}
            </div>

            <div class="job-time">
              ${esc(time)}
            </div>
          </td>


          <td>

            <div class="customer-name">
              ${esc(name)}
            </div>

            <div class="customer-address">
              ${esc(address)}
            </div>

            ${wa}

          </td>


          <td>
            <div class="tech">
              ${esc(technician)}
            </div>
          </td>


          <td>

            <div class="job-title">
              ${esc(
                j.description ||
                j.title ||
                "-"
              )}
            </div>

          </td>


          <td>

            <span class="badge ${statusClass(j.status)}">
              ${esc(statusText(j.status))}
            </span>

          </td>


          <td>

            <button
              class="action-btn view-btn"
              onclick="showDetail('${j.id}')"
            >
              Detail
            </button>


            <button
              class="action-btn edit-btn"
              onclick="editJob('${j.id}')"
            >
              Edit
            </button>


            <button
              class="action-btn delete-btn"
              onclick="deleteJob('${j.id}')"
            >
              Hapus
            </button>

          </td>

        </tr>
      `;

    }).join("");

}


/* ================= OPEN ADD ================= */

function openAddModal(){

  document.getElementById("modalTitle")
    .textContent = "Tambah Jadwal";


  document.getElementById("jobId")
    .value = "";


  document.getElementById("jobForm")
    .reset();


  document.getElementById("status")
    .value = "NEW";


  document.getElementById("formMessage")
    .textContent = "";


  /*
    Default tanggal hari ini.
  */

  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  document.getElementById("scheduledDate")
    .value = today;


  document.getElementById("jobModal")
    .classList.add("show");

}


/* ================= CLOSE ================= */

function closeModal(){

  document
    .getElementById("jobModal")
    .classList.remove("show");

}


function closeDetail(){

  document
    .getElementById("detailModal")
    .classList.remove("show");

}


/* ================= EDIT ================= */

function editJob(id){

  const job =
    jobs.find(
      j => j.id === id
    );


  if(!job) return;


  const customer =
    customerData(
      job.customer_id
    );


  document.getElementById("modalTitle")
    .textContent = "Edit Jadwal";


  document.getElementById("jobId")
    .value = job.id;


  document.getElementById("technicianId")
    .value =
      job.assigned_to ||
      job.technician_id ||
      "";


  if(job.scheduled_at){

    const d =
      new Date(job.scheduled_at);


    document.getElementById("scheduledDate")
      .value =
        d.toISOString()
          .slice(0,10);


    document.getElementById("scheduledTime")
      .value =
        d.toTimeString()
          .slice(0,5);

  }


  document.getElementById("customerName")
    .value =
      customer?.name || "";


  document.getElementById("customerWhatsapp")
    .value =
      customer?.whatsapp ||
      customer?.phone ||
      "";


  document.getElementById("customerAddress")
    .value =
      customer?.address || "";


  document.getElementById("description")
    .value =
      job.description ||
      job.title ||
      "";


  document.getElementById("status")
    .value =
      job.status || "NEW";


  document.getElementById("formMessage")
    .textContent = "";


  document.getElementById("jobModal")
    .classList.add("show");

}


/* ================= SAVE ================= */

async function saveJob(){

  const message =
    document.getElementById("formMessage");


  message.className = "error";
  message.textContent = "";


  try{

    const technicianId =
      document.getElementById("technicianId")
        .value;


    const date =
      document.getElementById("scheduledDate")
        .value;


    const time =
      document.getElementById("scheduledTime")
        .value;


    const name =
      document.getElementById("customerName")
        .value
        .trim();


    const whatsapp =
      document.getElementById("customerWhatsapp")
        .value
        .trim();


    const address =
      document.getElementById("customerAddress")
        .value
        .trim();


    const description =
      document.getElementById("description")
        .value
        .trim();


    const status =
      document.getElementById("status")
        .value;


    const jobId =
      document.getElementById("jobId")
        .value;


    if(
      !technicianId ||
      !date ||
      !time ||
      !name ||
      !whatsapp ||
      !address ||
      !description
    ){

      throw new Error(
        "Semua kolom bertanda * wajib diisi."
      );

    }


    /*
      Buat / cari customer otomatis.
      Tidak perlu customer code.
      Tidak perlu customer type.
    */

    const customer =
      await findOrCreateCustomer();


    if(!customer?.id){

      throw new Error(
        "Customer gagal dibuat."
      );

    }


    const scheduledAt =
      `${date}T${time}:00`;


    if(jobId){

      /*
        UPDATE JOB
      */

      const {
        error
      } = await supabaseClient
        .from("jobs")
        .update({

          customer_id:
            customer.id,

          assigned_to:
            technicianId,

          scheduled_at:
            scheduledAt,

          title:
            description,

          description:
            description,

          status:
            status,

          updated_at:
            new Date().toISOString()

        })
        .eq("id",jobId);


      if(error){

        throw error;

      }


    }else{

      /*
        CREATE JOB
      */

      const jobCode =
        "JOB-" +
        Date.now()
          .toString()
          .slice(-8);


      const {
        error
      } = await supabaseClient
        .from("jobs")
        .insert({

          job_code:
            jobCode,

          customer_id:
            customer.id,

          title:
            description,

          description:
            description,

          assigned_to:
            technicianId,

          scheduled_at:
            scheduledAt,

          status:
            status,

          job_type:
            "SERVICE",

          priority:
            "NORMAL",

          estimated_cost:
            0,

          service_price:
            0,

          actual_cost:
            0,

          technician_notes:
            null,

          created_by:
            currentUser
              ? currentUser.id
              : null

        });


      if(error){

        throw error;

      }

    }


    message.className = "success";

    message.textContent =
      "Jadwal berhasil disimpan.";


    await loadCustomers();

    await loadJobs();


    setTimeout(()=>{

      closeModal();

    },500);


  }catch(error){

    console.error(error);

    message.className = "error";

    message.textContent =
      "Gagal menyimpan: " +
      (
        error?.message ||
        "Terjadi kesalahan."
      );

  }

}

/* ================= DELETE ================= */

async function deleteJob(id){

  const job =
    jobs.find(
      j => j.id === id
    );


  if(!job) return;


  const yes =
    confirm(
      "Yakin ingin menghapus jadwal ini?"
    );


  if(!yes) return;


  const {
    error
  } = await supabaseClient
    .from("jobs")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Gagal menghapus: " +
      error.message
    );

    return;

  }


  await loadJobs();

}


/* ================= INIT ================= */

async function init(){

  const ok =
    await checkOwner();


  if(!ok) return;


  try{

    await loadTechnicians();

    await loadCustomers();

    await loadJobs();

  }catch(error){

    console.error(error);

  }

}


init();

document
