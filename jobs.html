<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Teknisi - WAT ERP</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            height: 64px;
            background: #0d47a1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .brand small {
            display: block;
            font-size: 11px;
            opacity: .75;
            margin-top: 3px;
            font-weight: 400;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-badge {
            background: rgba(255,255,255,.15);
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .logout-btn {
            border: 0;
            background: white;
            color: #0d47a1;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 18px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #70809a;
            font-size: 14px;
        }

        .primary-btn {
            background: #1264e8;
            color: white;
            border: 0;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .primary-btn:hover {
            background: #0954ca;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #1264e8;
            box-shadow: 0 4px 14px rgba(24,44,78,.06);
        }

        .stat-card span {
            display: block;
            color: #73809a;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 25px;
        }

        /* =========================
           FILTER
        ========================= */

        .filter-box {
            background: white;
            border-radius: 12px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 10px;
            margin-bottom: 18px;
            box-shadow: 0 4px 14px rgba(24,44,78,.06);
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d7dfeb;
            border-radius: 7px;
            padding: 11px 12px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1264e8;
            box-shadow: 0 0 0 2px rgba(18,100,232,.08);
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        /* =========================
           TABLE
        ========================= */

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 14px rgba(24,44,78,.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            padding: 14px 13px;
            font-size: 12px;
            color: #52617a;
            background: #f8fafc;
            border-bottom: 1px solid #e5eaf1;
        }

        td {
            padding: 15px 13px;
            border-bottom: 1px solid #edf0f5;
            font-size: 13px;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .job-code {
            font-weight: 700;
            color: #1264e8;
            font-size: 12px;
        }

        .customer-name {
            font-weight: 700;
        }

        .customer-phone {
            color: #74819a;
            margin-top: 3px;
            font-size: 12px;
        }

        .wa-link {
            display: inline-block;
            color: #0aa65a;
            font-weight: 700;
            margin-top: 5px;
            text-decoration: none;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-baru {
            background: #e7f0ff;
            color: #1264e8;
        }

        .status-diterima {
            background: #fff3cd;
            color: #8b6800;
        }

        .status-proses {
            background: #e5f7ee;
            color: #078447;
        }

        .status-selesai {
            background: #dff6e8;
            color: #08763d;
        }

        .status-batal {
            background: #ffe4e4;
            color: #c62828;
        }

        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-small {
            border: 0;
            border-radius: 6px;
            padding: 7px 9px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-detail {
            background: #e8f0ff;
            color: #1264e8;
        }

        .btn-edit {
            background: #fff4d6;
            color: #9a6b00;
        }

        .btn-delete {
            background: #ffe5e5;
            color: #c62828;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13, 24, 42, .62);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(760px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e7ebf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .close-btn {
            border: 0;
            background: transparent;
            font-size: 24px;
            color: #74819a;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 2px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #44516a;
            margin-bottom: 7px;
        }

        .modal-footer {
            border-top: 1px solid #e7ebf2;
            padding: 14px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .secondary-btn {
            border: 0;
            background: #edf1f6;
            color: #40506b;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        /* =========================
           DETAIL
        ========================= */

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-card {
            background: #f7f9fc;
            border-radius: 9px;
            padding: 13px;
        }

        .detail-card.full {
            grid-column: 1 / -1;
        }

        .detail-card span {
            display: block;
            color: #73809a;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .detail-card strong {
            font-size: 14px;
            white-space: pre-wrap;
        }

        .empty {
            text-align: center;
            padding: 45px 20px;
            color: #7b879b;
        }

        .loading {
            text-align: center;
            padding: 35px;
            color: #68758c;
        }

        .error-message {
            background: #ffe8e8;
            color: #bd2222;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }

        .success-message {
            background: #e4f8ec;
            color: #08763d;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }

        .customer-info {
            background: #f1f6ff;
            border: 1px solid #d9e6ff;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 7px;
            display: none;
        }

        .customer-info strong {
            display: block;
            font-size: 13px;
        }

        .customer-info small {
            color: #63718a;
        }

        @media(max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .filter-box {
                grid-template-columns: 1fr;
            }

            .form-grid,
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full,
            .detail-card.full {
                grid-column: auto;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .topbar {
                padding: 0 14px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        WAT ERP
        <small>Technician Control System</small>
    </div>

    <div class="top-actions">
        <div class="role-badge" id="userRole">USER</div>
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
    </div>
</header>

<main class="container">

    <div class="page-header">
        <div class="page-title">
            <h1>Jadwal Teknisi</h1>
            <p>Kelola jadwal pekerjaan teknisi dan customer</p>
        </div>

        <button class="primary-btn" id="addJobBtn">
            + Tambah Jadwal
        </button>
    </div>

    <section class="stats">

        <div class="stat-card">
            <span>Total Jadwal</span>
            <strong id="totalJobs">0</strong>
        </div>

        <div class="stat-card">
            <span>Jadwal Hari Ini</span>
            <strong id="todayJobs">0</strong>
        </div>

        <div class="stat-card">
            <span>Belum Selesai</span>
            <strong id="unfinishedJobs">0</strong>
        </div>

    </section>

    <section class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari customer, teknisi, alamat, pekerjaan..."
        >

        <select id="statusFilter">
            <option value="">Semua Status</option>
            <option value="NEW">Baru</option>
            <option value="ACCEPTED">Diterima</option>
            <option value="IN_PROGRESS">Proses</option>
            <option value="COMPLETED">Selesai</option>
            <option value="CANCELLED">Batal</option>
        </select>

    </section>

    <section class="table-box">

        <table>

            <thead>
                <tr>
                    <th>JADWAL</th>
                    <th>CUSTOMER</th>
                    <th>TEKNISI</th>
                    <th>PEKERJAAN</th>
                    <th>STATUS</th>
                    <th>AKSI</th>
                </tr>
            </thead>

            <tbody id="jobsTableBody">
                <tr>
                    <td colspan="6" class="loading">
                        Memuat jadwal...
                    </td>
                </tr>
            </tbody>

        </table>

    </section>

</main>


<!-- =========================
     MODAL TAMBAH / EDIT
========================= -->

<div class="modal-overlay" id="jobModal">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Tambah Jadwal
            </h2>

            <button class="close-btn" id="closeModal">
                ×
            </button>

        </div>

        <div class="modal-body">

            <form id="jobForm">

                <input type="hidden" id="editJobId">

                <div class="form-grid">

                    <!-- TEKNISI -->

                    <div class="form-group">
                        <label>Teknisi *</label>

                        <select id="technicianId" required>
                            <option value="">
                                Memuat teknisi...
                            </option>
                        </select>
                    </div>


                    <!-- TANGGAL -->

                    <div class="form-group">
                        <label>Tanggal *</label>

                        <input
                            type="date"
                            id="jobDate"
                            required
                        >
                    </div>


                    <!-- JAM -->

                    <div class="form-group">
                        <label>Jam *</label>

                        <input
                            type="time"
                            id="jobTime"
                            required
                        >
                    </div>


                    <!-- CUSTOMER PHONE -->

                    <div class="form-group">
                        <label>No. WhatsApp Customer *</label>

                        <input
                            type="text"
                            id="customerPhone"
                            placeholder="08xxxxxxxxxx"
                            required
                        >

                        <div
                            class="customer-info"
                            id="customerInfo"
                        ></div>
                    </div>


                    <!-- CUSTOMER NAME -->

                    <div class="form-group">
                        <label>Nama Customer *</label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Nama customer"
                            required
                        >
                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full">

                        <label>Alamat Customer *</label>

                        <textarea
                            id="customerAddress"
                            placeholder="Alamat lengkap customer"
                            required
                        ></textarea>

                    </div>


                    <!-- TITLE -->

                    <div class="form-group">

                        <label>Judul Pekerjaan *</label>

                        <input
                            type="text"
                            id="jobTitle"
                            placeholder="Contoh: Cuci AC"
                            required
                        >

                    </div>


                    <!-- JOB TYPE -->

                    <div class="form-group">

                        <label>Jenis Pekerjaan</label>

                        <input
                            type="text"
                            id="jobType"
                            placeholder="Contoh: Cuci AC"
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label>
                            Keterangan / Pekerjaan *
                        </label>

                        <textarea
                            id="jobDescription"
                            placeholder="Contoh: Cuci AC 2 unit"
                            required
                        ></textarea>

                    </div>


                    <!-- PRIORITY -->

                    <div class="form-group">

                        <label>Prioritas</label>

                        <select id="priority">

                            <option value="NORMAL">
                                Normal
                            </option>

                            <option value="LOW">
                                Rendah
                            </option>

                            <option value="HIGH">
                                Tinggi
                            </option>

                            <option value="URGENT">
                                Urgent
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label>Status</label>

                        <select id="jobStatus">

                            <option value="NEW">
                                Baru
                            </option>

                            <option value="ACCEPTED">
                                Diterima
                            </option>

                            <option value="IN_PROGRESS">
                                Proses
                            </option>

                            <option value="COMPLETED">
                                Selesai
                            </option>

                            <option value="CANCELLED">
                                Batal
                            </option>

                        </select>

                    </div>


                    <!-- ESTIMATED COST -->

                    <div class="form-group">

                        <label>Estimasi Biaya</label>

                        <input
                            type="number"
                            id="estimatedCost"
                            value="0"
                            min="0"
                        >

                    </div>


                    <!-- ACTUAL COST -->

                    <div class="form-group">

                        <label>Actual Cost</label>

                        <input
                            type="number"
                            id="actualCost"
                            value="0"
                            min="0"
                        >

                    </div>


                    <!-- SERVICE PRICE -->

                    <div class="form-group">

                        <label>Harga Service</label>

                        <input
                            type="number"
                            id="servicePrice"
                            value="0"
                            min="0"
                        >

                    </div>


                    <!-- TECHNICIAN NOTES -->

                    <div class="form-group full">

                        <label>Catatan Teknisi</label>

                        <textarea
                            id="technicianNotes"
                            placeholder="Catatan teknisi..."
                        ></textarea>

                    </div>

                </div>

                <div
                    class="error-message"
                    id="formError"
                ></div>

                <div
                    class="success-message"
                    id="formSuccess"
                ></div>

            </form>

        </div>

        <div class="modal-footer">

            <button
                class="secondary-btn"
                id="cancelBtn"
                type="button"
            >
                Batal
            </button>

            <button
                class="primary-btn"
                id="saveJobBtn"
                type="button"
            >
                Simpan Jadwal
            </button>

        </div>

    </div>

</div>


<!-- =========================
     MODAL DETAIL
========================= -->

<div class="modal-overlay" id="detailModal">

    <div class="modal">

        <div class="modal-header">

            <h2>Detail Pekerjaan</h2>

            <button
                class="close-btn"
                id="closeDetailModal"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <div
                class="detail-grid"
                id="detailContent"
            ></div>

        </div>

        <div class="modal-footer">

            <button
                class="secondary-btn"
                id="closeDetailBtn"
            >
                Tutup
            </button>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CONFIG -->

<script src="assets/js/config.js"></script>

<script>

(function () {

    "use strict";


    /* =====================================================
       SUPABASE CLIENT
    ===================================================== */

    let db = null;

    function getSupabaseClient() {

        if (window.supabaseClient) {
            return window.supabaseClient;
        }

        if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {

            window.supabaseClient =
                window.supabase.createClient(
                    window.SUPABASE_URL,
                    window.SUPABASE_ANON_KEY
                );

            return window.supabaseClient;
        }

        if (window.supabase && window.supabaseUrl && window.supabaseAnonKey) {

            window.supabaseClient =
                window.supabase.createClient(
                    window.supabaseUrl,
                    window.supabaseAnonKey
                );

            return window.supabaseClient;
        }

        console.error(
            "Supabase client tidak ditemukan. Cek config.js"
        );

        return null;
    }


    db = getSupabaseClient();


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let currentProfile = null;

    let allJobs = [];
    let technicians = [];

    let customerCache = {};


    /* =====================================================
       ELEMENT
    ===================================================== */

    const tableBody =
        document.getElementById("jobsTableBody");

    const totalJobs =
        document.getElementById("totalJobs");

    const todayJobs =
        document.getElementById("todayJobs");

    const unfinishedJobs =
        document.getElementById("unfinishedJobs");

    const searchInput =
        document.getElementById("searchInput");

    const statusFilter =
        document.getElementById("statusFilter");

    const jobModal =
        document.getElementById("jobModal");

    const detailModal =
        document.getElementById("detailModal");

    const jobForm =
        document.getElementById("jobForm");

    const formError =
        document.getElementById("formError");

    const formSuccess =
        document.getElementById("formSuccess");

    const saveJobBtn =
        document.getElementById("saveJobBtn");


    /* =====================================================
       UTILITY
    ===================================================== */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function normalizePhone(phone) {

        if (!phone) {
            return "";
        }

        let value =
            String(phone)
                .replace(/\D/g, "");

        if (value.startsWith("62")) {
            return value;
        }

        if (value.startsWith("0")) {
            return "62" + value.substring(1);
        }

        return value;
    }


    function whatsappLink(phone) {

        const number =
            normalizePhone(phone);

        if (!number) {
            return "#";
        }

        return "https://wa.me/" + number;
    }


    function formatDate(value) {

        if (!value) {
            return "-";
        }

        const date =
            new Date(value);

        return date.toLocaleDateString(
            "id-ID",
            {
                weekday: "long",
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    function formatTime(value) {

        if (!value) {
            return "-";
        }

        const date =
            new Date(value);

        return date.toLocaleTimeString(
            "id-ID",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    function formatRupiah(value) {

        const number =
            Number(value || 0);

        return new Intl.NumberFormat(
            "id-ID",
            {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }
        ).format(number);
    }


    function statusText(status) {

        const map = {

            NEW: "Baru",
            ACCEPTED: "Diterima",
            IN_PROGRESS: "Proses",
            COMPLETED: "Selesai",
            CANCELLED: "Batal"

        };

        return map[status] || status || "-";
    }


    function statusClass(status) {

        const map = {

            NEW: "status-baru",
            ACCEPTED: "status-diterima",
            IN_PROGRESS: "status-proses",
            COMPLETED: "status-selesai",
            CANCELLED: "status-batal"

        };

        return map[status] || "status-baru";
    }


    function showFormError(message) {

        formError.textContent =
            message;

        formError.style.display =
            "block";

        formSuccess.style.display =
            "none";
    }


    function showFormSuccess(message) {

        formSuccess.textContent =
            message;

        formSuccess.style.display =
            "block";

        formError.style.display =
            "none";
    }


    function clearMessages() {

        formError.style.display =
            "none";

        formSuccess.style.display =
            "none";

        formError.textContent =
            "";

        formSuccess.textContent =
            "";
    }


    /* =====================================================
       AUTH
    ===================================================== */

    async function checkAuth() {

        if (!db) {

            alert(
                "Supabase belum terhubung. Cek config.js."
            );

            return false;
        }

        const {
            data,
            error
        } =
            await db.auth.getUser();

        if (error || !data.user) {

            window.location.href =
                "login.html";

            return false;
        }

    ===================================================== */

    async function findCustomerByPhone(phone) {

        const normalized =
            normalizePhone(phone);

        if (!normalized) {
            return null;
        }

        if (customerCache[normalized]) {
            return customerCache[normalized];
        }


        /*
         * Coba cari dengan nomor asli
         */

        let result =
            await db
                .from("customers")
                .select("*")
                .or(
                    `phone.eq.${phone},phone.eq.${normalized},phone.eq.0${normalized.substring(2)}`
                )
                .limit(1)
                .maybeSingle();


        /*
         * Kalau gagal query karena format nomor,
         * coba pencarian sederhana.
         */

        if (!result.data && !result.error) {

            result =
                await db
                    .from("customers")
                    .select("*")
                    .eq("phone", phone)
                    .maybeSingle();
        }


        if (result.error) {

            console.warn(
                "Customer lookup:",
                result.error
            );

            return null;
        }


        if (result.data) {

            customerCache[normalized] =
                result.data;

            return result.data;
        }

        return null;
    }

    async function loadJobs() {

            `<tr>

            </tr>`;


        const {
            data,
            error
        } =

                    }
                );


        if (error) {

                "Jobs error:",

            );

                    <td colspan="6" class="empty">

                        ${escapeHtml(error.message)}
                    </td>
                </tr>`;

            return;
        }


        allJobs =
            data || [];


        /*
         * Ambil nama teknisi
         */

        const technicianIds =
            [
                ...new Set(
                    allJobs
                        .map(
                            j =>
                                j.technician_id ||
                                j.assigned_to
                        )
                        .filter(Boolean)
                )
            ];


        let techMap = {};


        if (technicianIds.length) {

            const {
                data: techData
            } =
                await db
                    .from("profiles")
                    .select(
                        "id, full_name, email"
                    )
                    .in(
                        "id",
                        technicianIds
                    );

            (techData || [])
                .forEach(
                    tech => {

                        techMap[tech.id] =
                            tech.full_name ||
                            tech.email;
                    }
                );
        }


        allJobs =
            allJobs.map(
                job => ({

                    ...job,

                    technician_name:
                        techMap[
                            job.technician_id ||
                            job.assigned_to
                        ] ||
                        "-"

                })
            );


        renderJobs();
        updateStats();
    }


    /* =====================================================

    function renderJobs() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();

        const selectedStatus =
            statusFilter.value;


        const filtered =
            allJobs.filter(
                job => {

                    const searchable = [

                        job.job_code,
                        job.customer_name,
                        job.customer_phone,
                        job.customer_address,
                        job.title,
                        job.description,
                        job.work_description,
                        job.technician_name

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    const matchSearch =
                        !keyword ||
                        searchable.includes(
                            keyword
                        );


                    const matchStatus =
                        !selectedStatus ||
                        job.status ===
                        selectedStatus;


                    return (
                        matchSearch &&
                        matchStatus
                    );
                }
            );


        if (!filtered.length) {

            tableBody.innerHTML =
                `<tr>
                    <td colspan="6" class="empty">
                        Belum ada jadwal.

                </tr>`;

            return;
        }


        tableBody.innerHTML =
            filtered
                .map(
                    job =>
                        renderJobRow(job)
                )
                .join("");
    }

    function updateStats() {

        totalJobs.textContent =
            allJobs.length;


        const now =
            new Date();


        const today =
            now.toISOString()
                .slice(0, 10);


        const todayCount =
            allJobs.filter(
                job => {

                    if (!job.scheduled_at) {
                        return false;
                    }

                    return (
                        new Date(
                            job.scheduled_at
                        )
                        .toISOString()
                        .slice(0, 10)
                        === today
                    );
                }
            )
            .length;


        todayJobs.textContent =
            todayCount;


        const unfinished =
            allJobs.filter(
                job =>
                    job.status !==
                        "COMPLETED" &&
                    job.status !==
                        "CANCELLED"
            )
            .length;


        unfinishedJobs.textContent =
            unfinished;
    }


    /* =====================================================
       GENERATE JOB CODE
    ===================================================== */

    function generateJobCode() {

        const date =
            new Date();

        const yy =
            String(
                date.getFullYear()
            ).slice(-2);

        const mm =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const dd =
            String(
                date.getDate()
            ).padStart(2, "0");


        const random =
            Math.floor(
                1000 +
                Math.random() *
                9000
            );


        return `JOB-${yy}${mm}${dd}-${random}`;
    }

    async function saveJob() {

        clearMessages();


        if (!currentUser) {

            showFormError(
                "Session login tidak ditemukan."
            );

            return;
        }


        const technicianId =
            document
                .getElementById(
                    "technicianId"

                .value;


        const date =
            document
                .getElementById(
                    "jobDate"
                )
                .value;


        const time =
            document
                .getElementById(
                    "jobTime"
                )
                .value;


        const phone =
            document
                .getElementById(
                    "customerPhone"
                )
                .value
                .trim();


        const customerName =
            document
                .getElementById(
                    "customerName"
                )
                .value
                .trim();


        const customerAddress =
            document
                .getElementById(
                    "customerAddress"
                )
                .value
                .trim();


        const title =
            document
                .getElementById(
                    "jobTitle"
                )
                .value
                .trim();


        const description =
            document
                .getElementById(
                    "jobDescription"
                )
                .value
                .trim();


        if (
            !technicianId ||
            !date ||
            !time ||
            !phone ||
            !customerName ||
            !customerAddress ||
            !title ||
            !description
        ) {

            showFormError(
                "Mohon lengkapi semua field wajib."
            );

            return;
        }


        /*
         * CUSTOMER HARUS SUDAH ADA
         */

        const customer =
            await findCustomerByPhone(
                phone
            );


        if (!customer) {

            showFormError(
                "Customer belum terdaftar. Buat customer terlebih dahulu di menu Customer, lalu kembali ke sini."
            );

            return;
        }


        const customerId =
            customer.id;


        if (!customerId) {

            showFormError(
                "ID customer tidak ditemukan."
            );

            return;
        }


        /*
         * SCHEDULED AT
         */

        const scheduledAt =
            `${date}T${time}:00`;


        /*
         * JOB CODE OTOMATIS
         */

        const jobCode =
            generateJobCode();


        /*
         * DATA JOB
         */

        const jobData = {

            job_code:
                jobCode,

            customer_id:
                customerId,

            technician_id:
                technicianId,

            assigned_to:
                technicianId,

            created_by:
                currentUser.id,

            title:
                title,

            description:
                description,

            scheduled_at:
                scheduledAt,

            status:
                document
                    .getElementById(
                        "jobStatus"
                    )
                    .value,

            job_type:
                document
                    .getElementById(
                        "jobType"
                    )
                    .value
                    .trim() || null,

            priority:
                document
                    .getElementById(
                        "priority"
                    )
                    .value,

            estimated_cost:
                Number(
                    document
                        .getElementById(
                            "estimatedCost"
                        )
                        .value || 0
                ),

            actual_cost:
                Number(
                    document
                        .getElementById(
                            "actualCost"
                        )
                        .value || 0
                ),

            service_price:
                Number(
                    document
                        .getElementById(
                            "servicePrice"
                        )
                        .value || 0
                ),

            customer_name:
                customerName,

            customer_phone:
                phone,

            customer_address:
                customerAddress,

            work_description:
                description,

            technician_notes:
                document
                    .getElementById(
                        "technicianNotes"
                    )
                    .value
                    .trim() || null

        };


        const editId =
            document
                .getElementById(
                    "editJobId"
                )
                .value;


        saveJobBtn.disabled =
            true;

        saveJobBtn.textContent =
            "Menyimpan...";


        try {

            let result;


            if (editId) {

                /*
                 * EDIT
                 */

                result =
                    await db
                        .from("jobs")
                        .update(
                            jobData
                        )
                        .eq(
                            "id",
                            editId
                        )
                        .select()
                        .single();

            } else {

                /*
                 * INSERT BARU
                 */

                result =
                    await db
                        .from("jobs")
                        .insert(
                            jobData
                        )
                        .select()
                        .single();
            }


            if (result.error) {

                console.error(
                    result.error
                );

                throw result.error;
            }


            showFormSuccess(
                editId
                    ? "Jadwal berhasil diperbarui."
                    : `Jadwal berhasil dibuat. Kode: ${jobCode}`
            );


            await loadJobs();


            setTimeout(
                () => {

                    closeJobModal();

                },
                700
            );


        } catch (error) {

            console.error(
                "SAVE JOB ERROR:",
                error
            );


            showFormError(
                error.message ||
                "Gagal menyimpan jadwal."
            );

        } finally {

            saveJobBtn.disabled =
                false;

            saveJobBtn.textContent =
                "Simpan Jadwal";
        }
    }

                    <strong>
                        ${formatRupiah(
                            job.estimated_cost
                        )}
                    </strong>
                </div>


                <div class="detail-card">
                    <span>Harga Service</span>
                    <strong>
                        ${formatRupiah(
                            job.service_price
                        )}
                    </strong>
                </div>


                <div class="detail-card">
                    <span>Actual Cost</span>
                    <strong>
                        ${formatRupiah(
                            job.actual_cost
                        )}
                    </strong>
                </div>


                <div class="detail-card">
                    <span>Mulai</span>
                    <strong>
                        ${
                            job.started_at
                            ?
                            formatDate(
                                job.started_at
                            )
                            + " " +
                            formatTime(
                                job.started_at
                            )
                            :
                            "-"
                        }
                    </strong>
                </div>


                <div class="detail-card">
                    <span>Selesai</span>
                    <strong>
                        ${
                            job.completed_at
                            ?
                            formatDate(
                                job.completed_at
                            )
                            + " " +
                            formatTime(
                                job.completed_at
                            )
                            :
                            "-"
                        }
                    </strong>
                </div>


                <div class="detail-card full">
                    <span>Catatan Teknisi</span>
                    <strong>
                        ${escapeHtml(
                            job.technician_notes ||
                            "-"
                        )}
                    </strong>
                </div>

            `;


            detailModal.classList.add(
                "show"
            );
        };


    /* =====================================================
       DELETE
    ===================================================== */

    window.deleteJob =
        async function (id) {

            const job =
                allJobs.find(
                    item =>
                        item.id === id
                );


            if (!job) {
                return;
            }


            const confirmed =
                confirm(
                    `Hapus jadwal ${job.job_code || ""} untuk ${job.customer_name || "customer"}?`
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } =
                await db
                    .from("jobs")
                    .delete()
                    .eq(
                        "id",
                        id
                    );


            if (error) {

                alert(
                    "Gagal menghapus jadwal:\n" +
                    error.message
                );

                return;
            }


            await loadJobs();
        };


    /* =====================================================
       MODAL DETAIL CLOSE
    ===================================================== */

    document
        .getElementById(
            "closeDetailModal"
        )
        .addEventListener(
            "click",
            function () {

                detailModal.classList.remove(
                    "show"
                );

            }
        );


    document
        .getElementById(
            "closeDetailBtn"
        )
        .addEventListener(
            "click",
            function () {

                detailModal.classList.remove(
                    "show"
                );

            }
        );


    jobModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                jobModal
            ) {

                closeJobModal();

            }

        }
    );


    detailModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                detailModal
            ) {

                detailModal.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =====================================================
       FILTER
    ===================================================== */

    searchInput.addEventListener(
        "input",
        renderJobs
    );


    statusFilter.addEventListener(
        "change",
        renderJobs
    );


    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

        const authenticated =
            await checkAuth();


        if (!authenticated) {
            return;
        }


        await loadTechnicians();

        await loadJobs();
    }


    init();

})();

</script>

</body>
</html>
