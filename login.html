<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - WAT ERP</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #0866ff;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .reset-box {
            display: none;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #0866ff;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LOGIN -->
    <div class="login-box" id="loginBox">

        <h1>WAT ERP</h1>

        <p class="subtitle">
            Technician Control System
        </p>

        <form id="loginForm">

            <label for="username">
                Email
            </label>

            <input
                type="email"
                id="username"
                placeholder="Masukkan email"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                LOGIN
            </button>

        </form>

        <a class="forgot-password" onclick="showReset()">
            Lupa Password?
        </a>

        <p id="loginMessage"></p>

    </div>


    <!-- RESET REQUEST -->
    <div class="login-box reset-box" id="resetBox">

        <h1>WAT ERP</h1>

        <p class="subtitle">
            Reset Password
        </p>

        <p style="font-size:13px;color:#718096;margin-bottom:20px;">
            Masukkan email akun Anda. Link reset password akan dikirim ke email tersebut.
        </p>

        <form id="resetForm">

            <label for="resetEmail">
                Email
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Masukkan email"
                required
            >

            <button type="submit" id="resetButton">
                KIRIM LINK RESET
            </button>

        </form>

        <p id="resetMessage"></p>

        <span class="back-login" onclick="showLogin()">
            ← Kembali ke Login
        </span>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>


<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   LOGIN
========================= */

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("loginMessage");

    button.disabled = true;
    button.textContent = "LOGIN...";

    message.textContent = "";
    message.style.color = "red";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        message.textContent =
            "Login gagal: " + error.message;

        button.disabled = false;
        button.textContent = "LOGIN";

        return;
    }


    /*
       Ambil profile user
    */

    const user = data.user;

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("role,status")
            .eq("id", user.id)
            .single();


    if(profileError){

        message.textContent =
            "Login berhasil, tetapi profile tidak ditemukan.";

        button.disabled = false;
        button.textContent = "LOGIN";

        return;
    }


    if(profile.status !== "ACTIVE"){

        await supabaseClient.auth.signOut();

        message.textContent =
            "Akun tidak aktif.";

        button.disabled = false;
        button.textContent = "LOGIN";

        return;
    }


    /*
       REDIRECT BERDASARKAN ROLE
    */

    if(profile.role === "OWNER"){

        window.location.href =
            "dashboard-owner.html";

    }
    else if(profile.role === "TEKNISI"){

        window.location.href =
            "technician.html";

    }
    else{

        message.textContent =
            "Role akun tidak dikenali.";

        await supabaseClient.auth.signOut();

        button.disabled = false;
        button.textContent = "LOGIN";
    }

});


/* =========================
   RESET PASSWORD REQUEST
========================= */

document.getElementById("resetForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("resetEmail").value.trim();

    const button =
        document.getElementById("resetButton");

    const message =
        document.getElementById("resetMessage");

    button.disabled = true;
    button.textContent = "MENGIRIM...";

    message.textContent = "";
    message.style.color = "#333";


    const redirectUrl =
        window.location.origin +
        window.location.pathname.replace(
            "login.html",
            "reset-password.html"
        );


    const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: redirectUrl
            }
        );


    if(error){

        message.style.color = "red";

        message.textContent =
            "Gagal mengirim: " + error.message;

        button.disabled = false;
        button.textContent = "KIRIM LINK RESET";

        return;
    }


    message.style.color = "green";

    message.textContent =
        "Link reset password sudah dikirim. Silakan cek email Anda.";

    button.disabled = false;
    button.textContent = "KIRIM LINK RESET";

});


/* =========================
   UI
========================= */

function showReset(){

    document.getElementById("loginBox").style.display = "none";

    document.getElementById("resetBox").style.display = "block";

    document.getElementById("resetEmail").value =
        document.getElementById("username").value;
}


function showLogin(){

    document.getElementById("resetBox").style.display = "none";

    document.getElementById("loginBox").style.display = "block";
}

</script>

</body>
</html>
