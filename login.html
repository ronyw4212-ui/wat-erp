<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - WAT ERP</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
        }

        .login-container{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            background:#f4f7fb;
        }

        .login-box{
            width:100%;
            max-width:420px;
            background:#fff;
            padding:35px;
            border-radius:16px;
            box-shadow:0 10px 35px rgba(0,0,0,.10);
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            margin:0;
            color:#0866ff;
            font-size:32px;
            letter-spacing:.5px;
        }

        .logo p{
            margin:7px 0 0;
            color:#718096;
            font-size:13px;
        }

        .form-group{
            margin-bottom:16px;
        }

        label{
            display:block;
            margin-bottom:7px;
            font-size:13px;
            font-weight:600;
            color:#334155;
        }

        input{
            width:100%;
            padding:13px 14px;
            border:1px solid #d7deea;
            border-radius:8px;
            font-size:14px;
            outline:none;
            transition:.2s;
        }

        input:focus{
            border-color:#0866ff;
            box-shadow:0 0 0 3px rgba(8,102,255,.10);
        }

        .login-button{
            width:100%;
            padding:13px;
            margin-top:5px;
            border:0;
            border-radius:8px;
            background:#0866ff;
            color:white;
            font-size:14px;
            font-weight:bold;
            cursor:pointer;
            transition:.2s;
        }

        .login-button:hover{
            background:#0055dd;
        }

        .login-button:disabled{
            opacity:.65;
            cursor:not-allowed;
        }

        .forgot-password{
            display:block;
            text-align:center;
            margin-top:16px;
            color:#0866ff;
            font-size:13px;
            text-decoration:none;
            cursor:pointer;
        }

        .forgot-password:hover{
            text-decoration:underline;
        }

        .message{
            margin-top:15px;
            padding:11px 13px;
            border-radius:8px;
            font-size:13px;
            line-height:1.5;
            display:none;
        }

        .message.show{
            display:block;
        }

        .message.error{
            background:#fee2e2;
            color:#991b1b;
        }

        .message.success{
            background:#dcfce7;
            color:#166534;
        }

        .reset-box{
            display:none;
        }

        .reset-description{
            color:#718096;
            font-size:13px;
            line-height:1.5;
            margin-bottom:20px;
            text-align:center;
        }

        .back-login{
            display:block;
            text-align:center;
            margin-top:16px;
            color:#0866ff;
            font-size:13px;
            cursor:pointer;
        }

        .footer{
            text-align:center;
            margin-top:22px;
            font-size:11px;
            color:#94a3b8;
        }

        @media(max-width:480px){

            .login-box{
                padding:28px 22px;
            }

            .logo h1{
                font-size:28px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- =================================
         LOGIN BOX
    ================================== -->

    <div
        class="login-box"
        id="loginBox"
    >

        <div class="logo">

            <h1>
                WAT ERP
            </h1>

            <p>
                Technician Control System
            </p>

        </div>


        <form
            id="loginForm"
        >


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                LOGIN
            </button>


        </form>


        <a
            class="forgot-password"
            onclick="showReset()"
        >
            Lupa Password?
        </a>


        <div
            id="loginMessage"
            class="message"
        ></div>


        <div class="footer">
            WAT ERP © 2026
        </div>


    </div>



    <!-- =================================
         RESET PASSWORD REQUEST
    ================================== -->

    <div
        class="login-box reset-box"
        id="resetBox"
    >

        <div class="logo">

            <h1>
                WAT ERP
            </h1>

            <p>
                Reset Password
            </p>

        </div>


        <div class="reset-description">

            Masukkan email akun Anda.
            Kami akan mengirimkan link
            untuk membuat password baru.

        </div>


        <form
            id="resetForm"
        >


            <div class="form-group">

                <label for="resetEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Masukkan email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="resetButton"
            >
                KIRIM LINK RESET
            </button>


        </form>


        <div
            id="resetMessage"
            class="message"
        ></div>


        <span
            class="back-login"
            onclick="showLogin()"
        >
            ← Kembali ke Login
        </span>


        <div class="footer">
            WAT ERP © 2026
        </div>


    </div>


</div>



<!-- =================================
     SUPABASE
================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =================================
     WAT ERP CONFIG
================================== -->

<script src="assets/js/config.js"></script>


<script>


/* =================================
   SUPABASE CLIENT
================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =================================
   LOGIN
================================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const button =
            document
            .getElementById("loginButton");


        const message =
            document
            .getElementById("loginMessage");


        clearMessage(message);


        button.disabled = true;

        button.textContent =
            "LOGIN...";


        try{


            /* =========================
               SUPABASE LOGIN
            ========================= */

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                throw new Error(
                    translateLoginError(
                        error
                    )
                );

            }


            const user =
                data.user;


            if(!user){

                throw new Error(
                    "User tidak ditemukan."
                );

            }


            /* =========================
               AMBIL PROFILE
            ========================= */

            const {
                data:profile,
                error:profileError
            } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,full_name,email,role,status"
                )
                .eq(
                    "id",
                    user.id
                )
                .single();


            if(profileError){

                console.error(
                    "PROFILE ERROR:",
                    profileError
                );


                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Profile akun tidak ditemukan."
                );

            }


            /* =========================
               CEK STATUS
            ========================= */

            if(
                profile.status &&
                profile.status !== "ACTIVE"
            ){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Akun Anda tidak aktif. Hubungi Owner."
                );

            }


            /* =========================
               ROLE REDIRECT
            ========================= */

            const role =
                String(
                    profile.role || ""
                )
                .trim()
                .toUpperCase();


            console.log(
                "LOGIN BERHASIL",
                {
                    email:user.email,
                    role:role
                }
            );


            /*
               OWNER
            */

            if(role === "OWNER"){

                window.location.href =
                    "dashboard-owner.html";

                return;

            }


            /*
               CS
            */

            if(role === "CS"){

                window.location.href =
                    "jobs.html";

                return;

            }


            /*
               TEKNISI
            */

            if(
                role === "TEKNISI" ||
                role === "TECHNICIAN"
            ){

                window.location.href =
                    "technician.html";

                return;

            }


            /*
               ROLE TIDAK DIKENALI
            */

            await supabaseClient
                .auth
                .signOut();


            throw new Error(
                "Role akun tidak dikenali: " +
                role
            );


        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                message,
                error.message,
                "error"
            );


            button.disabled = false;

            button.textContent =
                "LOGIN";

        }

    }
);



/* =================================
   RESET PASSWORD
================================= */

document
.getElementById("resetForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("resetEmail")
            .value
            .trim();


        const button =
            document
            .getElementById("resetButton");


        const message =
            document
            .getElementById("resetMessage");


        clearMessage(message);


        button.disabled = true;

        button.textContent =
            "MENGIRIM...";


        try{


            /*
               URL HALAMAN RESET
            */

            const resetUrl =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "login.html",
                        "reset-password.html"
                    );


            console.log(
                "Reset URL:",
                resetUrl
            );


            const {
                error
            } =
            await supabaseClient
                .auth
                .resetPasswordForEmail(
                    email,
                    {

                        redirectTo:
                            resetUrl

                    }
                );


            if(error){

                throw new Error(
                    translateResetError(
                        error
                    )
                );

            }


            showMessage(
                message,
                "Link reset password sudah dikirim. Silakan cek email Anda.",
                "success"
            );


        }
        catch(error){

            console.error(
                "RESET ERROR:",
                error
            );


            showMessage(
                message,
                error.message,
                "error"
            );

        }


        button.disabled = false;

        button.textContent =
            "KIRIM LINK RESET";

    }
);



/* =================================
   SHOW RESET
================================= */

function showReset(){

    document
        .getElementById("loginBox")
        .style.display =
            "none";


    document
        .getElementById("resetBox")
        .style.display =
            "block";


    /*
       Kalau email login sudah diisi,
       otomatis masuk ke form reset.
    */

    const loginEmail =
        document
        .getElementById("email")
        .value
        .trim();


    if(loginEmail){

        document
        .getElementById("resetEmail")
        .value =
            loginEmail;

    }


    clearMessage(
        document
        .getElementById("loginMessage")
    );

}



/* =================================
   SHOW LOGIN
================================= */

function showLogin(){

    document
        .getElementById("resetBox")
        .style.display =
            "none";


    document
        .getElementById("loginBox")
        .style.display =
            "block";


    clearMessage(
        document
        .getElementById("resetMessage")
    );

}



/* =================================
   MESSAGE
================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;


    element.className =
        "message show " +
        type;

}


function clearMessage(element){

    element.textContent =
        "";

    element.className =
        "message";

}



/* =================================
   TRANSLATE LOGIN ERROR
================================= */

function translateLoginError(error){

    const text =
        String(
            error?.message || ""
        )
        .toLowerCase();


    if(
        text.includes(
            "invalid login credentials"
        )
    ){

        return (
            "Email atau password salah."
        );

    }


    if(
        text.includes(
            "email not confirmed"
        )
    ){

        return (
            "Email akun belum dikonfirmasi."
        );

    }


    if(
        text.includes(
            "too many requests"
        )
    ){

        return (
            "Terlalu banyak percobaan login. Tunggu beberapa saat lalu coba lagi."
        );

    }


    return (
        error?.message ||
        "Login gagal."
    );

}



/* =================================
   TRANSLATE RESET ERROR
================================= */

function translateResetError(error){

    const text =
        String(
            error?.message || ""
        )
        .toLowerCase();


    if(
        text.includes(
            "rate limit"
        )
    ){

        return (
            "Email reset sedang terkena batas pengiriman. Jangan kirim berulang kali. Tunggu sampai batas email kembali normal."
        );

    }


    if(
        text.includes(
            "redirect"
        )
    ){

        return (
            "URL reset belum diizinkan di konfigurasi Supabase."
        );

    }


    return (
        error?.message ||
        "Gagal mengirim link reset."
    );

}



</script>


</body>

</html>
