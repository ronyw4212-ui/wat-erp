<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kelola Teknisi - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

.header{
    height:68px;
    background:linear-gradient(90deg,#0d47a1,#1268d8);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.brand h2{
    font-size:20px;
}

.brand span{
    display:block;
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:14px;
}

.user-name{
    font-size:13px;
    font-weight:bold;
}

.logout{
    border:0;
    background:white;
    color:#0d47a1;
    padding:9px 16px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:28px auto;
    padding:0 18px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.page-head h1{
    font-size:28px;
}

.page-head p{
    color:#718096;
    margin-top:6px;
    font-size:14px;
}

.btn{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}

.btn-primary{
    background:#0d5dcc;
    color:white;
}

.btn-primary:hover{
    background:#084da9;
}

.btn-secondary{
    background:#e7edf6;
    color:#24344d;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.btn-success{
    background:#dcfce7;
    color:#15803d;
}

/* =========================
   SUMMARY
========================= */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 16px rgba(20,40,80,.07);
    border-left:4px solid #0d5dcc;
}

.summary-card span{
    display:block;
    color:#718096;
    font-size:13px;
}

.summary-card strong{
    display:block;
    font-size:27px;
    margin-top:7px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:white;
    padding:14px;
    border-radius:12px;
    display:flex;
    gap:10px;
    margin-bottom:18px;
    box-shadow:0 4px 16px rgba(20,40,80,.06);
}

.toolbar input,
.toolbar select{
    height:42px;
    border:1px solid #d7dfeb;
    border-radius:8px;
    padding:0 12px;
    outline:none;
    background:white;
}

.toolbar input{
    flex:1;
}

.toolbar select{
    width:190px;
}

/* =========================
   ALERT
========================= */

.alert{
    display:none;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
}

.alert.show{
    display:block;
}

.alert-error{
    background:#fee2e2;
    color:#991b1b;
}

.alert-success{
    background:#dcfce7;
    color:#166534;
}

/* =========================
   TABLE
========================= */

.table-box{
    background:white;
    border-radius:12px;
    padding:10px;
    box-shadow:0 4px 16px rgba(20,40,80,.06);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#edf3fa;
    color:#40516a;
    font-size:12px;
    text-align:left;
    padding:13px;
    white-space:nowrap;
}

td{
    padding:14px 13px;
    border-bottom:1px solid #edf0f5;
    font-size:13px;
}

tr:last-child td{
    border-bottom:0;
}

.tech-name{
    font-weight:bold;
    font-size:14px;
}

.tech-email{
    color:#718096;
    font-size:11px;
    margin-top:4px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.badge-active{
    background:#dcfce7;
    color:#15803d;
}

.badge-inactive{
    background:#fee2e2;
    color:#b91c1c;
}

.loading,
.empty{
    text-align:center;
    padding:45px 20px;
    color:#718096;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-box{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.modal-header{
    padding:18px 20px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:19px;
}

.close{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    color:#64748b;
}

.modal-body{
    padding:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    height:43px;
    border:1px solid #d7deea;
    border-radius:8px;
    padding:0 12px;
    outline:none;
}

.form-help{
    color:#718096;
    font-size:11px;
    margin-top:6px;
}

.account-preview{
    display:none;
    background:#f3f7fc;
    border-radius:9px;
    padding:12px;
    margin-bottom:15px;
}

.account-preview strong{
    display:block;
}

.account-preview span{
    display:block;
    color:#718096;
    font-size:12px;
    margin-top:4px;
}

.modal-footer{
    padding:15px 20px 20px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

@media(max-width:700px){

    .header{
        padding:0 15px;
    }

    .user-name{
        display:none;
    }

    .container{
        margin:20px auto;
        padding:0 12px;
    }

    .page-head{
        display:block;
    }

    .page-head .btn{
        margin-top:15px;
    }

    .summary{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }

    .toolbar select{
        width:100%;
    }

    th,
    td{
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <h2>WAT ERP</h2>
        <span>Kelola Teknisi</span>
    </div>

    <div class="header-right">

        <span
            class="user-name"
            id="userName"
        >
            OWNER
        </span>

        <button
            class="logout"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>

</header>


<main class="container">

    <div class="page-head">

        <div>

            <h1>Kelola Teknisi</h1>

            <p>
                Kelola akun dan data karyawan teknisi.
            </p>

        </div>

        <button
            class="btn btn-primary"
            onclick="openAddModal()"
        >
            + Tambah Teknisi
        </button>

    </div>


    <!-- SUMMARY -->

    <section class="summary">

        <div class="summary-card">

            <span>
                Total Teknisi Aktif
            </span>

            <strong id="totalTechnicians">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Total Pekerjaan Selesai
            </span>

            <strong id="totalJobs">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Total Nilai Pekerjaan
            </span>

            <strong id="totalValue">
                Rp 0
            </strong>

        </div>

    </section>


    <!-- TOOLBAR -->

    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari nama / email / kode teknisi..."
            oninput="renderTechnicians()"
        >

        <select
            id="statusFilter"
            onchange="renderTechnicians()"
        >

            <option value="">
                Semua Status
            </option>

            <option value="ACTIVE">
                Aktif
            </option>

            <option value="INACTIVE">
                Tidak Aktif
            </option>

        </select>


        <button
            class="btn btn-secondary"
            onclick="loadData()"
        >
            ↻ Refresh
        </button>

    </section>


    <div
        id="alert"
        class="alert"
    ></div>


    <!-- TABLE -->

    <section class="table-box">

        <table>

            <thead>

                <tr>

                    <th>
                        Teknisi
                    </th>

                    <th>
                        Kode
                    </th>

                    <th>
                        Pekerjaan
                    </th>

                    <th>
                        Total Rupiah
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Aksi
                    </th>

                </tr>

            </thead>

            <tbody id="technicianTable">

                <tr>

                    <td colspan="6">

                        <div class="loading">
                            Memuat data...
                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>


<!-- =========================
     TAMBAH TEKNISI
========================= -->

<div
    class="modal"
    id="addModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Tambah Teknisi
            </h2>

            <button
                class="close"
                onclick="closeAddModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="form-group">

                <label>
                    Akun Teknisi *
                </label>

                <select
                    id="accountSelect"
                    onchange="previewAccount()"
                >

                    <option value="">
                        -- Pilih Akun Teknisi --
                    </option>

                </select>

                <div class="form-help">
                    Hanya akun dengan role TEKNISI
                    yang belum terdaftar.
                </div>

            </div>


            <div
                class="account-preview"
                id="accountPreview"
            >

                <strong id="previewName">
                    -
                </strong>

                <span id="previewEmail">
                    -
                </span>

            </div>


            <div class="form-group">

                <label>
                    No. HP
                </label>

                <input
                    type="text"
                    id="phoneInput"
                    placeholder="08xxxxxxxxxx"
                >

            </div>


            <div class="form-group">

                <label>
                    Catatan
                </label>

                <input
                    type="text"
                    id="notesInput"
                    placeholder="Catatan teknisi..."
                >

            </div>

        </div>


        <div class="modal-footer">

            <button
                class="btn btn-secondary"
                onclick="closeAddModal()"
            >
                Batal
            </button>

            <button
                class="btn btn-primary"
                onclick="saveTechnician()"
            >
                Simpan
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const { createClient } = window.supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================
   STATE
===================================== */

let currentUser = null;

let currentProfile = null;

let technicians = [];

let profiles = [];

let jobs = [];


/* =====================================
   INIT
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init(){

    try{

        const {
            data:{
                session
            }
        } =
        await supabaseClient.auth.getSession();


        if(!session){

            window.location.href =
                "login.html";

            return;
        }


        currentUser =
            session.user;


        await checkOwner();

        await loadData();

    }

    catch(error){

        console.error(error);

        showAlert(
            "Gagal memuat halaman: " +
            error.message,
            "error"
        );

    }

}


/* =====================================
   CHECK OWNER
===================================== */

async function checkOwner(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            email,
            role,
            status
        `)
        .eq(
            "id",
            currentUser.id
        )
        .single();


    if(error){

        throw error;

    }


    currentProfile =
        data;


    if(
        data.role !== "OWNER"
    ){

        alert(
            "Akses ditolak. Halaman ini hanya untuk OWNER."
        );

        window.location.href =
            "login.html";

        return;

    }


    if(
        data.status !== "ACTIVE"
    ){

        await supabaseClient.auth.signOut();

        window.location.href =
            "login.html";

        return;

    }


    document.getElementById(
        "userName"
    ).textContent =
        data.full_name ||
        data.email ||
        "OWNER";

}


/* =====================================
   LOAD ALL DATA
===================================== */

async function loadData(){

    showAlert(
        "",
        "success"
    );


    document.getElementById(
        "technicianTable"
    ).innerHTML = `
        <tr>
            <td colspan="6">
                <div class="loading">
                    Memuat data teknisi...
                </div>
            </td>
        </tr>
    `;


    /* ================================
       TECHNICIANS
    ================================= */

    const {
        data:technicianData,
        error:technicianError
    } =
    await supabaseClient
        .from("technicians")
        .select(`
            id,
            technician_code,
            full_name,
            phone,
            email,
            user_id,
            status,
            notes,
            created_by,
            created_at,
            updated_at
        `)
        .order(
            "full_name",
            {
                ascending:true
            }
        );


    if(technicianError){

        throw technicianError;

    }


    technicians =
        technicianData || [];


    /* ================================
       PROFILES TEKNISI
    ================================= */

    const {
        data:profileData,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            email,
            role,
            status
        `)
        .eq(
            "role",
            "TEKNISI"
        )
        .order(
            "full_name",
            {
                ascending:true
            }
        );


    if(profileError){

        throw profileError;

    }


    profiles =
        profileData || [];


    /* ================================
       JOB SELESAI
    ================================= */

    const {
        data:jobData,
        error:jobError
    } =
    await supabaseClient
        .from("jobs")
        .select(`
            id,
            job_code,
            technician_id,
            assigned_to,
            status,
            service_price,
            actual_cost,
            completed_at
        `)
        .eq(
            "status",
            "COMPLETED"
        );


    if(jobError){

        throw jobError;

    }


    jobs =
        jobData || [];


    updateSummary();

    renderTechnicians();

}


/* =====================================
   SUMMARY
===================================== */

function updateSummary(){

    const active =
        technicians.filter(
            technician =>
                technician.status ===
                "ACTIVE"
        );


    document.getElementById(
        "totalTechnicians"
    ).textContent =
        active.length;


    document.getElementById(
        "totalJobs"
    ).textContent =
        jobs.length;


    const total =
        jobs.reduce(
            (
                sum,
                job
            ) => {

                return sum +
                    Number(
                        job.service_price ||
                        0
                    );

            },
            0
        );


    document.getElementById(
        "totalValue"
    ).textContent =
        formatRupiah(total);

}


/* =====================================
   STATISTIK TEKNISI
===================================== */

function getTechnicianStats(
    technician
){

    /*
        Link:

        jobs.technician_id
              ↓
        profiles.id

        technicians.user_id
              ↓
        profiles.id

        Jadi:

        jobs.technician_id
        ===
        technicians.user_id
    */


    const technicianJobs =
        jobs.filter(
            job => {

                return (
                    job.technician_id ===
                    technician.user_id
                )
                ||
                (
                    job.assigned_to ===
                    technician.user_id
                );

            }
        );


    const totalValue =
        technicianJobs.reduce(
            (
                sum,
                job
            ) => {

                return sum +
                    Number(
                        job.service_price ||
                        0
                    );

            },
            0
        );


    return {

        totalJobs:
            technicianJobs.length,

        totalValue

    };

}


/* =====================================
   RENDER
===================================== */

function renderTechnicians(){

    const tbody =
        document.getElementById(
            "technicianTable"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        technicians.filter(
            technician => {

                const text = [

                    technician.full_name,

                    technician.email,

                    technician.technician_code,

                    technician.phone

                ]
                .join(" ")
                .toLowerCase();


                const matchSearch =
                    !search ||
                    text.includes(
                        search
                    );


                const matchStatus =
                    !status ||
                    technician.status ===
                    status;


                return (
                    matchSearch &&
                    matchStatus
                );

            }
        );


    if(
        filtered.length === 0
    ){

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        Tidak ada teknisi.
                    </div>
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        filtered
            .map(
                renderTechnicianRow
            )
            .join("");

}


/* =====================================
   ROW
===================================== */

function renderTechnicianRow(
    technician
){

    const stats =
        getTechnicianStats(
            technician
        );


    const active =
        technician.status ===
        "ACTIVE";


    return `

        <tr>

            <td>

                <div class="tech-name">

                    ${escapeHtml(
                        technician.full_name
                    )}

                </div>

                <div class="tech-email">

                    ${escapeHtml(
                        technician.email ||
                        "-"
                    )}

                </div>

            </td>


            <td>

                ${escapeHtml(
                    technician.technician_code ||
                    "-"
                )}

            </td>


            <td>

                <strong>
                    ${stats.totalJobs}
                </strong>

            </td>


            <td>

                <strong>
                    ${formatRupiah(
                        stats.totalValue
                    )}
                </strong>

            </td>


            <td>

                ${
                    active

                    ?

                    `
                    <span
                        class="badge badge-active"
                    >
                        AKTIF
                    </span>
                    `

                    :

                    `
                    <span
                        class="badge badge-inactive"
                    >
                        TIDAK AKTIF
                    </span>
                    `
                }

            </td>


            <td>

                ${
                    active

                    ?

                    `
                    <button
                        class="btn btn-danger"
                        onclick="changeStatus(
                            '${technician.id}',
                            'INACTIVE'
                        )"
                    >
                        Nonaktifkan
                    </button>
                    `

                    :

                    `
                    <button
                        class="btn btn-success"
                        onclick="changeStatus(
                            '${technician.id}',
                            'ACTIVE'
                        )"
                    >
                        Aktifkan
                    </button>
                    `
                }

            </td>

        </tr>

    `;

}


/* =====================================
   CHANGE STATUS
===================================== */

async function changeStatus(
    technicianId,
    newStatus
){

    const technician =
        technicians.find(
            item =>
                item.id ===
                technicianId
        );


    if(!technician){

        return;

    }


    const action =
        newStatus ===
        "ACTIVE"
        ? "mengaktifkan"
        : "menonaktifkan";


    if(
        !confirm(
            `Yakin ingin ${action} teknisi ${technician.full_name}?`
        )
    ){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("technicians")
            .update({

                status:
                    newStatus,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                technicianId
            );


        if(error){

            throw error;

        }


        showAlert(
            "Status teknisi berhasil diperbarui.",
            "success"
        );


        await loadData();

    }

    catch(error){

        console.error(error);

        showAlert(
            "Gagal mengubah status: " +
            error.message,
            "error"
        );

    }

}


/* =====================================
   MODAL
===================================== */

async function openAddModal(){

    document.getElementById(
        "addModal"
    ).classList.add("show");


    document.getElementById(
        "phoneInput"
    ).value = "";


    document.getElementById(
        "notesInput"
    ).value = "";


    document.getElementById(
        "accountPreview"
    ).style.display =
        "none";


    await loadAvailableAccounts();

}


function closeAddModal(){

    document.getElementById(
        "addModal"
    ).classList.remove("show");

}


/* =====================================
   AKUN YANG BELUM TERDAFTAR
===================================== */

async function loadAvailableAccounts(){

    const select =
        document.getElementById(
            "accountSelect"
        );


    select.innerHTML = `
        <option value="">
            Memuat akun...
        </option>
    `;


    /*
        user_id di technicians
        harus cocok dengan profiles.id
    */


    const registered =
        technicians
            .map(
                technician =>
                    technician.user_id
            )
            .filter(Boolean);


    const available =
        profiles.filter(
            profile => {

                return (
                    profile.status ===
                    "ACTIVE"
                )
                &&
                !registered.includes(
                    profile.id
                );

            }
        );


    select.innerHTML = `
        <option value="">
            -- Pilih Akun Teknisi --
        </option>
    `;


    available.forEach(
        profile => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                profile.id;


            option.textContent =
                `${profile.full_name} — ${profile.email}`;


            select.appendChild(
                option
            );

        }
    );


    if(
        available.length === 0
    ){

        select.innerHTML = `
            <option value="">
                Semua akun teknisi sudah terdaftar
            </option>
        `;

    }

}


/* =====================================
   PREVIEW ACCOUNT
===================================== */

function previewAccount(){

    const userId =
        document.getElementById(
            "accountSelect"
        ).value;


    const profile =
        profiles.find(
            item =>
                item.id ===
                userId
        );


    const preview =
        document.getElementById(
            "accountPreview"
        );


    if(!profile){

        preview.style.display =
            "none";

        return;

    }


    preview.style.display =
        "block";


    document.getElementById(
        "previewName"
    ).textContent =
        profile.full_name;


    document.getElementById(
        "previewEmail"
    ).textContent =
        profile.email;

}


/* =====================================
   GENERATE CODE
===================================== */

function generateTechnicianCode(){

    let maxNumber = 0;


    technicians.forEach(
        technician => {

            const code =
                technician.technician_code ||
                "";


            const match =
                code.match(
                    /TEK-(\d+)/
                );


            if(match){

                const number =
                    Number(
                        match[1]
                    );


                if(
                    number >
                    maxNumber
                ){

                    maxNumber =
                        number;

                }

            }

        }
    );


    return (
        "TEK-" +
        String(
            maxNumber + 1
        ).padStart(
            3,
            "0"
        )
    );

}


/* =====================================
   SAVE TECHNICIAN
===================================== */

async function saveTechnician(){

    const userId =
        document.getElementById(
            "accountSelect"
        ).value;


    const phone =
        document.getElementById(
            "phoneInput"
        ).value.trim();


    const notes =
        document.getElementById(
            "notesInput"
        ).value.trim();


    if(!userId){

        alert(
            "Pilih akun teknisi terlebih dahulu."
        );

        return;

    }


    const profile =
        profiles.find(
            item =>
                item.id ===
                userId
        );


    if(!profile){

        alert(
            "Akun teknisi tidak ditemukan."
        );

        return;

    }


    /*
        Cegah duplicate user_id
    */

    const duplicate =
        technicians.some(
            technician =>
                technician.user_id ===
                profile.id
        );


    if(duplicate){

        alert(
            "Akun teknisi tersebut sudah terdaftar."
        );

        return;

    }


    const technicianCode =
        generateTechnicianCode();


    try{

        const {
            error
        } =
        await supabaseClient
            .from("technicians")
            .insert({

                technician_code:
                    technicianCode,

                full_name:
                    profile.full_name,

                email:
                    profile.email,

                phone:
                    phone ||
                    null,

                user_id:
                    profile.id,

                status:
                    "ACTIVE",

                notes:
                    notes ||
                    null,

                created_by:
                    currentUser.id

            });


        if(error){

            throw error;

        }


        closeAddModal();


        showAlert(
            `Teknisi ${profile.full_name} berhasil ditambahkan.`,
            "success"
        );


        await loadData();

    }

    catch(error){

        console.error(error);

        alert(
            "Gagal menambah teknisi:\n\n" +
            error.message
        );

    }

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}


/* =====================================
   FORMAT RUPIAH
===================================== */

function formatRupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value || 0)
    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   ALERT
===================================== */

function showAlert(
    message,
    type
){

    const alert =
        document.getElementById(
            "alert"
        );


    if(!message){

        alert.className =
            "alert";

        alert.textContent =
            "";

        return;

    }


    alert.textContent =
        message;


    alert.className =
        "alert show " +
        (
            type === "error"
            ? "alert-error"
            : "alert-success"
        );


    setTimeout(
        () => {

            alert.classList.remove(
                "show"
            );

        },
        5000
    );

}

   CLOSE MODAL OUTSIDE
===================================== */

document
    .getElementById("addModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeAddModal();

            }

        }
    );
