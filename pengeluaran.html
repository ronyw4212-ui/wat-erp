<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengeluaran - WAT ERP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#102a43
}

header{
    background:linear-gradient(90deg,#1257b8,#0878f9);
    color:#fff;
    padding:16px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.brand{
    font-size:20px;
    font-weight:bold
}

.brand small{
    display:block;
    font-size:11px;
    margin-top:3px;
    font-weight:normal
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px
}

.role{
    background:rgba(255,255,255,.15);
    padding:8px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer
}

button:disabled{
    opacity:.6;
    cursor:not-allowed
}

.logout{
    background:#fff;
    color:#1267e8
}

.container{
    max-width:1050px;
    margin:28px auto;
    padding:0 16px 50px
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px
}

h1{
    margin:0 0 5px;
    font-size:27px
}

h2{
    margin:0 0 18px;
    font-size:20px
}

p{
    margin:0;
    color:#627d98
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(16,42,67,.08);
    border-left:4px solid #1267e8
}

.card:nth-child(2){
    border-left-color:#f59e0b
}

.card:nth-child(3){
    border-left-color:#16a34a
}

.card small{
    color:#627d98
}

.card strong{
    display:block;
    margin-top:8px;
    font-size:24px
}

.box{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(16,42,67,.08);
    margin-bottom:20px
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px
}

.full{
    grid-column:1/-1
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-family:inherit;
    background:#fff
}

textarea{
    min-height:85px;
    resize:vertical
}

.actions{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
    gap:8px
}

.primary{
    background:#1267e8;
    color:#fff
}

.secondary{
    background:#e8eef7;
    color:#102a43
}

.danger{
    background:#dc2626;
    color:#fff
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px
}

.message.ok{
    display:block;
    background:#dcfce7;
    color:#166534
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b
}

.filter{
    display:grid;
    grid-template-columns:1fr 1fr 180px auto;
    gap:10px;
    margin-bottom:15px
}

.table-wrap{
    overflow-x:auto
}

table{
    width:100%;
    border-collapse:collapse
}

th{
    background:#edf3fa;
    padding:12px;
    text-align:left;
    font-size:12px
}

td{
    padding:12px;
    border-bottom:1px solid #edf2f7;
    font-size:13px
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold
}

.belanja{
    background:#dbeafe;
    color:#1d4ed8
}

.operasional{
    background:#fef3c7;
    color:#92400e
}

.empty{
    text-align:center;
    padding:28px;
    color:#627d98
}

.total-box{
    background:#f1f6fc;
    border-radius:10px;
    padding:15px;
    margin-top:15px
}

.total-box small{
    display:block;
    color:#627d98;
    margin-bottom:5px
}

.total-box strong{
    font-size:22px
}

@media(max-width:700px){

    .cards,
    .grid{
        grid-template-columns:1fr
    }

    .full{
        grid-column:auto
    }

    .filter{
        grid-template-columns:1fr
    }

    .top{
        align-items:flex-start;
        gap:10px
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        WAT ERP
        <small>Pengeluaran & Keuangan</small>
    </div>

    <div class="header-right">
        <span class="role" id="userName">OWNER</span>

        <button
            class="logout"
            onclick="logout()">
            LOGOUT
        </button>
    </div>

</header>


<div class="container">

    <div class="top">

        <div>
            <h1>Pengeluaran</h1>
            <p>
                Catat belanja dan biaya operasional harian.
            </p>
        </div>

        <button
            class="secondary"
            onclick="location.href='dashboard-owner.html'">
            ← Dashboard
        </button>

    </div>


    <div id="message" class="message"></div>


    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">
            <small>Total Belanja</small>
            <strong id="totalBelanja">
                Rp 0
            </strong>
        </div>

        <div class="card">
            <small>Total Operasional</small>
            <strong id="totalOperasional">
                Rp 0
            </strong>
        </div>

        <div class="card">
            <small>Total Pengeluaran</small>
            <strong id="totalPengeluaran">
                Rp 0
            </strong>
        </div>

    </div>


    <!-- FORM -->

    <div class="box">

        <h2>Tambah Pengeluaran</h2>

        <form id="expenseForm">

            <div class="grid">

                <div>

                    <label>
                        Tanggal *
                    </label>

                    <input
                        type="date"
                        id="expenseDate"
                        required>

                </div>


                <div>

                    <label>
                        Jenis Pengeluaran *
                    </label>

                    <select
                        id="category"
                        required>

                        <option value="">
                            -- Pilih Jenis --
                        </option>

                        <option value="BELANJA">
                            BELANJA
                        </option>

                        <option value="OPERASIONAL">
                            OPERASIONAL
                        </option>

                    </select>

                </div>


                <div class="full">

                    <label>
                        Keterangan *
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Contoh: Beli Freon R32 / Bensin teknisi"
                        required>

                </div>


                <div class="full">

                    <label>
                        Nominal *
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0"
                        step="1"
                        placeholder="Contoh: 500000"
                        required>

                </div>


                <div class="full">

                    <label>
                        Catatan
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Catatan tambahan..."></textarea>

                </div>

            </div>


            <div class="total-box">

                <small>
                    Total transaksi
                </small>

                <strong id="formTotal">
                    Rp 0
                </strong>

            </div>


            <div class="actions">

                <button
                    type="reset"
                    class="secondary">
                    Reset
                </button>

                <button
                    type="submit"
                    class="primary"
                    id="saveButton">
                    Simpan Pengeluaran
                </button>

            </div>

        </form>

    </div>


    <!-- FILTER -->

    <div class="box">

        <h2>Riwayat Pengeluaran</h2>

        <div class="filter">

            <input
                type="date"
                id="fromDate">

            <input
                type="date"
                id="toDate">

            <select id="filterCategory">

                <option value="ALL">
                    Semua Jenis
                </option>

                <option value="BELANJA">
                    Belanja
                </option>

                <option value="OPERASIONAL">
                    Operasional
                </option>

            </select>

            <button
                class="secondary"
                onclick="resetFilter()">
                Reset
            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Tanggal</th>
                        <th>Jenis</th>
                        <th>Keterangan</th>
                        <th>Nominal</th>
                        <th>Catatan</th>
                        <th>Aksi</th>
                    </tr>

                </thead>

                <tbody id="expenseTable">

                    <tr>
                        <td
                            colspan="6"
                            class="empty">
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

/*
   BRO:
   ISI DENGAN URL DAN ANON KEY SUPABASE
   YANG SAMA DENGAN FILE YANG SUDAH BERHASIL.
*/

const SUPABASE_URL =
    "PASTE_URL_SUPABASE_DARI_FILE_YANG_SUDAH_BERHASIL";

const SUPABASE_ANON_KEY =
    "PASTE_ANON_KEY_SUPABASE_DARI_FILE_YANG_SUDAH_BERHASIL";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let currentUser = null;
let expenses = [];


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    start
);


async function start(){

    setToday();

    try{

        const {
            data,
            error
        } =
        await client.auth.getUser();


        if(error){
            throw error;
        }


        if(!data.user){

            location.href =
                "login.html";

            return;
        }


        currentUser =
            data.user;


        document.getElementById(
            "userName"
        ).textContent =
            currentUser.email ||
            "OWNER";


        await loadExpenses();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Gagal terhubung ke database: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DEFAULT DATE
===================================================== */

function setToday(){

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");


    document.getElementById(
        "expenseDate"
    ).value =
        `${year}-${month}-${day}`;

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadExpenses(){

    const table =
        document.getElementById(
            "expenseTable"
        );


    table.innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                Memuat data...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
        await client
            .from("expenses")
            .select("*")
            .order(
                "expense_date",
                {
                    ascending:false
                }
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){
            throw error;
        }


        expenses =
            data || [];


        renderExpenses();

        updateSummary();

    }
    catch(error){

        console.error(
            "LOAD EXPENSE ERROR:",
            error
        );


        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty">

                    Gagal memuat pengeluaran.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </td>
            </tr>
        `;

    }

}


/* =====================================================
   SAVE
===================================================== */

document
    .getElementById("expenseForm")
    .addEventListener(
        "submit",
        saveExpense
    );


async function saveExpense(event){

    event.preventDefault();


    const date =
        document
            .getElementById("expenseDate")
            .value;


    const category =
        document
            .getElementById("category")
            .value;


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const amount =
        Number(
            document
                .getElementById("amount")
                .value || 0
        );


    const notes =
        document
            .getElementById("notes")
            .value
            .trim();


    if(
        !date ||
        !category ||
        !description
    ){

        showMessage(
            "Tanggal, jenis dan keterangan wajib diisi.",
            "error"
        );

        return;

    }


    if(amount <= 0){

        showMessage(
            "Nominal harus lebih dari Rp 0.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Menyimpan...";


    try{

        /*
          HANYA MENGISI KOLOM YANG
          KITA BUTUHKAN UNTUK KEUANGAN.
        */

        const payload = {

            expense_date:
                date,

            category:
                category,

            description:
                description,

            amount:
                amount,

            notes:
                notes || null,

            created_by:
                currentUser.id

        };


        const {
            error
        } =
        await client
            .from("expenses")
            .insert(payload);


        if(error){
            throw error;
        }


        showMessage(
            "Pengeluaran berhasil disimpan.",
            "ok"
        );


        document
            .getElementById(
                "expenseForm"
            )
            .reset();


        setToday();


        document.getElementById(
            "formTotal"
        ).textContent =
            "Rp 0";


        await loadExpenses();

    }
    catch(error){

        console.error(
            "SAVE EXPENSE ERROR:",
            error
        );


        showMessage(
            "Gagal menyimpan: " +
            error.message,
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "Simpan Pengeluaran";

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderExpenses(){

    const from =
        document
            .getElementById("fromDate")
            .value;


    const to =
        document
            .getElementById("toDate")
            .value;


    const category =
        document
            .getElementById("filterCategory")
            .value;


    const filtered =
        expenses.filter(item=>{

            const date =
                item.expense_date;


            if(
                from &&
                date < from
            ){
                return false;
            }


            if(
                to &&
                date > to
            ){
                return false;
            }


            if(
                category !== "ALL" &&
                item.category !== category
            ){
                return false;
            }


            return true;

        });


    const table =
        document.getElementById(
            "expenseTable"
        );


    if(!filtered.length){

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty">

                    Belum ada pengeluaran
                    pada periode ini.

                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        filtered.map(item=>{

            const isBelanja =
                item.category === "BELANJA";


            return `

            <tr>

                <td>
                    ${formatDate(
                        item.expense_date
                    )}
                </td>


                <td>

                    <span class="badge ${
                        isBelanja
                        ? "belanja"
                        : "operasional"
                    }">

                        ${
                            isBelanja
                            ? "BELANJA"
                            : "OPERASIONAL"
                        }

                    </span>

                </td>


                <td>
                    <b>
                        ${escapeHtml(
                            item.description
                        )}
                    </b>
                </td>


                <td>
                    <b>
                        ${formatRupiah(
                            item.amount
                        )}
                    </b>
                </td>


                <td>
                    ${escapeHtml(
                        item.notes || "-"
                    )}
                </td>


                <td>

                    <button
                        class="danger"
                        onclick="deleteExpense(
                            '${item.id}'
                        )">

                        Hapus

                    </button>

                </td>

            </tr>

            `;

        }).join("");

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const from =
        document
            .getElementById("fromDate")
            .value;


    const to =
        document
            .getElementById("toDate")
            .value;


    const category =
        document
            .getElementById("filterCategory")
            .value;


    const filtered =
        expenses.filter(item=>{

            const date =
                item.expense_date;


            if(
                from &&
                date < from
            ){
                return false;
            }


            if(
                to &&
                date > to
            ){
                return false;
            }


            if(
                category !== "ALL" &&
                item.category !== category
            ){
                return false;
            }


            return true;

        });


    const belanja =
        filtered
            .filter(
                x =>
                    x.category === "BELANJA"
            )
            .reduce(
                (
                    total,
                    x
                ) =>
                    total +
                    Number(
                        x.amount || 0
                    ),
                0
            );


    const operasional =
        filtered
            .filter(
                x =>
                    x.category === "OPERASIONAL"
            )
            .reduce(
                (
                    total,
                    x
                ) =>
                    total +
                    Number(
                        x.amount || 0
                    ),
                0
            );


    const total =
        belanja +
        operasional;


    document.getElementById(
        "totalBelanja"
    ).textContent =
        formatRupiah(belanja);


    document.getElementById(
        "totalOperasional"
    ).textContent =
        formatRupiah(operasional);


    document.getElementById(
        "totalPengeluaran"
    ).textContent =
        formatRupiah(total);

}


/* =====================================================
   FILTER
===================================================== */

document
    .getElementById("fromDate")
    .addEventListener(
        "change",
        ()=>{
            renderExpenses();
            updateSummary();
        }
    );


document
    .getElementById("toDate")
    .addEventListener(
        "change",
        ()=>{
            renderExpenses();
            updateSummary();
        }
    );


document
    .getElementById("filterCategory")
    .addEventListener(
        "change",
        ()=>{
            renderExpenses();
            updateSummary();
        }
    );


function resetFilter(){

    document.getElementById(
        "fromDate"
    ).value = "";


    document.getElementById(
        "toDate"
    ).value = "";


    document.getElementById(
        "filterCategory"
    ).value = "ALL";


    renderExpenses();

    updateSummary();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteExpense(id){

    if(
        !confirm(
            "Yakin ingin menghapus pengeluaran ini?"
        )
    ){
        return;
    }


    try{

        const {
            error
        } =
        await client
            .from("expenses")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){
            throw error;
        }


        showMessage(
            "Pengeluaran berhasil dihapus.",
            "ok"
        );


        await loadExpenses();

    }
    catch(error){

        showMessage(
            "Gagal menghapus: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   FORM TOTAL
===================================================== */

document
    .getElementById("amount")
    .addEventListener(
        "input",
        ()=>{
            const amount =
                Number(
                    document
                        .getElementById(
                            "amount"
                        )
                        .value || 0
                );

            document.getElementById(
                "formTotal"
            ).textContent =
                formatRupiah(amount);
        }
    );


/* =====================================================
   FORMAT
===================================================== */

function formatRupiah(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value || 0)
    );

}


function formatDate(value){

    if(!value){
        return "-";
    }


    const parts =
        value.split("-");


    if(parts.length !== 3){
        return value;
    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " + type;


    box.style.display =
        "block";


    setTimeout(
        ()=>{
            box.style.display =
                "none";
        },
        5000
    );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await client.auth.signOut();

    location.href =
        "login.html";

}

</script>

</body>
</html>
