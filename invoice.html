<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invoice - WAT ERP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0d47a1;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      opacity: .8;
      margin-top: 3px;
    }

    .logout {
      background: white;
      color: #0d47a1;
      border: 0;
      padding: 9px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .desc {
      color: #64748b;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      border-left: 4px solid #f59e0b;
    }

    .success {
      margin-top: 20px;
      padding: 16px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      color: #166534;
      border-radius: 8px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 18px;
      background: #0d47a1;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="brand">WAT ERP</div>
    <div class="subtitle">Invoice Management</div>
  </div>

  <button class="logout" onclick="logout()">LOGOUT</button>
</header>

<main>

  <h1>Kelola Invoice</h1>

  <div class="desc">
    Kelola invoice dan pembayaran WAT ERP.
  </div>

  <div class="card">

    <h2>Invoice</h2>

    <div class="success">
      ✅ STEP 1 BERHASIL — Halaman Invoice sudah aktif.
    </div>

    <a class="back" href="dashboard-owner.html">
      ← Kembali ke Dashboard Owner
    </a>

  </div>

</main>

<script>
  function logout() {
    window.location.href = "login.html";
  }
</script>

</body>
</html>
