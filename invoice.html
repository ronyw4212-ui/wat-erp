<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kelola Invoice - WAT ERP</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#0d47a1;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:22px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.role{
    font-weight:bold;
    font-size:13px;
}

.logout{
    background:white;
    color:#0d47a1;
    border:0;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

main{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

h1{
    font-size:30px;
    margin-bottom:6px;
}

.desc{
    color:#64748b;
}

.btn{
    border:0;
    border-radius:7px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:#0d47a1;
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#172033;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-small{
    padding:7px 10px;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    border-left:4px solid #0d47a1;
}

.stat-label{
    font-size:13px;
    color:#64748b;
    margin-bottom:8px;
}

.stat-value{
    font-size:24px;
    font-weight:bold;
}

.toolbar{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
    margin-bottom:20px;

    display:flex;
    gap:10px;
}

.search{
    flex:1;
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
}

.select{
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:white;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    background:#eef3f9;
    padding:13px;
    font-size:13px;
}

td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
}

.invoice-number{
    font-weight:bold;
    color:#0d47a1;
}

.money{
    font-weight:bold;
    white-space:nowrap;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-draft{
    background:#e5e7eb;
    color:#374151;
}

.badge-issued{
    background:#dbeafe;
    color:#1d4ed8;
}

.badge-paid{
    background:#dcfce7;
    color:#166534;
}

.badge-cancelled{
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:40px;
    color:#64748b;
}

.alert{
    padding:14px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:bold;
    display:none;
}

.alert-error{
    background:#fee2e2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.alert-success{
    background:#dcfce7;
    border:1px solid #bbf7d0;
    color:#166534;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.modal-head{
    padding:18px 20px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h2{
    font-size:20px;
}

.close{
    border:0;
    background:none;
    font-size:24px;
    cursor:pointer;
    color:#64748b;
}

.modal-body{
    padding:20px;
}

.modal-foot{
    padding:15px 20px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.input,
.form-select,
textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    outline:none;
    font-family:inherit;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.total-box{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:9px;
    padding:15px;
    margin:15px 0;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.total-row:last-child{
    margin-bottom:0;
}

.total-final{
    border-top:1px solid #93c5fd;
    padding-top:10px;
    margin-top:10px;
    font-size:19px;
    font-weight:bold;
}

.payment-info{
    background:#f8fafc;
    padding:15px;
    border-radius:9px;
    margin-bottom:15px;
}

.payment-info strong{
    color:#0d47a1;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .page-head{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .toolbar{
        flex-direction:column;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    header{
        padding:15px;
    }

    main{
        padding:0 12px;
    }

}

</style>
</head>

<body>

<header>

    <div>
        <div class="brand">WAT ERP</div>
        <div class="subtitle">Invoice Management</div>
    </div>

    <div class="header-right">
        <div class="role">OWNER</div>
        <button class="logout" onclick="logout()">LOGOUT</button>
    </div>

</header>


<main>

    <div class="page-head">

        <div>
            <h1>Kelola Invoice</h1>
            <div class="desc">
                Kelola invoice, tagihan dan pembayaran WAT ERP.
            </div>
        </div>

        <button class="btn btn-primary" onclick="openCreateModal()">
            + Buat Invoice
        </button>

    </div>


    <div id="alertBox" class="alert"></div>


    <!-- STATISTIK -->

    <div class="stats">

        <div class="stat">
            <div class="stat-label">Total Invoice</div>
            <div class="stat-value" id="totalInvoice">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Belum Lunas</div>
            <div class="stat-value" id="unpaidInvoice">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Lunas</div>
            <div class="stat-value" id="paidInvoice">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Total Tagihan</div>
            <div class="stat-value" id="totalAmount">
                Rp 0
            </div>
        </div>

    </div>


    <!-- FILTER -->

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Cari nomor invoice atau customer..."
            oninput="renderInvoices()"
        >

        <select
            id="statusFilter"
            class="select"
            onchange="renderInvoices()"
        >

            <option value="">Semua Status</option>
            <option value="DRAFT">Draft</option>
            <option value="ISSUED">Issued</option>
            <option value="PAID">Paid</option>
            <option value="CANCELLED">Cancelled</option>

        </select>

        <button
            class="btn btn-secondary"
            onclick="loadData()"
        >
            ↻ Refresh
        </button>

    </div>


    <!-- LIST -->

    <div class="card">

        <div id="invoiceContainer">
            <div class="loading">
                Memuat data invoice...
            </div>
        </div>

    </div>

</main>


<!-- =====================================================
     MODAL BUAT / EDIT INVOICE
===================================================== -->

<div class="modal" id="invoiceModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="invoiceModalTitle">
                Buat Invoice
            </h2>

            <button
                class="close"
                onclick="closeInvoiceModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <input type="hidden" id="editInvoiceId">


            <div class="form-group">

                <label>Nomor Invoice</label>

                <input
                    type="text"
                    id="invoiceNumber"
                    class="input"
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Customer *</label>

                    <select
                        id="customerId"
                        class="form-select"
                        onchange="filterJobsByCustomer()"
                    >

                        <option value="">
                            -- Pilih Customer --
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Job / Pekerjaan</label>

                    <select
                        id="jobId"
                        class="form-select"
                    >

                        <option value="">
                            -- Tanpa Job --
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Tanggal Terbit</label>

                    <input
                        type="date"
                        id="issuedAt"
                        class="input"
                    >

                </div>


                <div class="form-group">

                    <label>Jatuh Tempo</label>

                    <input
                        type="date"
                        id="dueAt"
                        class="input"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Subtotal *</label>

                <input
                    type="number"
                    id="subtotal"
                    class="input"
                    min="0"
                    value="0"
                    oninput="calculateTotal()"
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Discount</label>

                    <input
                        type="number"
                        id="discount"
                        class="input"
                        min="0"
                        value="0"
                        oninput="calculateTotal()"
                    >

                </div>


                <div class="form-group">

                    <label>Tax / PPN</label>

                    <input
                        type="number"
                        id="tax"
                        class="input"
                        min="0"
                        value="0"
                        oninput="calculateTotal()"
                    >

                </div>

            </div>


            <div class="total-box">

                <div class="total-row">
                    <span>Subtotal</span>
                    <strong id="previewSubtotal">
                        Rp 0
                    </strong>
                </div>

                <div class="total-row">
                    <span>Discount</span>
                    <strong id="previewDiscount">
                        Rp 0
                    </strong>
                </div>

                <div class="total-row">
                    <span>Tax / PPN</span>
                    <strong id="previewTax">
                        Rp 0
                    </strong>
                </div>

                <div class="total-row total-final">
                    <span>TOTAL</span>
                    <strong id="previewTotal">
                        Rp 0
                    </strong>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Status</label>

                    <select
                        id="invoiceStatus"
                        class="form-select"
                    >

                        <option value="DRAFT">
                            DRAFT
                        </option>

                        <option value="ISSUED">
                            ISSUED
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Catatan</label>

                    <input
                        type="text"
                        id="invoiceNotes"
                        class="input"
                        placeholder="Catatan invoice..."
                    >

                </div>

            </div>

        </div>


        <div class="modal-foot">

            <button
                class="btn btn-secondary"
                onclick="closeInvoiceModal()"
            >
                Batal
            </button>

            <button
                class="btn btn-primary"
                onclick="saveInvoice()"
                id="saveInvoiceButton"
            >
                Simpan Invoice
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL PEMBAYARAN
===================================================== -->

<div class="modal" id="paymentModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>Pembayaran Invoice</h2>

            <button
                class="close"
                onclick="closePaymentModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <input
                type="hidden"
                id="paymentInvoiceId"
            >


            <div class="payment-info">

                <div>
                    Invoice:
                    <strong id="paymentInvoiceNumber">
                        -
                    </strong>
                </div>

                <div style="margin-top:7px;">
                    Total:
                    <strong id="paymentInvoiceTotal">
                        Rp 0
                    </strong>
                </div>

            </div>


            <div class="form-group">

                <label>Jumlah Pembayaran *</label>

                <input
                    type="number"
                    id="paymentAmount"
                    class="input"
                    min="0"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label>Metode Pembayaran *</label>

                <select
                    id="paymentMethod"
                    class="form-select"
                    onchange="toggleBankFields()"
                >

                    <option value="TRANSFER">
                        Transfer Bank
                    </option>

                    <option value="CASH">
                        Cash
                    </option>

                    <option value="OTHER">
                        Lainnya
                    </option>

                </select>

            </div>


            <div id="bankFields">

                <div class="form-row">

                    <div class="form-group">

                        <label>Nama Bank</label>

                        <input
                            type="text"
                            id="bankName"
                            class="input"
                            placeholder="Contoh: BCA"
                        >

                    </div>


                    <div class="form-group">

                        <label>No. Rekening</label>

                        <input
                            type="text"
                            id="accountNumber"
                            class="input"
                            placeholder="Nomor rekening"
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Nama Rekening</label>

                        <input
                            type="text"
                            id="accountName"
                            class="input"
                            placeholder="Nama pemilik rekening"
                        >

                    </div>


                    <div class="form-group">

                        <label>No. Referensi</label>

                        <input
                            type="text"
                            id="referenceNumber"
                            class="input"
                            placeholder="No. transaksi"
                        >

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label>Catatan</label>

                <textarea
                    id="paymentNotes"
                    placeholder="Catatan pembayaran..."
                ></textarea>

            </div>

        </div>


        <div class="modal-foot">

            <button
                class="btn btn-secondary"
                onclick="closePaymentModal()"
            >
                Batal
            </button>

            <button
                class="btn btn-success"
                onclick="savePayment()"
                id="savePaymentButton"
            >
                Simpan Pembayaran
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let supabaseClient = null;

let invoices = [];
let customers = [];
let jobs = [];

let currentUser = null;


/* =====================================================
   INIT SUPABASE
===================================================== */

function initSupabase(){

    if(
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ){
        throw new Error(
            "Library Supabase tidak berhasil dimuat."
        );
    }

    if(
        typeof SUPABASE_URL === "undefined" ||
        typeof SUPABASE_PUBLISHABLE_KEY === "undefined"
    ){
        throw new Error(
            "SUPABASE_URL atau SUPABASE_PUBLISHABLE_KEY tidak ditemukan dari assets/js/config.js."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );
}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        try{

            initSupabase();

            await checkAuth();

            await loadData();

        }catch(error){

            console.error(error);

            showAlert(
                error.message ||
                "Gagal memuat halaman invoice.",
                "error"
            );

            document.getElementById(
                "invoiceContainer"
            ).innerHTML = `
                <div class="empty">
                    ${escapeHtml(
                        error.message ||
                        "Terjadi kesalahan."
                    )}
                </div>
            `;

        }

    }
);


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if(error){
        throw error;
    }

    if(!data.session){

        window.location.href =
            "login.html";

        return;

    }

    currentUser =
        data.session.user;


    /* ROLE CHECK */

    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select("id,full_name,email,role,status")
        .eq("id",currentUser.id)
        .single();


    if(profileError){

        console.warn(
            "Profile tidak berhasil dibaca:",
            profileError
        );

    }else{

        if(
            profile.status &&
            profile.status !== "ACTIVE"
        ){

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

            return;

        }

        if(
            profile.role !== "OWNER" &&
            profile.role !== "CS"
        ){

            throw new Error(
                "Anda tidak memiliki akses ke halaman Invoice."
            );

        }

        document.querySelector(".role").textContent =
            profile.role;

    }

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    try{

        await Promise.all([
            loadCustomers(),
            loadJobs(),
            loadInvoices()
        ]);

        renderInvoices();
        updateStats();

    }catch(error){

        console.error(
            "Load data error:",
            error
        );

        showAlert(
            error.message ||
            "Gagal mengambil data.",
            "error"
        );

    }

}


/* =====================================================
   CUSTOMERS
===================================================== */

async function loadCustomers(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("customers")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        throw new Error(
            "Gagal mengambil data customer: " +
            error.message
        );

    }

    customers =
        data || [];


    populateCustomerSelect();

}


/* =====================================================
   JOBS
===================================================== */

async function loadJobs(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("jobs")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        throw new Error(
            "Gagal mengambil data job: " +
            error.message
        );

    }

    jobs =
        data || [];

}


/* =====================================================
   INVOICES
===================================================== */

async function loadInvoices(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("invoices")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        throw new Error(
            "Gagal mengambil data invoice: " +
            error.message
        );

    }

    invoices =
        data || [];

}


/* =====================================================
   CUSTOMER HELPER
===================================================== */

function customerName(customer){

    if(!customer){
        return "-";
    }

    return (
        customer.full_name ||
        customer.name ||
        customer.customer_name ||
        customer.nama ||
        customer.company_name ||
        customer.company ||
        "-"
    );

}


function customerPhone(customer){

    if(!customer){
        return "";
    }

    return (
        customer.phone ||
        customer.whatsapp ||
        customer.phone_number ||
        customer.no_whatsapp ||
        ""
    );

}


function customerById(id){

    return customers.find(
        c => c.id === id
    );

}


/* =====================================================
   JOB HELPER
===================================================== */

function jobNumber(job){

    if(!job){
        return "-";
    }

    return (
        job.job_number ||
        job.job_no ||
        job.kode_job ||
        job.code ||
        job.id
    );

}


function jobTitle(job){

    if(!job){
        return "";
    }

    return (
        job.title ||
        job.job_title ||
        job.description ||
        job.pekerjaan ||
        job.service ||
        job.name ||
        ""
    );

}


/* =====================================================
   POPULATE CUSTOMER
===================================================== */

function populateCustomerSelect(){

    const select =
        document.getElementById(
            "customerId"
        );

    select.innerHTML =
        `<option value="">
            -- Pilih Customer --
        </option>`;


    customers.forEach(
        customer => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                customer.id;

            const name =
                customerName(customer);

            const phone =
                customerPhone(customer);

            option.textContent =
                phone
                    ? `${name} - ${phone}`
                    : name;

            select.appendChild(option);

        }
    );

}


/* =====================================================
   FILTER JOB BY CUSTOMER
===================================================== */

function filterJobsByCustomer(){

    const customerId =
        document.getElementById(
            "customerId"
        ).value;

    const select =
        document.getElementById(
            "jobId"
        );

    select.innerHTML =
        `<option value="">
            -- Tanpa Job --
        </option>`;


    let filtered =
        jobs;


    if(customerId){

        filtered =
            jobs.filter(
                job =>
                    job.customer_id ===
                    customerId
            );

    }


    filtered.forEach(
        job => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                job.id;

            option.textContent =
                `${jobNumber(job)} - ${jobTitle(job)}`;

            select.appendChild(option);

        }
    );

}


/* =====================================================
   RENDER INVOICE
===================================================== */

function renderInvoices(){

    const container =
        document.getElementById(
            "invoiceContainer"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    let filtered =
        invoices.filter(
            invoice => {

                const customer =
                    customerById(
                        invoice.customer_id
                    );

                const name =
                    customerName(
                        customer
                    ).toLowerCase();

                const number =
                    String(
                        invoice.invoice_number ||
                        ""
                    ).toLowerCase();

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    number.includes(search);

                const matchesStatus =
                    !status ||
                    invoice.status === status;

                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                Belum ada invoice.
            </div>
        `;

        return;

    }


    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th>No. Invoice</th>
            <th>Customer</th>
            <th>Tanggal</th>
            <th>Jatuh Tempo</th>
            <th>Total</th>
            <th>Status</th>
            <th>Aksi</th>

        </tr>

        </thead>

        <tbody>
    `;


    filtered.forEach(
        invoice => {

            const customer =
                customerById(
                    invoice.customer_id
                );


            const statusClass =
                getStatusClass(
                    invoice.status
                );


            html += `

                <tr>

                    <td>

                        <div class="invoice-number">

                            ${escapeHtml(
                                invoice.invoice_number
                            )}

                        </div>

                    </td>


                    <td>

                        ${escapeHtml(
                            customerName(customer)
                        )}

                    </td>


                    <td>

                        ${formatDate(
                            invoice.issued_at
                        )}

                    </td>


                    <td>

                        ${formatDate(
                            invoice.due_at
                        )}

                    </td>


                    <td class="money">

                        ${formatRupiah(
                            invoice.total
                        )}

                    </td>


                    <td>

                        <span class="badge ${statusClass}">

                            ${escapeHtml(
                                invoice.status
                            )}

                        </span>

                    </td>


                    <td>

                        <div style="
                            display:flex;
                            gap:5px;
                            flex-wrap:wrap;
                        ">

                            ${
                                invoice.status !==
                                "CANCELLED"
                                &&
                                invoice.status !==
                                "PAID"

                                ?

                                `

                                <button
                                    class="btn btn-small btn-secondary"
                                    onclick="editInvoice('${invoice.id}')"
                                >
                                    Edit
                                </button>

                                <button
                                    class="btn btn-small btn-success"
                                    onclick="openPaymentModal('${invoice.id}')"
                                >
                                    Bayar
                                </button>

                                <button
                                    class="btn btn-small btn-danger"
                                    onclick="cancelInvoice('${invoice.id}')"
                                >
                                    Batalkan
                                </button>

                                `

                                :

                                ""

                            }

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    switch(status){

        case "DRAFT":
            return "badge-draft";

        case "PAID":
            return "badge-paid";

        case "CANCELLED":
            return "badge-cancelled";

        default:
            return "badge-issued";

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStats(){

    const total =
        invoices.length;


    const paid =
        invoices.filter(
            i => i.status === "PAID"
        ).length;


    const unpaid =
        invoices.filter(
            i =>
                i.status !== "PAID" &&
                i.status !== "CANCELLED"
        ).length;


    const totalAmount =
        invoices
            .filter(
                i =>
                    i.status !==
                    "CANCELLED"
            )
            .reduce(
                (
                    sum,
                    i
                ) =>
                    sum +
                    Number(
                        i.total || 0
                    ),
                0
            );


    document.getElementById(
        "totalInvoice"
    ).textContent =
        total;


    document.getElementById(
        "unpaidInvoice"
    ).textContent =
        unpaid;


    document.getElementById(
        "paidInvoice"
    ).textContent =
        paid;


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatRupiah(
            totalAmount
        );

}

/* =====================================================
   SAVE INVOICE
===================================================== */

async function saveInvoice(){

    const button =
        document.getElementById(
            "saveInvoiceButton"
        );


    try{

        button.disabled = true;
        button.textContent =
            "Menyimpan...";


        const id =
            document.getElementById(
                "editInvoiceId"
            ).value;


        const invoiceNumber =
            document.getElementById(
                "invoiceNumber"
            ).value.trim();


        const customerId =
            document.getElementById(
                "customerId"
            ).value;


        const jobId =
            document.getElementById(
                "jobId"
            ).value ||
            null;


        const issuedAt =
            document.getElementById(
                "issuedAt"
            ).value;


        const dueAt =
            document.getElementById(
                "dueAt"
            ).value ||
            null;


        const subtotal =
            Number(
                document.getElementById(
                    "subtotal"
                ).value
            ) || 0;


        const discount =
            Number(
                document.getElementById(
                    "discount"
                ).value
            ) || 0;


        const tax =
            Number(
                document.getElementById(
                    "tax"
                ).value
            ) || 0;


        const total =
            subtotal -
            discount +
            tax;


        const status =
            document.getElementById(
                "invoiceStatus"
            ).value;


        const notes =
            document.getElementById(
                "invoiceNotes"
            ).value.trim();


        if(!invoiceNumber){

            throw new Error(
                "Nomor invoice wajib diisi."
            );

        }


        if(!customerId){

            throw new Error(
                "Customer wajib dipilih."
            );

        }


        if(subtotal < 0){

            throw new Error(
                "Subtotal tidak boleh negatif."
            );

        }


        if(discount < 0){

            throw new Error(
                "Discount tidak boleh negatif."
            );

        }


        if(total < 0){

            throw new Error(
                "Total invoice tidak boleh negatif."
            );

        }


        const payload = {

            invoice_number:
                invoiceNumber,

            job_id:
                jobId,

            customer_id:
                customerId,

            subtotal:
                subtotal,

            discount:
                discount,

            tax:
                tax,

            total:
                total,

            status:
                status,

            issued_at:
                issuedAt
                    ? new Date(
                        issuedAt +
                        "T00:00:00"
                    ).toISOString()
                    : null,

            due_at:
                dueAt
                    ? new Date(
                        dueAt +
                        "T00:00:00"
                    ).toISOString()
                    : null,

            notes:
                notes || null

        };


        if(id){

            const {
                error
            } =
            await supabaseClient
                .from("invoices")
                .update(payload)
                .eq("id",id);


            if(error){
                throw error;
            }


            showAlert(
                "Invoice berhasil diperbarui.",
                "success"
            );

        }else{

            payload.created_by =
                currentUser
                    ? currentUser.id
                    : null;


            const {
                error
            } =
            await supabaseClient
                .from("invoices")
                .insert(payload);


            if(error){
                throw error;
            }


            showAlert(
                "Invoice berhasil dibuat.",
                "success"
            );

        }


        closeInvoiceModal();

        await loadData();

    }catch(error){

        console.error(
            "Save invoice:",
            error
        );

        showAlert(
            error.message ||
            "Gagal menyimpan invoice.",
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent =
            "Simpan Invoice";

    }

}


/* =====================================================
   CANCEL INVOICE
===================================================== */

async function cancelInvoice(id){

    const invoice =
        invoices.find(
            i => i.id === id
        );


    if(!invoice){
        return;
    }


    const confirmCancel =
        confirm(
            `Batalkan invoice ${invoice.invoice_number}?`
        );


    if(!confirmCancel){
        return;
    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("invoices")
            .update({
                status:"CANCELLED"
            })
            .eq("id",id);


        if(error){
            throw error;
        }


        showAlert(
            "Invoice berhasil dibatalkan.",
            "success"
        );


        await loadData();

    }catch(error){

        console.error(error);

        showAlert(
            error.message ||
            "Gagal membatalkan invoice.",
            "error"
        );

    }

}

/* =====================================================
   SAVE PAYMENT
===================================================== */

async function savePayment(){

    const button =
        document.getElementById(
            "savePaymentButton"
        );


    try{

        button.disabled = true;
        button.textContent =
            "Menyimpan...";


        const invoiceId =
            document.getElementById(
                "paymentInvoiceId"
            ).value;


        const invoice =
            invoices.find(
                i => i.id === invoiceId
            );


        if(!invoice){

            throw new Error(
                "Invoice tidak ditemukan."
            );

        }


        const amount =
            Number(
                document.getElementById(
                    "paymentAmount"
                ).value
            ) || 0;


        const method =
            document.getElementById(
                "paymentMethod"
            ).value;


        const bankName =
            document.getElementById(
                "bankName"
            ).value.trim();


        const accountNumber =
            document.getElementById(
                "accountNumber"
            ).value.trim();


        const accountName =
            document.getElementById(
                "accountName"
            ).value.trim();


        const referenceNumber =
            document.getElementById(
                "referenceNumber"
            ).value.trim();


        const notes =
            document.getElementById(
                "paymentNotes"
            ).value.trim();


        if(amount <= 0){

            throw new Error(
                "Jumlah pembayaran harus lebih dari 0."
            );

        }


        if(method === "TRANSFER" && !bankName){

            throw new Error(
                "Nama bank wajib diisi untuk pembayaran transfer."
            );

        }


        const paymentPayload = {

            invoice_id:
                invoiceId,

            payment_date:
                new Date().toISOString(),

            amount:
                amount,

            payment_method:
                method,

            bank_name:
                bankName || null,

            account_number:
                accountNumber || null,

            account_name:
                accountName || null,

            reference_number:
                referenceNumber || null,

            notes:
                notes || null,

            created_by:
                currentUser
                    ? currentUser.id
                    : null

        };


        const {
            error
        } =
        await supabaseClient
            .from("invoice_payments")
            .insert(paymentPayload);


        if(error){
            throw error;
        }


        /*
         * STEP 2B
         *
         * Untuk sementara status invoice
         * menjadi PAID apabila pembayaran
         * >= total invoice.
         */

        if(
            amount >=
            Number(invoice.total || 0)
        ){

            const {
                error:updateError
            } =
            await supabaseClient
                .from("invoices")
                .update({
                    status:"PAID",
                    paid_at:
                        new Date()
                            .toISOString()
                })
                .eq(
                    "id",
                    invoiceId
                );


            if(updateError){
                throw updateError;
            }

        }


        showAlert(
            "Pembayaran berhasil disimpan.",
            "success"
        );


        closePaymentModal();

        await loadData();

    }catch(error){

        console.error(
            "Payment error:",
            error
        );


        showAlert(
            error.message ||
            "Gagal menyimpan pembayaran.",
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent =
            "Simpan Pembayaran";

    }

}

/* =====================================================
   GENERATE INVOICE NUMBER
===================================================== */

function generateInvoiceNumber(){

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    let max =
        0;


    invoices.forEach(
        invoice => {

            const number =
                String(
                    invoice.invoice_number ||
                    ""
                );


            const match =
                number.match(
                    /(\d+)$/
                );


            if(match){

                const n =
                    Number(
                        match[1]
                    );

                if(n > max){
                    max = n;
                }

            }

        }
    );


    const next =
        String(
            max + 1
        ).padStart(
            4,
            "0"
        );


    return `INV-${year}${month}${day}-${next}`;

}

/* =====================================================
   FORMAT
===================================================== */

function formatRupiah(value){

    const number =
        Number(value || 0);


    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(number);

}


function formatDate(value){

    if(!value){
        return "-";
    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "-";
    }


    return date.toLocaleDateString(
        "id-ID"
    );

}


function dateForInput(value){

    if(!value){
        return "";
    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "";
    }


    return [
        date.getFullYear(),
        String(
            date.getMonth()+1
        ).padStart(2,"0"),
        String(
            date.getDate()
        ).padStart(2,"0")
    ].join("-");

}


/* =====================================================
   ALERT
===================================================== */

function showAlert(
    message,
    type="success"
){

    const box =
        document.getElementById(
            "alertBox"
        );


    box.textContent =
        message;


    box.className =
        "alert " +
        (
            type === "error"
                ? "alert-error"
                : "alert-success"
        );


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        5000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
