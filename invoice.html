<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice - WAT ERP</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root{--blue:#2563eb;--dark:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--green:#16a34a;--orange:#d97706;--red:#dc2626}
body{background:var(--bg);color:var(--dark);font-family:Arial,sans-serif;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff}.btn-success{background:var(--green);color:#fff}.btn-warning{background:#f59e0b;color:#fff}.btn-secondary{background:#e2e8f0;color:#0f172a}.btn-danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);background:#f8fafc}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.draft{background:#e2e8f0}.issued{background:#dbeafe;color:#1d4ed8}.partial{background:#fef3c7;color:#92400e}.paid{background:#dcfce7;color:#166534}.cancelled{background:#fee2e2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;overflow:auto;padding:20px}.modal.show{display:block}.modal-box{max-width:900px;margin:20px auto;background:#fff;border-radius:14px;padding:22px}
.invoice-paper{background:#fff;border:1px solid #dbe3ef;padding:35px;max-width:820px;margin:auto}
.inv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--dark);padding-bottom:18px}.company{font-size:22px;font-weight:800}.muted{color:var(--muted)}
.inv-meta{text-align:right}.section{margin-top:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}.amount{text-align:right;margin-top:20px}.amount div{margin:6px 0}.total{font-size:21px;font-weight:800;border-top:2px solid var(--dark);padding-top:10px}
.payment-box{margin-top:25px;padding:15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px}
.alert{display:none;padding:10px 12px;border-radius:8px;margin-top:12px;font-size:13px}.alert.show{display:block}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border:1px solid var(--line);border-radius:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:20px;display:block;margin-top:5px}
@media(max-width:750px){.grid,.grid3,.two,.summary{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.invoice-paper{padding:20px}.inv-head{flex-direction:column}.inv-meta{text-align:left}}
@media print{body{background:#fff}.no-print{display:none!important}.invoice-paper{border:0;padding:0;max-width:none}.modal{position:static;padding:0;background:#fff}.modal-box{margin:0;padding:0;max-width:none;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Invoice</h1>
      <div class="sub">WAT ERP — Invoice & Pembayaran</div>
    </div>
    <div class="actions no-print">
      <button class="btn btn-primary" onclick="openCreate()">+ BUAT INVOICE</button>
      <button class="btn btn-secondary" onclick="loadInvoices()">↻ Refresh</button>
    </div>
  </div>

  <div id="pageAlert" class="alert"></div>

  <div class="summary">
    <div class="stat"><small>Total Invoice</small><strong id="statAll">0</strong></div>
    <div class="stat"><small>Issued</small><strong id="statIssued">0</strong></div>
    <div class="stat"><small>Partial</small><strong id="statPartial">0</strong></div>
    <div class="stat"><small>Paid</small><strong id="statPaid">0</strong></div>
  </div>

  <div class="card">
    <div class="grid3">
      <div><label>Cari</label><input id="search" placeholder="Invoice / customer / job" oninput="renderInvoices()"></div>
      <div><label>Status</label><select id="filterStatus" onchange="renderInvoices()"><option value="">Semua</option><option>ISSUED</option><option>PARTIAL</option><option>PAID</option><option>DRAFT</option><option>CANCELLED</option></select></div>
      <div><label>&nbsp;</label><button class="btn btn-secondary" onclick="clearFilter()">Reset Filter</button></div>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Invoice</th><th>Customer</th><th>Job</th><th>Total</th><th>Terbayar</th><th>Sisa</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="invoiceRows"><tr><td colspan="8">Memuat...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="createModal" class="modal">
 <div class="modal-box">
  <h2>Generate Invoice</h2>
  <div class="grid">
   <div><label>Pilih Job COMPLETED</label><select id="jobSelect" onchange="fillJob()"><option value="">Memuat job...</option></select></div>
   <div><label>Jatuh Tempo</label><input id="dueAt" type="date"></div>
  </div>
  <div class="grid" style="margin-top:14px">
   <div><label>Customer</label><input id="cName" readonly></div>
   <div><label>No. WhatsApp</label><input id="cPhone" readonly></div>
   <div><label>Alamat</label><textarea id="cAddress" readonly></textarea></div>
   <div><label>Rincian Pekerjaan</label><textarea id="jobDetail" readonly></textarea></div>
  </div>
  <div class="grid3" style="margin-top:14px">
   <div><label>Subtotal</label><input id="subtotal" type="number" min="0" value="0" oninput="calcTotal()"></div>
   <div><label>Diskon</label><input id="discount" type="number" min="0" value="0" oninput="calcTotal()"></div>
   <div><label>Pajak</label><input id="tax" type="number" min="0" value="0" oninput="calcTotal()"></div>
  </div>
  <div class="card" style="margin-top:14px;background:#f8fafc"><strong>Total: <span id="createTotal">Rp0</span></strong></div>
  <label>Catatan</label><textarea id="notes" placeholder="Catatan invoice / pembayaran"></textarea>
  <div id="createAlert" class="alert"></div>
  <div class="actions">
   <button class="btn btn-primary" onclick="createInvoice()">GENERATE INVOICE</button>
   <button class="btn btn-secondary" onclick="closeModal('createModal')">Batal</button>
  </div>
 </div>
</div>

<div id="detailModal" class="modal">
 <div class="modal-box">
   <div class="actions no-print">
    <button class="btn btn-secondary" onclick="closeModal('detailModal')">Tutup</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 PRINT / SAVE PDF</button>
    <button class="btn btn-success" id="paymentButton" onclick="openPayment()">+ TAMBAH PEMBAYARAN</button>
   </div>
   <div id="invoicePaper" class="invoice-paper"></div>
   <div id="paymentHistory" class="card no-print"></div>
 </div>
</div>

<div id="paymentModal" class="modal">
 <div class="modal-box" style="max-width:650px">
  <h2>Tambah Pembayaran</h2>
  <div class="grid">
   <div><label>Tanggal Pembayaran</label><input id="payDate" type="datetime-local"></div>
   <div><label>Nominal</label><input id="payAmount" type="number" min="1" placeholder="Contoh 250000"></div>
  </div>
  <div class="grid" style="margin-top:14px">
   <div><label>Metode</label><select id="payMethod"><option value="TRANSFER_BANK">Transfer Bank</option></select></div>
   <div><label>Bank</label><input id="payBank" value="BCA"></div>
   <div><label>No. Rekening</label><input id="payAccount" value="2190176561"></div>
   <div><label>a.n.</label><input id="payAccountName" value="Roni Wijaya"></div>
   <div><label>Referensi Transfer</label><input id="payRef" placeholder="Opsional"></div>
  </div>
  <label style="margin-top:14px">Catatan</label><textarea id="payNotes"></textarea>
  <div id="payAlert" class="alert"></div>
  <div class="actions">
   <button class="btn btn-success" onclick="savePayment()">SIMPAN PEMBAYARAN</button>
   <button class="btn btn-secondary" onclick="closeModal('paymentModal')">Batal</button>
  </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
let currentUser=null,currentProfile=null,invoices=[],jobs=[],payments=[],selectedInvoice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function rupiah(v){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0));}
function fmtDate(v){if(!v)return "-";return new Date(v).toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});}
function showAlert(id,msg,type="ok"){const e=document.getElementById(id);e.textContent=msg;e.className="alert show "+(type==="err"?"err":"ok");}
function clearAlert(id){const e=document.getElementById(id);e.className="alert";e.textContent="";}
function openModal(id){document.getElementById(id).classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");}

async function init(){
  const {data:{user},error}=await supabaseClient.auth.getUser();
  if(error||!user){location.href="index.html";return;}
  currentUser=user;
  const p=await supabaseClient.from("profiles").select("id,full_name,email,role,status").eq("id",user.id).maybeSingle();
  currentProfile=p.data;
  if(!currentProfile || !["OWNER","CS"].includes(currentProfile.role) || currentProfile.status!=="ACTIVE"){
    document.body.innerHTML='<div style="padding:40px;font-family:Arial"><h2>Akses ditolak</h2><p>Halaman Invoice hanya dapat diakses OWNER atau CS.</p></div>';return;
  }
  await Promise.all([loadInvoices(),loadCompletedJobs()]);
}

async function loadInvoices(){
  const {data,error}=await supabaseClient.from("invoices").select("*").order("created_at",{ascending:false});
  if(error){showAlert("pageAlert","Gagal memuat invoice: "+error.message,"err");return;}
  invoices=data||[];
  renderInvoices();
  await updateStats();
}

async function updateStats(){
  document.getElementById("statAll").textContent=invoices.length;
  document.getElementById("statIssued").textContent=invoices.filter(x=>x.status==="ISSUED").length;
  document.getElementById("statPartial").textContent=invoices.filter(x=>x.status==="PARTIAL").length;
  document.getElementById("statPaid").textContent=invoices.filter(x=>x.status==="PAID").length;
}

async function loadCompletedJobs(){
  const {data,error}=await supabaseClient.from("jobs").select("*").eq("status","COMPLETED").order("completed_at",{ascending:false});
  if(error){console.error(error);return;}
  jobs=data||[];
  const used=new Set(invoices.map(i=>i.job_id).filter(Boolean));
  const available=jobs.filter(j=>!used.has(j.id));
  const sel=document.getElementById("jobSelect");
  sel.innerHTML='<option value="">Pilih job...</option>'+available.map(j=>`<option value="${j.id}">${esc(j.job_code)} — ${esc(j.customer_name||"Customer")} — ${rupiah(j.billing_total)}</option>`).join("");
}

function renderInvoices(){
  const q=document.getElementById("search").value.toLowerCase().trim(), st=document.getElementById("filterStatus").value;
  const rows=document.getElementById("invoiceRows");
  const filtered=invoices.filter(i=>{
    const hay=[i.invoice_number,i.customer_name,i.job_code].join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(!st||i.status===st);
  });
  if(!filtered.length){rows.innerHTML='<tr><td colspan="8">Belum ada invoice.</td></tr>';return;}
  rows.innerHTML=filtered.map(i=>{
    const paid=Number(i._paid||0), total=Number(i.total||0), remain=Math.max(0,total-paid);
    return `<tr><td><strong>${esc(i.invoice_number)}</strong><br><small>${fmtDate(i.issued_at)}</small></td><td>${esc(i.customer_name||"-")}</td><td>${esc(i.job_code||"-")}</td><td>${rupiah(total)}</td><td>${rupiah(paid)}</td><td>${rupiah(remain)}</td><td><span class="badge ${String(i.status).toLowerCase()}">${esc(i.status)}</span></td><td><button class="btn btn-primary" onclick="viewInvoice('${i.id}')">Detail</button></td></tr>`;
  }).join("");
}

async function hydratePaymentTotals(){
  if(!invoices.length){renderInvoices();return;}
  const ids=invoices.map(i=>i.id);
  const {data,error}=await supabaseClient.from("invoice_payments").select("invoice_id,amount").in("invoice_id",ids);
  if(error){console.error(error);renderInvoices();return;}
  const totals={};(data||[]).forEach(p=>totals[p.invoice_id]=(totals[p.invoice_id]||0)+Number(p.amount||0));
  invoices=invoices.map(i=>({...i,_paid:totals[i.id]||0}));
  renderInvoices();await updateStats();
}

function openCreate(){
  document.getElementById("jobSelect").value="";
  ["cName","cPhone","cAddress","jobDetail"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("subtotal").value=0;document.getElementById("discount").value=0;document.getElementById("tax").value=0;document.getElementById("notes").value="";
  clearAlert("createAlert");calcTotal();openModal("createModal");
}
function fillJob(){
  const j=jobs.find(x=>x.id===document.getElementById("jobSelect").value);if(!j)return;
  document.getElementById("cName").value=j.customer_name||"";
  document.getElementById("cPhone").value=j.customer_phone||"";
  document.getElementById("cAddress").value=j.customer_address||"";
  document.getElementById("jobDetail").value=j.billing_detail||j.work_description||j.description||"";
  document.getElementById("subtotal").value=Number(j.billing_total||j.service_price||0);
  calcTotal();
}
function calcTotal(){
  const s=Number(document.getElementById("subtotal").value||0),d=Number(document.getElementById("discount").value||0),t=Number(document.getElementById("tax").value||0);
  document.getElementById("createTotal").textContent=rupiah(Math.max(0,s-d+t));
}

async function nextInvoiceNumber(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0");
  const prefix=`INV/WAT/${m}/${y}/`;
  const {data,error}=await supabaseClient.from("invoices").select("invoice_number").ilike("invoice_number",`${prefix}%`).order("invoice_number",{ascending:false}).limit(1);
  if(error)throw error;
  let n=1;if(data&&data[0]){const match=data[0].invoice_number.match(/(\d+)$/);if(match)n=Number(match[1])+1;}
  return prefix+String(n).padStart(4,"0");
}

async function createInvoice(){
  clearAlert("createAlert");
  const job=jobs.find(x=>x.id===document.getElementById("jobSelect").value);
  if(!job){showAlert("createAlert","Pilih job terlebih dahulu.","err");return;}
  if(!job.customer_id){showAlert("createAlert","Job ini belum memiliki customer_id.","err");return;}
  const subtotal=Number(document.getElementById("subtotal").value||0),discount=Number(document.getElementById("discount").value||0),tax=Number(document.getElementById("tax").value||0),total=Math.max(0,subtotal-discount+tax);
  if(total<=0){showAlert("createAlert","Total invoice harus lebih dari 0.","err");return;}
  try{
    const invoice_number=await nextInvoiceNumber(),issuedAt=new Date().toISOString(),due=document.getElementById("dueAt").value;
    const payload={invoice_number,job_id:job.id,customer_id:job.customer_id,subtotal,discount,tax,total,status:"ISSUED",issued_at:issuedAt,due_at:due?new Date(due+"T23:59:59").toISOString():null,notes:document.getElementById("notes").value.trim(),created_by:currentUser.id};
    const {data,error}=await supabaseClient.from("invoices").insert(payload).select("*").single();
    if(error)throw error;
    closeModal("createModal");showAlert("pageAlert","Invoice "+invoice_number+" berhasil dibuat.","ok");await loadInvoices();await loadCompletedJobs();await viewInvoice(data.id);
  }catch(e){console.error(e);showAlert("createAlert","Gagal membuat invoice: "+e.message,"err");}
}

async function viewInvoice(id){
  selectedInvoice=invoices.find(i=>i.id===id);if(!selectedInvoice){const r=await supabaseClient.from("invoices").select("*").eq("id",id).single();selectedInvoice=r.data;}
  const [jobRes,payRes,custRes]=await Promise.all([
    supabaseClient.from("jobs").select("*").eq("id",selectedInvoice.job_id).maybeSingle(),
    supabaseClient.from("invoice_payments").select("*").eq("invoice_id",id).order("payment_date",{ascending:true}),
    supabaseClient.from("customers").select("*").eq("id",selectedInvoice.customer_id).maybeSingle()
  ]);
  const job=jobRes.data||{},cust=custRes.data||{};
  payments=payRes.data||[];
  const paid=payments.reduce((s,p)=>s+Number(p.amount||0),0),remain=Math.max(0,Number(selectedInvoice.total)-paid);
  document.getElementById("invoicePaper").innerHTML=`
    <div class="inv-head"><div><div class="company">PT Wijaya Anugrah Teknik</div><div class="muted">Wijaya AC</div><div class="muted">Jasa Service & Maintenance AC / HVAC</div></div><div class="inv-meta"><strong style="font-size:20px">${esc(selectedInvoice.invoice_number)}</strong><br><span class="badge ${String(selectedInvoice.status).toLowerCase()}">${esc(selectedInvoice.status)}</span><br><span class="muted">Tanggal: ${fmtDate(selectedInvoice.issued_at)}</span></div></div>
    <div class="two section"><div><strong>TAGIHAN KEPADA</strong><br>${esc(cust.name||job.customer_name||"-")}<br><span class="muted">${esc(cust.whatsapp||cust.phone||job.customer_phone||"")}</span><br><span class="muted">${esc(cust.address||job.customer_address||"")}</span></div><div><strong>PEKERJAAN</strong><br>${esc(job.job_code||"-")}<br>${esc(job.title||job.work_description||job.description||"-")}<br><span class="muted">Selesai: ${fmtDate(job.completed_at)}</span></div></div>
    <div class="section"><table class="table"><thead><tr><th>Deskripsi</th><th style="text-align:right">Nilai</th></tr></thead><tbody><tr><td>${esc(job.billing_detail||job.work_description||job.description||"Jasa pekerjaan")}</td><td style="text-align:right">${rupiah(selectedInvoice.subtotal)}</td></tr></tbody></table></div>
    <div class="amount"><div>Subtotal: ${rupiah(selectedInvoice.subtotal)}</div><div>Diskon: ${rupiah(selectedInvoice.discount)}</div><div>Pajak: ${rupiah(selectedInvoice.tax)}</div><div class="total">TOTAL: ${rupiah(selectedInvoice.total)}</div><div>Terbayar: ${rupiah(paid)}</div><div><strong>Sisa: ${rupiah(remain)}</strong></div></div>
    <div class="payment-box"><strong>PEMBAYARAN TRANSFER BANK</strong><br>Bank BCA<br>No. Rekening: <strong>2190176561</strong><br>a.n. <strong>Roni Wijaya</strong></div>
    <div class="section"><strong>Catatan:</strong><br>${esc(selectedInvoice.notes||"-")}</div>`;
  renderPayments(paid,remain);
  document.getElementById("paymentButton").disabled=remain<=0||selectedInvoice.status==="CANCELLED";
  openModal("detailModal");
}

function renderPayments(paid,remain){
  document.getElementById("paymentHistory").innerHTML=`<h3>Riwayat Pembayaran</h3>${payments.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Nominal</th><th>Metode</th><th>Bank</th><th>Referensi</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${fmtDate(p.payment_date)}</td><td>${rupiah(p.amount)}</td><td>${esc(p.payment_method)}</td><td>${esc(p.bank_name||"-")}</td><td>${esc(p.reference_number||"-")}</td></tr>`).join("")}</tbody></table></div>`:"<p class='muted'>Belum ada pembayaran.</p>"}<div style="margin-top:12px"><strong>Total Terbayar: ${rupiah(paid)}</strong> &nbsp; <strong>Sisa: ${rupiah(remain)}</strong></div>`;
}

function openPayment(){
  if(!selectedInvoice)return;
  document.getElementById("payDate").value=new Date().toISOString().slice(0,16);
  document.getElementById("payAmount").value="";
  document.getElementById("payRef").value="";document.getElementById("payNotes").value="";
  clearAlert("payAlert");openModal("paymentModal");
}

async function savePayment(){
  clearAlert("payAlert");
  const amount=Number(document.getElementById("payAmount").value||0);
  if(amount<=0){showAlert("payAlert","Nominal pembayaran harus lebih dari 0.","err");return;}
  const paid=payments.reduce((s,p)=>s+Number(p.amount||0),0),remain=Number(selectedInvoice.total)-paid;
  if(amount>remain){showAlert("payAlert","Pembayaran melebihi sisa tagihan.","err");return;}
  try{
    const dt=document.getElementById("payDate").value?new Date(document.getElementById("payDate").value).toISOString():new Date().toISOString();
    const payload={invoice_id:selectedInvoice.id,payment_date:dt,amount,payment_method:"TRANSFER_BANK",bank_name:document.getElementById("payBank").value.trim()||"BCA",account_number:document.getElementById("payAccount").value.trim()||"2190176561",account_name:document.getElementById("payAccountName").value.trim()||"Roni Wijaya",reference_number:document.getElementById("payRef").value.trim()||null,notes:document.getElementById("payNotes").value.trim()||null,created_by:currentUser.id};
    const {error}=await supabaseClient.from("invoice_payments").insert(payload);if(error)throw error;
    const newPaid=paid+amount, newStatus=newPaid>=Number(selectedInvoice.total)?"PAID":"PARTIAL";
    const update={status:newStatus,paid_at:newStatus==="PAID"?dt:null,updated_at:new Date().toISOString()};
    const {error:e2}=await supabaseClient.from("invoices").update(update).eq("id",selectedInvoice.id);if(e2)throw e2;
    closeModal("paymentModal");await loadInvoices();await loadCompletedJobs();await viewInvoice(selectedInvoice.id);
  }catch(e){console.error(e);showAlert("payAlert","Gagal menyimpan pembayaran: "+e.message,"err");}
}
function clearFilter(){document.getElementById("search").value="";document.getElementById("filterStatus").value="";renderInvoices();}
window.addEventListener("load",async()=>{await init();await hydratePaymentTotals();});
</script>
</body>
</html>
